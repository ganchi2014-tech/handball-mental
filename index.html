    // ====== Declarations ======
    function Declarations({ state, update, showToast }) {
      const [adding, setAdding] = useState(false);
      const active = state.declarations.find(d => !d.completed);
      const history = state.declarations.filter(d => d.completed);

      const start = (text) => {
        const decl = {
          id: uid(),
          declaration: text,
          startDate: todayStr(),
          checks: [],
          completed: false,
          createdAt: Date.now()
        };
        update({ declarations: [decl, ...state.declarations] });
        setAdding(false);
        showToast('行動宣言を開始！');
      };

      const toggleDay = (date) => {
        if (!active) return;
        const checks = active.checks || [];
        const next = checks.includes(date) ? checks.filter(c => c !== date) : [...checks, date];
        update({
          declarations: state.declarations.map(d => d.id === active.id ? {...d, checks: next} : d)
        });
      };

      const complete = () => {
        if (!active) return;
        if (!confirm('この行動宣言を完了として閉じますか？')) return;
        update({
          declarations: state.declarations.map(d => d.id === active.id ? {...d, completed: true, completedAt: Date.now()} : d)
        });
        showToast('完了！');
      };

      return (
        <>
          <div className="section-h">行動宣言</div>

          {active ? (
            <DeclarationActive d={active} onToggle={toggleDay} onComplete={complete} />
          ) : (
            <div className="card">
              <div className="card-title">進行中の宣言なし</div>
              <button className="btn mt-16" onClick={() => setAdding(true)}>+ 行動宣言を始める</button>
            </div>
          )}

          {history.length > 0 && (
            <>
              <div className="section-h">過去の宣言</div>
              {history.map(d => (
                <div key={d.id} className="list-item">
                  <div>
                    <div className="title">{d.declaration}</div>
                    <div className="sub">{d.startDate} 〜 {(d.checks||[]).length}日達成</div>
                  </div>
                </div>
              ))}
            </>
          )}

          {adding && (
            <DeclarationEditor onSave={start} onCancel={() => setAdding(false)} />
          )}
        </>
      );
    }

    function DeclarationActive({ d, onToggle, onComplete }) {
      const start = new Date(d.startDate + 'T00:00:00');
      const today = todayStr();
      const checks = d.checks || [];

      // build 4 weeks of dates starting from start
      const weeks = [];
      for (let w = 0; w < 4; w++) {
        const days = [];
        for (let dd = 0; dd < 7; dd++) {
          const dt = new Date(start);
          dt.setDate(start.getDate() + w*7 + dd);
          const ds = dateStr(dt);
          days.push(ds);
        }
        weeks.push(days);
      }
      const totalChecked = checks.length;

      return (
        <div className="card">
          <div className="card-title">
            <div>進行中：{d.declaration}</div>
          </div>
          <div className="card-subtitle">開始: {d.startDate} ／ 達成 {totalChecked} / 28日</div>
          <div className="week-grid">
            <div className="week-label"></div>
            {Array.from({length: 7}, (_, i) => ['日','月','火','水','木','金','土'][(start.getDay() + i) % 7]).map((w, i) => <div key={i} className="week-label">{w}</div>)}
            {weeks.map((days, wi) => (
              <React.Fragment key={wi}>
                <div className="week-label">第{wi+1}週</div>
                {days.map(ds => {
                  const checked = checks.includes(ds);
                  const isToday = ds === today;
                  const isFuture = ds > today;
                  return (
                    <div
                      key={ds}
                      className={'day-cell ' + (checked ? 'checked' : '') + (isToday ? ' today' : '')}
                      style={isFuture ? {opacity: 0.35, cursor: 'default'} : undefined}
                      onClick={() => { if (!isFuture) onToggle(ds); }}
                      title={ds}
                    >
                      {checked ? '✓' : parseInt(ds.slice(8, 10), 10)}
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
          <button className="btn btn-secondary mt-16" onClick={onComplete}>この宣言を完了する</button>
        </div>
      );
    }

              </label>
              {d.consultRequest && (
                <textarea style={{marginTop:8}} value={d.consultDetails} onChange={e => setD({...d, consultDetails: e.target.value})} placeholder="相談内容（任意・秘密厳守）" />
              )}
            </div>
            <button className="btn" onClick={() => onSave(d)}>{initial.id ? '更新' : '保存'}</button>
          </div>
        </div>
      );
    }

    // ====== 顧問承認待ち画面 ======
    function CoachApprovalPending({ myUid, showToast }) {
      const copyUid = () => {
        if (myUid && navigator.clipboard) {
          navigator.clipboard.writeText(myUid).then(
            () => showToast('IDをコピーしました'),
            () => showToast('コピーできませんでした')
          );
        }
      };
      return (
        <>
          <div className="section-h">管理者の承認が必要です</div>
          <div className="card">
            <div className="card-title">🔒 まだ承認されていません</div>
            <div className="card-subtitle" style={{lineHeight:1.7}}>
              選手の個人データ（メンタル記録・試合統計）は、承認された顧問だけが見られます。<br/>
              下のあなたのIDを、管理者が Firebase Console の<strong>役割に応じたリスト</strong>に登録すると使えるようになります：<br/>
              ・<strong>顧問・コーチ</strong> → <code>coaches</code>（選手のメンタル記録・試合統計・名簿管理まで見られます）<br/>
              ・<strong>マネージャー</strong> → <code>staff</code>（フィジカル入力だけ。メンタル記録には触れられません）
            </div>
          </div>

          <div className="card mt-16">
            <div className="card-title">あなたのID</div>
            <div style={{
              background:'rgba(0,0,0,0.4)', border:'1px solid var(--border)', borderRadius:8,
              padding:'12px', margin:'12px 0', wordBreak:'break-all', fontFamily:'monospace',
              fontSize:'13px', color:'var(--accent)'
            }}>
              {myUid || '(取得中...)'}
            </div>
            <button className="btn" onClick={copyUid} disabled={!myUid}>📋 IDをコピー</button>
          </div>

          <div className="card mt-16">
            <div className="card-title">登録手順（管理者が一度だけ）</div>
            <div className="card-subtitle" style={{lineHeight:1.8}}>
              1. Firebase Console → Realtime Database<br/>
              2. ルート（一番上）の「＋」をクリック<br/>
              3. 名前 = <code>coaches</code>（顧問・コーチ）または <code>staff</code>（マネージャー）を作成（既にあればそれを開く）<br/>
              4. その中に 名前 = <strong>上のID</strong>、値 = <code>true</code> を追加<br/>
              5. このページを再読込
            </div>
          </div>

          <div className="card mt-16" style={{borderLeft:'3px solid var(--warning)'}}>
            <div className="card-subtitle">
              ⚠ この仕組みにより、選手が誤って顧問モードに入っても他人のデータは見られません。
            </div>
          </div>
        </>
      );
    }

    // ====== Coach Dashboard (P2: 全選手データを Firebase RTDB から購読) ======
    function CoachDashboard({ state, allUsersData, roster, rosterToUid, matches, autoImport, onToggleAutoImport, importMatch, isApprovedCoach, myUid, showToast, team, saveTeam, onNav }) {
      const [selected, setSelected] = useState(null);
      const [tab, setTab] = useState('overview'); // overview / roster / csv / cloud
      const [teamLab, setTeamLab] = useState(null); // null | 'loading' | {uid: pct|null}

      // LAB読み的中率をオンデマンドで全員分読む（Task 3 のルールでコーチ読取可）
      const loadTeamLab = async () => {
        setTeamLab('loading');
        const out = {};
        for (const p of players) {
          try {
            const cards = await storage.getMyLabCards(p.uid);
            let n = 0, h = 0;
            cards.forEach(c => {
              const ys = Array.isArray(c && c.yomi) ? c.yomi : Object.values((c && c.yomi) || {});
              ys.forEach(y => { if (y && (y.hit === true || y.hit === false)) { n++; if (y.hit === true) h++; } });
            });
            out[p.uid] = n > 0 ? Math.round(h / n * 100) : null;
          } catch (e) { console.debug('[team lab]', p.uid, e); out[p.uid] = null; }
        }
        setTeamLab(out);
      };

      // 未取込のクラウド試合数（バッジ用）
      const pendingMatchCount = Object.values(matches || {}).filter(m => m && !m.importedAt).length;

      // RTDB のデータを選手リストに整形
      const players = useMemo(() => {
        const arr = [];
        for (const [uid, data] of Object.entries(allUsersData || {})) {
          const s = (data && data.state) || {};
          if (!s.user) continue;
          if (s.user.isCoach) continue; // 顧問本人は除外
          const statsAgg = aggregateGameStats((data && data.gameStats) || {});
          arr.push({
            uid,
            profile: s.user,
            reflections: s.reflections || [],
            izofRecords: s.izofRecords || [],
            declarations: s.declarations || [],
            selfChecks: s.selfChecks || [],
            sessionWorks: s.sessionWorks || {},
            coachNotes: (data && data.coachNotes) || {},
            consultAck: (data && data.consultAck) || {},
            monthlyReviews: s.monthlyReviews || [],
            sessionLogs: s.sessionLogs || [],
            gameStats: (data && data.gameStats) || {},
            statsGames: statsAgg.games,
            statsTotal: statsAgg.total
          });
        }
        // 名前順ソート
        arr.sort((a, b) => (a.profile.name || '').localeCompare(b.profile.name || '', 'ja'));
        return arr;
      }, [allUsersData]);

      const allConsults = useMemo(() => {
        const out = [];
        players.forEach(p => {
          (p.monthlyReviews || []).forEach(r => {
            if (r.consultRequest) {
              out.push({ ...r, _playerName: p.profile.name, _playerUid: p.uid, _acked: !!(p.consultAck && p.consultAck[r.id]) });
            }
          });
        });
        // 未対応を上に、その中で最新月から
        out.sort((a, b) => (a._acked !== b._acked) ? (a._acked ? 1 : -1) : (b.yearMonth || '').localeCompare(a.yearMonth || ''));
        return out;
      }, [players]);

      const totalReflections = players.reduce((s, p) => s + p.reflections.length, 0);
      const totalIzof        = players.reduce((s, p) => s + p.izofRecords.length, 0);
      const totalMonthly     = players.reduce((s, p) => s + p.monthlyReviews.length, 0);

      // ── 自動トリアージ（月曜朝5分で「今週気にかける選手」を出す） ──
      const triage = useMemo(() => {
        const today = todayStr();
        const daysAgo = (ds) => {
          if (!ds) return 9999;
          return Math.round((new Date(today + 'T00:00:00') - new Date(ds + 'T00:00:00')) / 86400000);
        };
        const matchDates = Object.values(matches || {}).map(m => m && m.date).filter(Boolean).sort();
        const lastMatchDate = matchDates[matchDates.length - 1] || null;

        const rows = players.map(p => {
          const reasons = [];
          let score = 0;
          // 相談希望（未対応のものは最優先）
          const consult = (p.monthlyReviews || []).find(r => r.consultRequest && !(p.consultAck && p.consultAck[r.id]));
          if (consult) { reasons.push('💬 相談希望'); score += 10; }
          // 宣言が止まっている
          const ad = (p.declarations || []).find(d => !d.completed);
          if (ad) {
            const checks = ad.checks || [];
            const last = checks.length ? [...checks].sort()[checks.length - 1] : null;
            const gap = last ? daysAgo(last) : daysAgo(ad.startDate);
            if (gap >= 3 && gap < 999) { reasons.push(`✅ 宣言${gap}日停止`); score += Math.min(gap, 7); }
          }
          // 直近試合（7日以内）の振り返り未提出（出場者のみ）
          if (lastMatchDate && daysAgo(lastMatchDate) <= 7) {
            const played = Object.values(p.gameStats || {}).some(g => Object.values(g || {}).some(r => r && r.date === lastMatchDate));
            const has = (p.reflections || []).some(r => r.gameDate === lastMatchDate);
            if (played && !has) { reasons.push('📝 直近試合の振り返り未提出'); score += 3; }
          }
          // セルフチェックの急落（最新2回で同一軸が-3以上）
          const scs = p.selfChecks || [];
          if (scs.length >= 2 && scs[0].axisScores && scs[1].axisScores) {
            const dropped = SC_AXES.filter(ax => (scs[1].axisScores[ax.key] || 0) - (scs[0].axisScores[ax.key] || 0) >= 3);
            if (dropped.length) { reasons.push(`🧭 ${dropped.map(a => a.name).join('・')}が低下`); score += 4; }
          }
          // 14日間なにも記録がない
          const dates = [
            ...(p.reflections || []).map(r => r.gameDate),
            ...(p.izofRecords || []).map(r => r.date),
            ...((ad && ad.checks) || []),
            ...(p.selfChecks || []).map(r => r.date)
          ].filter(Boolean).sort();
          const lastAct = dates[dates.length - 1] || null;
          if (!lastAct || daysAgo(lastAct) >= 14) { reasons.push('🕳 14日以上記録なし'); score += 2; }
          return { p, reasons, score };
        }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);

        // 今日のIZOF（試合朝用）
        const todayIzof = players.map(p => {
          const rec = (p.izofRecords || []).find(r => r.date === today);
          if (!rec) return null;
          const type = normIzofType(p.profile.izofType) || '';
          let warn = null;
          if (type === '高覚醒型' && rec.tension <= 2) warn = '上げ直したい？（型より低め）';
          if (type === '低覚醒型' && rec.tension >= 4) warn = '整えたい？（型より高め）';
          return { p, rec, type, warn };
        }).filter(Boolean);

        // 直近試合の振り返り提出率
        let submitStat = null;
        if (lastMatchDate) {
          const played = players.filter(p => Object.values(p.gameStats || {}).some(g => Object.values(g || {}).some(r => r && r.date === lastMatchDate)));
          if (played.length > 0) {
            const submitted = played.filter(p => (p.reflections || []).some(r => r.gameDate === lastMatchDate));
            submitStat = { date: lastMatchDate, submitted: submitted.length, played: played.length, missing: played.filter(p => !(p.reflections || []).some(r => r.gameDate === lastMatchDate)) };
          }
        }
        return { rows, todayIzof, submitStat };
      }, [players, matches]);

      if (selected) {
        return <PlayerDetail player={selected} onBack={() => setSelected(null)} showToast={showToast} />;
      }

      if (tab === 'roster') {
        return <RosterManagement roster={roster} rosterToUid={rosterToUid} allUsersData={allUsersData} showToast={showToast} onBack={() => setTab('overview')} />;
      }
      if (tab === 'csv') {
        return <CsvImport roster={roster} rosterToUid={rosterToUid} matches={matches} showToast={showToast} onBack={() => setTab('overview')} />;
      }
      if (tab === 'cloud') {
        return <CloudMatches matches={matches} roster={roster} rosterToUid={rosterToUid} autoImport={autoImport} onToggleAutoImport={onToggleAutoImport} importMatch={importMatch} showToast={showToast} onBack={() => setTab('overview')} />;
      }

      return (
        <>
          <div className="section-h">顧問Dashboard</div>

          <div className="coach-tabs" style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap'}}>
            <button className="btn btn-secondary" style={{flex:'1 1 45%'}} onClick={() => setTab('roster')}>👥 名簿管理 ({Object.keys(roster).length})</button>
            <button className="btn" style={{flex:'1 1 45%', position:'relative'}} onClick={() => setTab('cloud')}>
              ☁ クラウド試合取込
              {pendingMatchCount > 0 && <span style={{position:'absolute', top:-6, right:-6, background:'var(--warning)', color:'#000', borderRadius:10, fontSize:11, fontWeight:'bold', padding:'2px 7px'}}>{pendingMatchCount}</span>}
            </button>
            <button className="btn btn-secondary" style={{flex:'1 1 auto'}} onClick={() => setTab('csv')}>📥 CSVファイル取込</button>
            <button className="btn btn-secondary" style={{flex:'1 1 auto'}} onClick={() => onNav && onNav('physadmin')}>💪 フィジカル入力</button>
          </div>

          <div className="card">
            <div className="card-title">チーム全体</div>
            <div className="card-subtitle">
              登録選手 {players.length}名 / リアルタイム同期中
            </div>
            <div className="summary-stats" style={{marginTop:12}}>
              <div className="stat-card">
                <div className="num">{players.length}</div>
                <div className="label">登録選手</div>
              </div>
              <div className="stat-card">
                <div className="num">{totalReflections}</div>
                <div className="label">試合振り返り</div>
              </div>
              <div className="stat-card">
                <div className="num">{totalIzof}</div>
                <div className="label">IZOF記録</div>
              </div>
            </div>
          </div>

          {/* チーム成績一覧（試合データ累計。タップで個人詳細へ） */}
          {players.some(p => p.statsGames && p.statsGames.length > 0) && (
            <div className="card mt-16">
              <div className="card-title">📊 チーム成績（累計）</div>
              <div className="card-subtitle">決定率 = ゴール÷シュート（TO除く）。GKはセーブ率。タップで個人詳細。</div>
              {players
                .filter(p => p.statsGames && p.statsGames.length > 0)
                .sort((a, b) => b.statsTotal.goals - a.statsTotal.goals)
                .map(p => (
                  <div key={p.uid} className="stat-row" onClick={() => setSelected(p)} style={{cursor:'pointer'}}>
                    <span className="label">{p.profile.name}</span>
                    <span className="value">
                      {p.statsTotal.faced > 0
                        ? `🧤 ${p.statsTotal.saves}SV/枠内${p.statsTotal.faced} (${p.statsTotal.saveRate}%)`
                        : `${p.statsTotal.goals}G/${p.statsTotal.shots}S (${p.statsTotal.goalRate}%)`}
                      {p.statsTotal.turnovers > 0 ? ` TO${p.statsTotal.turnovers}` : ''}
                      {teamLab && teamLab !== 'loading' && teamLab[p.uid] != null ? ` ・読み${teamLab[p.uid]}%` : ''}
                    </span>
                  </div>
                ))}
              <button className="btn-ghost mt-16" style={{width:'100%'}} disabled={teamLab === 'loading'} onClick={loadTeamLab}>
                {teamLab === 'loading' ? '読込中...' : (teamLab ? '🔄 LAB読み的中率を再読込' : '🧪 LAB読み的中率も表示')}
              </button>
            </div>
          )}

          {/* 今週の気になる選手（自動トリアージ） */}
          {triage.rows.length > 0 && (
            <div className="card mt-16" style={{borderLeft:'3px solid var(--warning)'}}>
              <div className="card-title">👀 今週の気になる選手</div>
              <div className="card-subtitle">記録のシグナルから自動抽出（タップで詳細へ）。指導や叱責の材料にせず、声かけのきっかけに。</div>
              {triage.rows.map(({ p, reasons }) => (
                <div key={p.uid} className="list-item" onClick={() => setSelected(p)} style={{cursor:'pointer'}}>
                  <div>
                    <div className="title">{p.profile.name}</div>
                    <div className="sub">{reasons.join(' ／ ')}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* 直近試合の振り返り提出率 */}
          {triage.submitStat && (
            <div className="card mt-16">
              <div className="card-title">📝 直近試合（{triage.submitStat.date}）の振り返り</div>
              <div className="card-subtitle">
                提出 {triage.submitStat.submitted} / {triage.submitStat.played}（出場選手）
                {triage.submitStat.missing.length > 0 && triage.submitStat.missing.length <= 8 && (
                  <><br/>未提出: {triage.submitStat.missing.map(p => p.profile.name).join('・')}（督促は個別に）</>
                )}
              </div>
            </div>
          )}

          {/* 今日のIZOF（試合朝にチーム状態をひと目で） */}
          {triage.todayIzof.length > 0 && (
            <div className="card mt-16">
              <div className="card-title">🎯 今日のIZOF記録 <span className="small">{triage.todayIzof.length} / {players.length}名</span></div>
              {triage.todayIzof.map(({ p, rec, type, warn }) => (
                <div key={p.uid} className="stat-row">
                  <span className="label">{p.profile.name}{type ? `（${type.slice(0,1)}）` : ''}</span>
                  <span className="value" style={warn ? {color:'var(--warning)'} : undefined}>
                    緊{rec.tension}・集{rec.focus}・自{rec.confidence}・体{rec.condition}{warn ? `　⚠ ${warn}` : ''}
                  </span>
                </div>
              ))}
            </div>
          )}

          <TeamBoardEdit team={team || {}} saveTeam={saveTeam} showToast={showToast} players={players} />
          <CoachVoiceLog team={team || {}} players={players} showToast={showToast} />

          {allConsults.length > 0 && (() => {
            const unacked = allConsults.filter(r => !r._acked);
            return (
              <>
                <div className="section-h" style={{color: unacked.length ? 'var(--warning)' : 'var(--text-2)'}}>
                  {unacked.length ? `⚠ 相談希望 未対応${unacked.length}件` : '✓ 相談希望（すべて対応済み）'}
                </div>
                {allConsults.map((r, i) => (
                  <div
                    key={r._playerUid + '_' + (r.id || r.yearMonth || i)}
                    className={'coach-list-item' + (r._acked ? '' : ' alert')}
                    onClick={() => {
                      const p = players.find(pp => pp.uid === r._playerUid);
                      if (p) setSelected(p);
                    }}
                    style={{cursor:'pointer', opacity: r._acked ? 0.55 : 1}}
                  >
                    <div className="title">{r._playerName} さん（{r.yearMonth}）{r._acked && <span className="text-small" style={{marginLeft:8, color:'var(--success)'}}>✓ 対応済み</span>}</div>
                    <div className="sub">状態: {r.mentalState} / 練習意欲: {r.practiceMotivation}/10</div>
                    {r.consultDetails && <div className="sub" style={{marginTop:6}}>📝 {r.consultDetails}</div>}
                    {r.id && (
                      <button className="btn-ghost" style={{marginTop:8, padding:'6px 10px', fontSize:12}} onClick={async (ev) => {
                        ev.stopPropagation();
                        try {
                          if (r._acked) { await storage.unackConsult(r._playerUid, r.id); showToast('未対応に戻しました'); }
                          else { await storage.ackConsult(r._playerUid, r.id); showToast('対応済みにしました'); }
                        } catch (e) { console.warn('[consultAck]', e); showToast('保存できませんでした（ルール適用が必要）'); }
                      }}>{r._acked ? '未対応に戻す' : '対応済みにする'}</button>
                    )}
                  </div>
                ))}
              </>
            );
          })()}

          <div className="section-h">選手一覧 <span className="small">{players.length}名</span></div>
          {players.length === 0 ? (
            <div className="empty">
              <div className="empty-icon">👥</div>
              <div>まだ登録選手がいません</div>
              <div className="text-small">選手がアプリに登録すると自動で表示されます</div>
            </div>
          ) : players.map(p => {
            const lastRef = p.reflections[0];
            const lastMonthly = p.monthlyReviews[0];
            const adecl = p.declarations.find(dd => !dd.completed);
            return (
              <div key={p.uid} className="list-item" onClick={() => setSelected(p)} style={{cursor:'pointer'}}>
                <div>
                  <div className="title">{p.profile.name}</div>
                  <div className="sub">{p.profile.grade}年 / {p.profile.position} / IZOF: {normIzofType(p.profile.izofType) || '未設定'}{adecl ? ` / ✅宣言${(adecl.checks || []).length}日` : ''}</div>
                  {lastRef && <div className="sub" style={{marginTop:4, color:'var(--text-2)'}}>直近: vs {lastRef.opponent} ({lastRef.result}) {lastRef.gameDate}</div>}
                  {p.statsGames && p.statsGames.length > 0 && (
                    <div className="sub" style={{marginTop:4, color:'var(--accent)'}}>📈 {p.statsGames.length}試合 / {p.statsTotal.goals}G / 決定率{p.statsTotal.goalRate}%</div>
                  )}
                </div>
                <div className="right">
                  <div className="score">{p.reflections.length}</div>
                  <div className="sub">振り返り</div>
                </div>
              </div>
            );
          })}

          <div className="card mt-16">
            <div className="card-title">実装済みの仕組み</div>
            <div className="card-subtitle">
              ・handball-analyzer 連携 → クラウド取込で各選手に配信<br/>
              ・心の5つの力 セルフチェック（自作・個人内の推移のみ）<br/>
              ・セキュリティルール厳格化済（選手間のデータ秘匿）
            </div>
          </div>
        </>
      );
    }

    // ====== Player Detail (顧問が個別選手の詳細を見る) ======
    function PlayerDetail({ player, onBack, showToast }) {
      const p = player;
      const [lab, setLab] = useState(null); // null | 'loading' | {yomi, gkPred, pv}
      const loadLab = async () => {
        setLab('loading');
        try {
          const [cards, gkRecs, pvRecs] = await Promise.all([
            storage.getMyLabCards(p.uid),
            storage.getMyLabNode(p.uid, 'gkPredictions'),
            storage.getMyLabNode(p.uid, 'pvRecords')
          ]);
          let yn = 0, yh = 0;
          cards.forEach(c => {
            const ys = Array.isArray(c && c.yomi) ? c.yomi : Object.values((c && c.yomi) || {});
            ys.forEach(y => { if (y && (y.hit === true || y.hit === false)) { yn++; if (y.hit === true) yh++; } });
          });
          let gn = 0, gh = 0;
          gkRecs.forEach(r => { if (r && (r.hit === true || r.hit === false)) { gn++; if (r.hit === true) gh++; } });
          setLab({
            yomi: yn > 0 ? { n: yn, h: yh, pct: Math.round(yh / yn * 100) } : null,
            gkPred: gn > 0 ? { n: gn, h: gh, pct: Math.round(gh / gn * 100) } : null,
            pv: pvRecs.filter(Boolean).length
          });
        } catch (e) { console.debug('[coach lab detail]', e); setLab({ yomi: null, gkPred: null, pv: 0 }); }
      };
      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← 選手一覧に戻る</button>

          {/* LAB指標（オンデマンド読込。ルールでコーチ読取可） */}
          <div className="card mt-16">

            {lab && lab !== 'loading' && (
              <>
                {lab.yomi && <div className="stat-row"><span className="label">🔮 読み的中率</span><span className="value">{lab.yomi.pct}%（{lab.yomi.h}/{lab.yomi.n}件）</span></div>}
                {lab.gkPred && <div className="stat-row"><span className="label">🧤 GK予測的中率</span><span className="value">{lab.gkPred.pct}%（{lab.gkPred.h}/{lab.gkPred.n}本）</span></div>}
                {lab.pv > 0 && <div className="stat-row"><span className="label">🎯 PV認知記録</span><span className="value">{lab.pv} 件</span></div>}
                {!lab.yomi && !lab.gkPred && lab.pv === 0 && <div className="card-subtitle">LABの記録がまだありません（LAB未接続の選手は出ません）</div>}

          {p.sessionWorks && Object.keys(p.sessionWorks).length > 0 && (
            <>
              <div className="section-h">セッションワーク <span className="small">{Object.keys(p.sessionWorks).length}件</span></div>
              {SESSION_WORKS.filter(w => p.sessionWorks[w.id]).map(w => {

                    {w.fields.filter(f => ans[f.k]).map(f => (

                        <span className="label" style={{flex:'0 0 45%'}}>{f.label.length > 22 ? f.label.slice(0,22) + '…' : f.label}</span>
                        <span className="value" style={{textAlign:'right', whiteSpace:'pre-line'}}>{String(ans[f.k]).length > 80 ? String(ans[f.k]).slice(0,80) + '…' : ans[f.k]}</span>

          <div className="section-h">月評価 <span className="small">{p.monthlyReviews.length}件</span></div>
          {p.monthlyReviews.length === 0 ? (

          ) : p.monthlyReviews.map(r => (
            <div key={r.id} className={'coach-list-item' + (r.consultRequest ? ' alert' : '')}>
              <div className="title">{r.yearMonth}</div>

              {r.achievements && r.achievements.filter(Boolean).length > 0 && (

              )}
              {r.difficulties && <div className="sub" style={{marginTop:4}}>困: {r.difficulties}</div>}
              {r.consultRequest && r.consultDetails && (
                <div className="sub" style={{marginTop:6, color:'var(--warning)'}}>⚠ 相談: {r.consultDetails}</div>
              )}

          ))}

          <div className="section-h">試合振り返り <span className="small">{p.reflections.length}件</span></div>
          {p.reflections.length === 0 ? (
            <div className="empty"><div className="empty-icon">📝</div><div>まだ振り返りなし</div></div>
          ) : p.reflections.slice(0, 10).map(r => (
            <div key={r.id} className="list-item">
              <div>
                <div className="title">vs {r.opponent || '(未入力)'} ({r.result || '?'})</div>
                <div className="sub">{r.gameDate}</div>
                {r.mentalFinding && <div className="sub" style={{marginTop:4}}>💭 {r.mentalFinding}</div>}

              </div>

                <div className="score">{r.selfScore}</div>
                <div className="sub">/10</div>

          ))}
          {p.reflections.length > 10 && <div className="text-small text-muted">...他 {p.reflections.length - 10} 件</div>}

          <div className="section-h">IZOF記録 <span className="small">{p.izofRecords.length}件</span></div>
          {p.izofRecords.length === 0 ? (
            <div className="empty"><div className="empty-icon">🎯</div><div>まだ記録なし</div></div>
          ) : p.izofRecords.slice(0, 10).map(r => (
            <div key={r.id} className="list-item">
              <div>
                <div className="title">{r.date} {r.context && `(${r.context})`}</div>
                <div className="sub">緊張:{r.tension} 集中:{r.focus} 自信:{r.confidence} 体調:{r.condition}</div>
              </div>
            </div>
          ))}

          <div className="section-h">行動宣言</div>
          {p.declarations.length === 0 ? (
            <div className="empty"><div className="empty-icon">✅</div><div>まだ記録なし</div></div>
          ) : p.declarations.map(d => (
            <div key={d.id} className="list-item">
              <div>
                <div className="title">{d.declaration}</div>
                <div className="sub">{d.startDate}〜 / {(d.checks||[]).length}日達成 / {d.completed ? '完了' : '進行中'}</div>
              </div>

          ))}

      );
    }

    // ====== フィジカル測定: 集計・グラフ・入力（選手/顧問/マネージャー共通） ======
    // 値を「測定済みの種目だけ」抽出して数値化
    const physVal = (rec, key) => {
      const v = rec && rec.items ? rec.items[key] : undefined;
      return (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
    };

    // 1種目の時系列（古→新）を取り出す。{date, val, round} の配列（round は基準/中間/最終の強調に使う）
    function physSeries(records, key) {
      return (records || [])
        .map(r => ({ date: r.date || '', val: physVal(r, key), round: r.round || null }))
        .filter(p => p.val !== null)
        .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    }

    // 自己ベスト（lowerIsBetter を考慮）
    const physBest = (series, lowerIsBetter) => {
      if (!series.length) return null;
      return series.reduce((best, p) =>
        best === null ? p.val : (lowerIsBetter ? Math.min(best, p.val) : Math.max(best, p.val)), null);
    };

    // 直近の変化が「良化」かどうか（lowerIsBetter を考慮）。null=判定不能/横ばい
    function physTrend(series, lowerIsBetter) {
      if (series.length < 2) return { dir: 0, diff: 0 };
      const last = series[series.length - 1].val;
      const prev = series[series.length - 2].val;
      const raw = last - prev; // 生の差
      if (raw === 0) return { dir: 0, diff: 0 };
      const improved = lowerIsBetter ? raw < 0 : raw > 0;
      return { dir: improved ? 1 : -1, diff: raw };
    }

    // A: 基準比%。baseline（基準タグ or 最古点）に対する最新値の変化を、改善が＋になる符号で返す。
    // 4週ごとの前回比ではなく、基準からの累積変化を主役にする（前回比▼の下振れ表示で動機を削がないため）。
    function physBaselinePct(series, lowerIsBetter) {
      if (!series || series.length < 2) return null;
      const basePoint = series.find(p => p.round === 'baseline') || series[0];
      const base = basePoint.val;
      const latest = series[series.length - 1].val;
      if (!base) return null; // 0除算回避（率%系で基準=0のときは判定不能）
      const rawPct = (latest - base) / Math.abs(base) * 100;
      const signed = lowerIsBetter ? -rawPct : rawPct; // 改善を＋に
      return { pct: signed, base, latest, baseDate: basePoint.date };
    }
    // 基準比が誤差帯の外か（1=改善 / -1=低下 / 0=横ばい＝誤差内 or 判定不能）
    function physBaselineStatus(series, lowerIsBetter, tePct) {
      const bp = physBaselinePct(series, lowerIsBetter);
      const te = (tePct || PHYS_TE_PCT_DEFAULT);
      if (!bp) return 0;
      if (bp.pct > te) return 1;
      if (bp.pct < -te) return -1;
      return 0;
    }
    // D: 直近約6か月の身長の伸び。伸び率(6か月換算)が閾値超で急伸フラグ
    function growthSpurt(records) {
      const s = physSeries(records, 'heightCm');
      if (s.length < 2) return null;
      const latest = s[s.length - 1];
      const cutoff = new Date(latest.date + 'T00:00:00');
      cutoff.setMonth(cutoff.getMonth() - 6);
      const cutoffStr = dateStr(cutoff);
      const within = s.filter(p => p.date >= cutoffStr);
      const from = (within.length >= 2 ? within[0] : s[0]);
      const deltaCm = Math.round((latest.val - from.val) * 10) / 10;
      const months = monthsBetween(from.date, latest.date);
      const per6 = months > 0 ? deltaCm / months * 6 : 0;
      const flag = months >= 2 && per6 >= GROWTH_SPURT_CM_6MO;
      return {
        deltaCm, fromDate: from.date, toDate: latest.date,
        months: Math.round(months * 10) / 10,
        per6: Math.round(per6 * 10) / 10,
        enough: months >= 2,
        flag,
        level: !flag ? null : (per6 >= GROWTH_SPURT_CM_6MO_HIGH ? 'high' : 'watch') // 二段化: high=要配慮 / watch=注意
      };
    }

    // 1種目の推移をインラインSVG折れ線で（GameDetailのSVG前例に倣う）
    function PhysicalChart({ series, lowerIsBetter, tePct }) {
      const W = 100, H = 40, padX = 4, padY = 6;
      if (!series.length) return null;
      const te = (tePct || PHYS_TE_PCT_DEFAULT) / 100;
      // 基準点（基準タグ or 最古点）と、その ±te% の誤差帯
      const basePoint = series.find(p => p.round === 'baseline') || series[0];
      const base = basePoint.val;
      const bandLo = base * (1 - te), bandHi = base * (1 + te);
      const vals = series.map(p => p.val).concat([bandLo, bandHi, base]); // 帯も描画域に含める
      let min = Math.min(...vals), max = Math.max(...vals);
      if (min === max) { min -= 1; max += 1; } // 1点 or 全部同値でも描けるように
      const x = (i) => series.length === 1 ? W / 2 : padX + (i / (series.length - 1)) * (W - padX * 2);
      // y: 画面は上が0なので、良い値を上に出すため lowerIsBetter のとき反転
      const norm = (v) => (v - min) / (max - min); // 0..1（大きいほど上にしたい量）
      const y = (v) => {
        const up = lowerIsBetter ? (1 - norm(v)) : norm(v); // 良いほど1
        return padY + (1 - up) * (H - padY * 2);
      };
      const pts = series.map((p, i) => `${x(i)},${y(p.val)}`).join(' ');
      // 線色は「基準比」が誤差帯の外かで決める（前回比▼で色を変えない＝動機を削がない）
      const st = physBaselineStatus(series, lowerIsBetter, tePct);
      const lineColor = st === 1 ? 'var(--success)' : (st === -1 ? '#f5a900' : 'var(--primary)');
      const yA = y(bandLo), yB = y(bandHi);
      const bandTop = Math.min(yA, yB), bandH = Math.max(0.8, Math.abs(yA - yB));
      const isKey3 = (p) => p.round === 'baseline' || p.round === 'midterm' || p.round === 'final';
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%', height:52, background:'rgba(255,255,255,0.04)', borderRadius:8}}>
          {/* 誤差帯（±te%・グレー）: この範囲の上下動は測定誤差内＝横ばい扱い */}
          <rect x="0" y={bandTop} width={W} height={bandH} fill="rgba(255,255,255,0.10)" />
          <line x1="0" y1={y(base)} x2={W} y2={y(base)} stroke="rgba(255,255,255,0.30)" strokeWidth="0.5" strokeDasharray="2 2" />
          {series.length > 1 && <polyline points={pts} fill="none" stroke={lineColor} strokeWidth="1" strokeLinejoin="round" strokeLinecap="round" />}
          {series.map((p, i) => {
            const last = i === series.length - 1;
            const key3 = isKey3(p);
            return (
              <circle key={i} cx={x(i)} cy={y(p.val)}
                r={key3 ? 2.4 : (last ? 1.8 : 1.0)}
                fill={last ? lineColor : (key3 ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.40)')} />
            );
          })}
        </svg>
      );
    }

    // フィジカル表示+記録（MyStats / Playerには「自分の」、AdminにはなしでEditorを直接使う）
    function PhysicalSection({ records, isGK, canEdit, onAddClick, onDelete }) {
      const items = physItemsFor(isGK);
      const recs = records || [];
      const measuredItems = items.filter(it => physSeries(recs, it.key).length > 0);
      const gs = growthSpurt(recs); // D: 急伸フラグ（身長の伸びから）
      return (
        <>
          <div className="section-h">💪 フィジカル測定</div>
          {gs && gs.flag && (
            <div className="card" style={{borderLeft:'3px solid ' + (gs.level === 'high' ? '#ff6b6b' : '#f5a900'), marginBottom:12}}>
              <div className="card-title" style={{color: gs.level === 'high' ? '#ff6b6b' : '#f5a900'}}>
                📈 急伸期の可能性（{gs.level === 'high' ? '要配慮' : '注意'}）
              </div>
              <div className="card-subtitle">
                直近{gs.months}か月で身長 <b>+{gs.deltaCm}cm</b>（6か月換算 約{gs.per6}cm{gs.level === 'high' ? '＝年7cm超ペース' : ''}）。<br/>
                成長期は腱・骨に負担が出やすい時期。<b>高衝撃メニューは控えめ（-30%目安）</b>にして、痛みが出たら無理しない。<br/>
                <span className="text-muted">※自動の目安フラグで診断ではありません。気になる痛みは顧問・大人に相談。</span>
              </div>
            </div>
          )}
          {canEdit && (
            <button className="btn mb-16" onClick={onAddClick}>+ フィジカルを記録する</button>
          )}
          {recs.length === 0 ? (
            <div className="card">
              <div className="card-title">まだ測定記録がありません</div>
              <div className="card-subtitle">
                スピード・切り返し・跳躍などを測って記録すると、自分の成長が線で見えます。<br/>
                比べるのは <b>過去の自分とだけ</b>。1回の数字で決めつけない。
              </div>
            </div>
          ) : measuredItems.length === 0 ? (
            <div className="card"><div className="card-subtitle">記録はありますが、まだ数値の入った種目がありません。</div></div>
          ) : (
            <>
            <div className="text-small text-muted mb-16" style={{lineHeight:1.6}}>
              数字は <b>基準（最初の測定）からの変化%</b>。グレーの帯は測定誤差の目安（±{PHYS_TE_PCT_DEFAULT}%）で、<b>帯の中の上下は「横ばい」</b>＝気にしない。主役は基準・中間・最終の3点、4週ごとの点は参考。
            </div>
            <div className="phys-grid" style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
              {measuredItems.slice().sort((a,b) => (a.reference?1:0) - (b.reference?1:0)).map(it => {
                const series = physSeries(recs, it.key);
                const latest = series[series.length - 1];
                const best = physBest(series, it.lowerIsBetter);
                const te = it.tePct || PHYS_TE_PCT_DEFAULT;
                const bp = physBaselinePct(series, it.lowerIsBetter);
                const isBest = best !== null && latest.val === best;
                // A: 基準比%チップ（誤差帯内は「誤差内」、外なら符号付き%）。reference種目（gkReact）はチップを出さない
                let chip = null;
                if (!it.reference && bp) {
                  const within = Math.abs(bp.pct) <= te;
                  const col = within ? 'var(--text-3)' : (bp.pct > 0 ? 'var(--success)' : '#f5a900');
                  const txt = within ? '誤差内' : (bp.pct > 0 ? '+' : '') + bp.pct.toFixed(0) + '%';
                  chip = <span style={{marginLeft:'auto', color:col, fontWeight:700, fontSize:12}}
                    title={`基準(${bp.baseDate}) ${bp.base}${it.unit} → 最新 ${bp.latest}${it.unit}`}>基準比 {txt}</span>;
                }
                return (
                  <div key={it.key} className="card" style={{padding:12, opacity: it.reference ? 0.72 : 1}}>
                    <div className="card-title" style={{fontSize:13}}>
                      {it.name}{it.reference && <span className="text-small text-muted" style={{marginLeft:6, fontWeight:400}}>参考</span>}
                    </div>
                    <div style={{display:'flex', alignItems:'baseline', gap:6, marginTop:4}}>
                      <span style={{fontSize:22, fontWeight:800}}>{latest.val}</span>
                      <span className="text-small text-muted">{it.unit}</span>
                      {chip}
                    </div>
                    <div className="text-small text-muted" style={{marginTop:2}}>
                      自己ベスト {best}{it.unit}{isBest && <span style={{color:'var(--success)', marginLeft:6}}>★更新</span>}
                    </div>
                    <PhysicalChart series={series} lowerIsBetter={it.lowerIsBetter} tePct={te} />
                    <div className="text-small text-muted" style={{marginTop:2}}>
                      {latest.date}{latest.round && PHYS_ROUND_LABEL[latest.round] ? ` ・${PHYS_ROUND_LABEL[latest.round]}` : ''}
                    </div>
                  </div>
                );
              })}
            </div>
            </>
          )}
          {recs.length > 0 && (
            <>

    // フィジカル入力モーダル（SelfCheckEditor を雛形に）
    function PhysicalEditor({ isGK, byRole, authUid, targetName, onSave, onCancel }) {
      const items = physItemsFor(isGK);
      const inputItems = [...items, ...GROWTH_ITEMS]; // D: 身長・シューズも同じ rec.items に収める
      const [date, setDate] = useState(todayStr());
      const [round, setRound] = useState(''); // A: ''=通常(4週点・参考) / baseline / midterm / final
      const [vals, setVals] = useState({}); // {key: string}
      const [memo, setMemo] = useState('');
      const setVal = (key, v) => setVals(prev => ({ ...prev, [key]: v }));

      const submit = () => {
        const itemsObj = {};
        inputItems.forEach(it => {
          const raw = vals[it.key];
          if (raw === '' || raw === undefined || raw === null) return; // 空欄は未測定として除外
          const n = Number(raw);
          if (!isNaN(n)) itemsObj[it.key] = n;
        });
        if (Object.keys(itemsObj).length === 0) {
          if (!confirm('数値が1つも入っていません。このまま保存しますか？')) return;
        }
        const rec = {
          id: uid(),
          date: date || todayStr(),
          items: itemsObj,
          by: authUid || '',
          byRole: byRole || 'self',
          createdAt: Date.now()
        };
        if (round) rec.round = round; // A: 基準/中間/最終 のときだけ付与（通常=未付与）
        if (memo.trim()) rec.memo = memo.trim();
        onSave(rec);
      };

      // 全員種目 / GK種目で見出しを分ける
      const allItems = items.filter(it => it.group === 'all');
      const gkItems = items.filter(it => it.group === 'gk');
      const renderItem = (it) => (
        <div key={it.key} className="form-group">
          <label>{it.name}（{it.unit}）{it.reference ? ' ・参考' : (it.lowerIsBetter === undefined ? '' : (it.lowerIsBetter ? ' ↓速い/小さいほど良い' : ' ↑大きいほど良い'))}{it.selfOnly ? ' ・基準値なし(自己比較)' : ''}</label>
          <input
            type="number" inputMode="decimal" step="any"
            value={vals[it.key] === undefined ? '' : vals[it.key]}
            onChange={e => setVal(it.key, e.target.value)}
            placeholder="未測定なら空欄"
          />
        </div>
      );

      return (
        <div className="modal-overlay" onClick={() => { if (confirm('入力中の内容は保存されません。閉じますか？')) onCancel(); }}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">フィジカル測定{targetName ? `: ${targetName}` : ''}</div>
              <button className="modal-close" onClick={onCancel}>×</button>
            </div>
            <div className="text-small text-muted mb-16">
              測った種目だけ入力（空欄はスキップ）。比べるのは過去の自分とだけ。
            </div>
            <div className="form-group">
              <label>測定日</label>
              <input type="date" value={date} onChange={e => setDate(e.target.value)} />
            </div>
            <div className="form-group">
              <label>測定の位置づけ（任意・成長グラフの主役は基準/中間/最終の3点）</label>
              <div className="chip-group" style={{flexWrap:'wrap'}}>
                {[['','通常(4週点)'],['baseline','基準'],['midterm','中間'],['final','最終']].map(([v,lab]) => (
                  <div key={v} className={'chip ' + (round === v ? 'selected' : '')} onClick={() => setRound(v)}>{lab}</div>
                ))}
              </div>
            </div>
            {allItems.map(renderItem)}
            {gkItems.length > 0 && (
              <>
                <div className="section-h" style={{fontSize:14, marginTop:8}}>🧤 GK専用</div>
                {gkItems.map(renderItem)}
              </>

            <div className="section-h" style={{fontSize:14, marginTop:8}}>📈 成長記録（任意）</div>
            <div className="text-small text-muted mb-16">身長の伸びが大きい時期は、高衝撃メニューを控える目安にします（急伸フラグ）。</div>
            {GROWTH_ITEMS.map(renderItem)}

    // ====== gameStats 集計（選手・顧問で共通） ======
    function aggregateGameStats(myGameStats) {
      const games = Object.entries(myGameStats || {}).map(([gameId, rows]) => {
        const rowArr = Object.values(rows || {});
        let shots = 0, goals = 0, missed = 0, turnovers = 0;
        let saves = 0, conceded = 0; // GK: 守備行（自分がGKだった被シュート）
        let firstDate = '', opponent = '';
        rowArr.forEach(r => {
          if (!firstDate && r.date) firstDate = r.date;
          if (!opponent && r.opponent) opponent = r.opponent;
          if (r.mode === 'defense') {
            // GK配信行: save=セーブ / goal=失点（枠内のみセーブ率の分母）
            if (r.result === 'save') saves++;
            else if (r.result === 'goal') conceded++;
            return;
          }
          // TOは mode='attack', result='turnover' で届く——シュートに数えない
          if (r.result === 'turnover') {
            turnovers++;
          } else if (r.mode === 'attack') {
            shots++;
            if (r.result === 'goal') goals++;
            else missed++;
          }
        });
        const faced = saves + conceded;
        return {
          gameId,
          date: firstDate,
          opponent: opponent || '(相手名なし)',
          rowCount: rowArr.length,
          shots, goals, missed, turnovers,
          goalRate: shots > 0 ? Math.round(goals / shots * 100) : 0,
          saves, conceded, faced,
          saveRate: faced > 0 ? Math.round(saves / faced * 100) : 0,
          rows: rowArr
        };
      });
      games.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      let shots = 0, goals = 0, missed = 0, turnovers = 0, saves = 0, conceded = 0;
      games.forEach(g => { shots += g.shots; goals += g.goals; missed += g.missed; turnovers += g.turnovers; saves += g.saves; conceded += g.conceded; });
      const faced = saves + conceded;
      const total = {
        shots, goals, missed, turnovers,
        goalRate: shots > 0 ? Math.round(goals / shots * 100) : 0,
        saves, conceded, faced,
        saveRate: faced > 0 ? Math.round(saves / faced * 100) : 0
      };
      return { games, total };
    }

    // ====== My Stats (選手用: 自分のCSV取込済データを表示) ======

    // E: 練習負荷RPE（毎日の申告＋週sRPE=Σ(RPE×分)を全7日集計）【rank7】
    function LoadCard({ state, update, showToast }) {
      const logs = state.loadLogs || [];
      const today = todayStr();
      const todays = logs.find(l => l.date === today) || null;
      const [rpe, setRpe] = useState(todays ? String(todays.rpe) : '');
      const [minutes, setMinutes] = useState(todays ? String(todays.minutes) : '');
      const save = () => {
        const r = Number(rpe), m = Number(minutes);
        if (!r || !m || r <= 0 || m <= 0) { showToast && showToast('RPE(1〜10)と時間(分)を入れてください'); return; }
        const rec = { id: todays ? todays.id : uid(), date: today, rpe: Math.min(10, Math.max(1, r)), minutes: m };
        update({ loadLogs: [rec, ...logs.filter(l => l.date !== today)] });
        showToast && showToast('記録しました');
      };
      const week = weekDates();
      const weekLogs = logs.filter(l => week.includes(l.date));
      const srpe = weekLogs.reduce((s,l) => s + (Number(l.rpe)||0) * (Number(l.minutes)||0), 0);
      // 先週比%（前週 月〜日 の合計と比較）。週の急増(+LOAD_SPIKE_PCT%超)は故障リスクの目安。前週0は判定不能(null)
      const prevAnchor = dateStr(new Date(new Date(today + 'T00:00:00').getTime() - 7 * 864e5));
      const prevWeekLogs = logs.filter(l => weekDates(prevAnchor).includes(l.date));
      const prevSrpe = prevWeekLogs.reduce((s,l) => s + (Number(l.rpe)||0) * (Number(l.minutes)||0), 0);
      const loadDeltaPct = prevSrpe > 0 ? Math.round((srpe - prevSrpe) / prevSrpe * 100) : null;
      const dow = ['月','火','水','木','金','土','日'];
      return (
        <>
          <div className="section-h">🔥 練習の負荷（RPE）</div>
          <div className="card">
            <div className="card-subtitle">水曜・土日も、練習した日は「キツさ(RPE 1〜10)」と「時間(分)」を入れる。1週間の負荷を見える化（全7日）。</div>
            <div style={{display:'flex', gap:10, marginTop:10}}>
              <div className="form-group" style={{flex:1, margin:0}}>
                <label>キツさ RPE(1〜10)</label>
                <input type="number" inputMode="numeric" min="1" max="10" step="1" value={rpe} onChange={e => setRpe(e.target.value)} placeholder="例 6" />
              </div>
              <div className="form-group" style={{flex:1, margin:0}}>
                <label>時間(分)</label>
                <input type="number" inputMode="numeric" min="0" step="5" value={minutes} onChange={e => setMinutes(e.target.value)} placeholder="例 90" />
              </div>
            </div>
            <button className="btn mt-16" onClick={save}>{todays ? '今日の負荷を更新' : '今日の負荷を記録'}</button>
            <div className="stat-row mt-16"><span className="label">今週の合計 sRPE</span><span className="value">{srpe} <span className="text-small text-muted">AU</span></span></div>
            {loadDeltaPct !== null && (
              <div className="stat-row"><span className="label">先週比</span>
                <span className="value" style={loadDeltaPct > LOAD_SPIKE_PCT ? {color:'#f5a900'} : null}>
                  {loadDeltaPct > 0 ? '+' : ''}{loadDeltaPct}%{loadDeltaPct > LOAD_SPIKE_PCT ? ' ⚠急増注意' : ''}
                </span></div>
            )}
            <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginTop:10}}>
              {week.map((d,i) => {
                const l = weekLogs.find(x => x.date === d);
                const v = l ? (Number(l.rpe)||0) * (Number(l.minutes)||0) : 0;
                return (
                  <div key={d} style={{textAlign:'center'}}>
                    <div className="text-small text-muted">{dow[i]}</div>
                    <div className={v ? '' : 'text-muted'} style={{fontWeight:700, fontSize:12}}>{v || '–'}</div>
                  </div>
                );
              })}
            </div>
            <div className="text-small text-muted" style={{marginTop:6}}>sRPE = RPE × 分。週合計が前週より急に増えすぎないように（+30%超は注意）。</div>
          </div>
        </>
      );
    }

    function MyStats({ state, myGameStats, myPhysicals, authUid, onNav, onWriteReflection, showToast, update }) {
