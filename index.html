        if (!authUid || !rec || !rec.id) return;
        if (!confirm(`${rec.date} の記録を削除しますか？`)) return;
        try { await storage.delPhysical(authUid, rec.id); showToast && showToast('削除しました'); }
        catch (e) { console.warn('[delPhysical self]', e); showToast && showToast('削除できませんでした'); }
      };

      // 振り返りと試合データの紐付け
      const reflectionsByDate = useMemo(() => {
        const map = {};
        (state.reflections || []).forEach(r => {
          if (r.gameDate) map[r.gameDate] = r;
        });
        return map;
      }, [state.reflections]);

      // LAB: 記録タイル（本人の /lab/{labUid}/ をブリッジ解決して一回読み。読取不可・0件なら非表示が正）
      const [yomiStat, setYomiStat] = useState(null);
      const [gkPredStat, setGkPredStat] = useState(null);
      const [pvStat, setPvStat] = useState(null);
      useEffect(() => {
        let alive = true;
        if (!authUid) { setYomiStat(null); setGkPredStat(null); setPvStat(null); return; }
        storage.getMyLabCards(authUid)
          .then(cards => {
            if (!alive) return;
            let n = 0, h = 0;
            cards.forEach(c => {
              const ys = Array.isArray(c && c.yomi) ? c.yomi : Object.values((c && c.yomi) || {});
              ys.forEach(y => {
                if (y && (y.hit === true || y.hit === false)) { n++; if (y.hit === true) h++; }
              });
            });
            setYomiStat(n > 0 ? { n, h, pct: Math.round(h / n * 100) } : null);
          })
          .catch(e => { console.debug('[lab yomi]', e); if (alive) setYomiStat(null); });
        storage.getMyLabNode(authUid, 'gkPredictions')
          .then(recs => {
            if (!alive) return;
            let n = 0, h = 0;
            recs.forEach(r => {
              if (r && (r.hit === true || r.hit === false)) { n++; if (r.hit === true) h++; }
            });
            setGkPredStat(n > 0 ? { n, h, pct: Math.round(h / n * 100) } : null);
          })
          .catch(e => { console.debug('[lab gk]', e); if (alive) setGkPredStat(null); });
        storage.getMyLabNode(authUid, 'pvRecords')
          .then(recs => {
            if (!alive) return;
            const n = recs.filter(Boolean).length;
            setPvStat(n > 0 ? { n } : null);
          })
          .catch(e => { console.debug('[lab pv]', e); if (alive) setPvStat(null); });
        return () => { alive = false; };
      }, [authUid]);

      if (selectedGame) {
        return <GameDetail game={selectedGame} reflection={reflectionsByDate[selectedGame.date]} onBack={() => setSelectedGame(null)} onWriteReflection={onWriteReflection} />;
      }

      return (
        <>
          {(state.selfChecks && state.selfChecks.length > 0) && (
            <>
              <div className="section-h">心の5つの力（最新）</div>
              <div className="card">
                <SelfCheckBars scores={state.selfChecks[0].axisScores} />
                <button className="btn-ghost mt-16" style={{width:'100%'}} onClick={() => onNav && onNav('selfcheck')}>セルフチェックを開く →</button>
              </div>
            </>
          )}

          {/* フィジカル測定（自分のphysicals） */}
          <PhysicalSection
            records={myPhysicals}
            isGK={myIsGK}
            canEdit={true}
            onAddClick={() => setPhysEditing(true)}
            onDelete={delPhys}
          />

          {/* C: 予防チェック / E: 練習負荷RPE / F: 同意（マイ統計に集約） */}
          <PreventionCard state={state} update={update} />
          <LoadCard state={state} update={update} showToast={showToast} />
          <ConsentCard state={state} update={update} showToast={showToast} />

          {/* LABコーナー（データなし・読取不可なら非表示） */}
          {(yomiStat || gkPredStat || pvStat) && (
            <>
              <div className="section-h">LAB連携</div>
              <div className="card mb-16">
                {yomiStat && (
                  <div className="stat-row">
                    <span className="label">🔮 読み的中率</span>
                    <span className="value">{yomiStat.pct}%（的中{yomiStat.h}/丸付け{yomiStat.n}件）</span>
                  </div>
                )}
                {gkPredStat && (
                  <div className="stat-row">
                    <span className="label">🧤 GK予測的中率</span>
                    <span className="value">{gkPredStat.pct}%（的中{gkPredStat.h}/{gkPredStat.n}本）</span>
                  </div>
                )}
                {pvStat && (
                  <div className="stat-row">
                    <span className="label">🎯 PV認知記録</span>
                    <span className="value">{pvStat.n} 件</span>
                  </div>
                )}
                <div className="card-subtitle" style={{marginTop:8}}>LABの記録から（この端末のあなたの分だけ）</div>
                <button className="btn-ghost mt-16" style={{width:'100%'}}
                  onClick={() => window.open('https://ganchi2014-tech.github.io/handball-system/', '_blank')}>
                  🧪 LABを開く →
                </button>
              </div>
            </>
          )}

          <div className="section-h">マイ統計（試合データ）</div>

          {games.length === 0 ? (
            <div className="card">
              <div className="card-title">まだ試合データがありません</div>
              <div className="card-subtitle">
                顧問が handball-analyzer から CSVを取り込むと、ここに自分のデータが表示されます。
              </div>
            </div>
          ) : (
            <>
              <div className="card">
                <div className="card-title">累計</div>
                <div className="summary-stats" style={{marginTop:12}}>
                  <div className="stat-card">
                    <div className="num">{total.goals}</div>
                    <div className="label">ゴール</div>
                  </div>
                  <div className="stat-card">
                    <div className="num">{total.shots}</div>
                    <div className="label">シュート</div>
                  </div>
                  <div className="stat-card">
                    <div className="num">{total.goalRate}%</div>
                    <div className="label">決定率</div>
                  </div>
                </div>
                <div className="stat-row mt-16">
                  <span className="label">参加試合</span>
                  <span className="value">{games.length} 試合</span>
                </div>
                <div className="stat-row">
                  <span className="label">ターンオーバー</span>
                  <span className="value">{total.turnovers} 回</span>
                </div>
              </div>

              {total.faced > 0 && (
                <div className="card mt-16">
                  <div className="card-title">🧤 GK累計</div>
                  <div className="summary-stats" style={{marginTop:12}}>
                    <div className="stat-card"><div className="num">{total.saves}</div><div className="label">セーブ</div></div>
                    <div className="stat-card"><div className="num">{total.faced}</div><div className="label">枠内被シュート</div></div>
                    <div className="stat-card"><div className="num">{total.saveRate}%</div><div className="label">セーブ率</div></div>
                  </div>
                </div>
              )}

              <div className="section-h">試合別</div>
              {games.map(g => {
                const hasReflection = !!reflectionsByDate[g.date];
                return (
                  <div key={g.gameId} className="list-item" onClick={() => setSelectedGame(g)} style={{cursor:'pointer'}}>
                    <div>
                      <div className="title">vs {g.opponent}</div>
                      <div className="sub">{g.date}</div>
                      <div className="sub" style={{marginTop:4}}>
                        {g.faced > 0
                          ? `🧤 ${g.saves}セーブ / 枠内${g.faced}本 (${g.saveRate}%)` + (g.shots > 0 ? ` ・ ${g.goals}G/${g.shots}S` : '')
                          : <>{g.goals}G / {g.shots}S{g.goalRate > 0 && ` (${g.goalRate}%)`}{g.turnovers > 0 && ` / TO${g.turnovers}`}</>}
                      </div>
                      {hasReflection && (
                        <div className="sub" style={{marginTop:4, color:'var(--accent)'}}>📝 メンタル振り返り有</div>
                      )}
                    </div>
                    <div className="right">
                      <div className="score">{g.faced > 0 ? g.saves : g.goals}</div>
                      <div className="sub">{g.faced > 0 ? 'SV' : 'G'}</div>
                    </div>
                  </div>
                );
              })}
            </>
          )}

          {physEditing && (
            <PhysicalEditor
              isGK={myIsGK}
              byRole="self"
              authUid={authUid}
              onSave={savePhys}
              onCancel={() => setPhysEditing(false)}
            />
          )}
        </>
      );
    }

    function GameDetail({ game, reflection, onBack, onWriteReflection }) {
      // コース別集計
      const courseStats = {};
      game.rows.filter(r => r.mode === 'attack' && r.result !== 'turnover').forEach(r => {
        const k = r.course || '(未分類)';
        if (!courseStats[k]) courseStats[k] = { shots: 0, goals: 0 };
        courseStats[k].shots++;
        if (r.result === 'goal') courseStats[k].goals++;
      });
      const courseArr = Object.entries(courseStats).sort((a,b) => b[1].shots - a[1].shots);

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← マイ統計に戻る</button>
          <div className="section-h">{game.date} vs {game.opponent}</div>

          <div className="card">
            <div className="card-title">この試合の自分</div>
            <div className="summary-stats" style={{marginTop:12}}>
              <div className="stat-card"><div className="num">{game.goals}</div><div className="label">ゴール</div></div>
              <div className="stat-card"><div className="num">{game.shots}</div><div className="label">シュート</div></div>
              <div className="stat-card"><div className="num">{game.goalRate}%</div><div className="label">決定率</div></div>
            </div>
            <div className="stat-row mt-16"><span className="label">外し</span><span className="value">{game.missed} 本</span></div>
            <div className="stat-row"><span className="label">ターンオーバー</span><span className="value">{game.turnovers} 回</span></div>
          </div>

          {game.faced > 0 && (
            <div className="card mt-16">
              <div className="card-title">🧤 GKとしてのこの試合</div>
              <div className="summary-stats" style={{marginTop:12}}>
                <div className="stat-card"><div className="num">{game.saves}</div><div className="label">セーブ</div></div>
                <div className="stat-card"><div className="num">{game.faced}</div><div className="label">枠内被シュート</div></div>
                <div className="stat-card"><div className="num">{game.saveRate}%</div><div className="label">セーブ率</div></div>
              </div>
              <div className="stat-row mt-16"><span className="label">失点</span><span className="value">{game.conceded} 点</span></div>
            </div>
          )}

          {/* シュートマップ（analyzer座標 x,y=% をそのまま描画） */}
          {(() => {
            const pts = game.rows.filter(r => r.mode === 'attack' && r.x !== '' && r.x != null && r.y !== '' && r.y != null);
            if (pts.length === 0) return null;
            const color = (r) => r.result === 'goal' ? 'var(--success)' : (r.result === 'save' ? '#f5a900' : (r.result === 'turnover' ? 'var(--text-3)' : 'rgba(255,255,255,0.45)'));
            return (
              <div className="card mt-16">
                <div className="card-title">🗺 シュートマップ</div>
                <div className="card-subtitle">●ゴール ○セーブ/ミス ✕TO（上がゴール側）</div>
                <svg viewBox="0 0 100 75" style={{width:'100%', background:'rgba(255,255,255,0.04)', borderRadius:8, marginTop:8}}>
                  <rect x="40" y="0" width="20" height="2.2" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="0.7" />
                  <path d="M 28 0 A 24 24 0 0 0 72 0" fill="none" stroke="rgba(255,255,255,0.25)" strokeWidth="0.5" />
                  <path d="M 16 0 A 38 38 0 0 0 84 0" fill="none" stroke="rgba(255,255,255,0.14)" strokeWidth="0.5" strokeDasharray="2 2" />
                  {pts.map((r, i) => {
                    const x = Number(r.x), y = Number(r.y) * 0.75;
                    if (r.result === 'turnover') {
                      return (
                        <g key={i} stroke={color(r)} strokeWidth="0.8">
                          <line x1={x-1.5} y1={y-1.5} x2={x+1.5} y2={y+1.5} />
                          <line x1={x-1.5} y1={y+1.5} x2={x+1.5} y2={y-1.5} />
                        </g>
                      );
                    }
                    return <circle key={i} cx={x} cy={y} r="1.9"
                      fill={r.result === 'goal' ? color(r) : 'none'}
                      stroke={color(r)} strokeWidth="0.8" />;
                  })}
                </svg>
              </div>
            );
          })()}

          {/* 攻撃種別・前後半（サイドの命=速攻が見える） */}
          {(() => {
            const shots2 = game.rows.filter(r => r.mode === 'attack' && r.result !== 'turnover');
            if (shots2.length === 0) return null;
            const agg = (list) => {
              const s = list.length, g = list.filter(r => r.result === 'goal').length;
              return { s, g, rate: s > 0 ? Math.round(g / s * 100) : 0 };
            };
            const TYPES = [['set','セット'],['fast','速攻'],['7m','7m']];
            const typeRows = TYPES.map(([k, label]) => ({ label, ...agg(shots2.filter(r => (r.attack_type || 'set') === k)) })).filter(t => t.s > 0);
            const p1 = agg(shots2.filter(r => String(r.period) === '1'));
            const p2 = agg(shots2.filter(r => String(r.period) === '2'));
            return (
              <div className="card mt-16">
                <div className="card-title">種別・前後半</div>
                {typeRows.map(t => (
                  <div key={t.label} className="stat-row"><span className="label">{t.label}</span><span className="value">{t.g}/{t.s}（{t.rate}%）</span></div>
                ))}
                {(p1.s > 0 || p2.s > 0) && (
                  <div className="stat-row"><span className="label">前半 / 後半</span><span className="value">{p1.g}/{p1.s}（{p1.rate}%） ／ {p2.g}/{p2.s}（{p2.rate}%）</span></div>
                )}
              </div>
            );
          })()}

          {courseArr.length > 0 && (
            <>
              <div className="section-h">コース別</div>
              {courseArr.map(([course, s]) => {
                const rate = s.shots > 0 ? Math.round(s.goals / s.shots * 100) : 0;
                return (
                  <div key={course} className="list-item">
                    <div>
                      <div className="title">{course}</div>
                      <div className="sub">{s.goals}/{s.shots} ({rate}%)</div>
                    </div>
                    <div className="right">
                      <div className="score">{s.goals}</div>
                      <div className="sub">G</div>
                    </div>
                  </div>
                );
              })}
            </>
          )}

          {reflection && (
            <>
              <div className="section-h">メンタル振り返り</div>
              <div className="card">
                <div className="stat-row"><span className="label">調子</span><span className="value">{reflection.selfScore}/10</span></div>
                {reflection.bestPlay && <div className="stat-row"><span className="label">ベスト</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.bestPlay}</span></div>}
                {reflection.improvePlay && <div className="stat-row"><span className="label">改善</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.improvePlay}</span></div>}
                {reflection.mentalFinding && <div className="stat-row"><span className="label">気づき</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.mentalFinding}</span></div>}
                {reflection.nextTask && <div className="stat-row"><span className="label">次の課題</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.nextTask}</span></div>}
              </div>

              <div className="card mt-16">
                <div className="card-title">数字とメンタルを結びつける</div>
                <div className="card-subtitle" style={{lineHeight:1.7}}>
                  決定率 {game.goalRate}% の試合で「{reflection.mentalFinding || reflection.bestPlay || '−'}」と感じた。<br/>
                  → 次回 IZOFを記録するときは、その状態を再現できるか確認しよう。
                </div>
              </div>
            </>
          )}

          {!reflection && (
            <div className="card mt-16">
              <div className="card-title">この試合のメンタル振り返りはまだ未記録</div>
              <div className="card-subtitle">
                振り返りを書くと、ここに数字と感情を並べて見られます。
              </div>
              {onWriteReflection && (
                <button className="btn mt-16" onClick={() => onWriteReflection({ gameDate: game.date, opponent: game.opponent })}>
                  📝 この試合の振り返りを書く（日付・相手は入力済み）
                </button>
              )}
            </div>
          )}
        </>
      );
    }

    // ====== 名簿の重複グループ（統合先の選択と実行ボタン） ======
    function DupGroup({ group, rosterToUid, onMerge }) {
      // 提案はマウント時のみ採用（useStateの初期値）— 名簿更新でコーチの選択を上書きしない
      const suggested = HMDedupe.planMerge(group, rosterToUid).canonicalId;
      const [canonicalId, setCanonicalId] = useState(suggested);
      const [busy, setBusy] = useState(false);
      return (
        <div style={{marginTop:12, paddingTop:12, borderTop:'1px solid rgba(255,255,255,0.08)'}}>
          {group.entries.map(e => (
            <label key={e.id} style={{display:'flex', alignItems:'center', gap:8, padding:'4px 0', cursor:'pointer'}}>
              <input type="radio" name={'dup-' + group.key} checked={canonicalId === e.id} onChange={() => setCanonicalId(e.id)} />
              <span>
                {rosterDisplayName(e)}（{e.enrollmentYear}年入学{e.active === false ? '・引退' : ''}）
                {rosterToUid && rosterToUid[e.id]
                  ? <span style={{color:'var(--accent)'}}> ✓ 端末連携あり</span>
                  : <span className="text-muted"> 連携なし</span>}
              </span>
            </label>
          ))}
          <button className="btn-ghost mt-16" disabled={busy} onClick={async () => { setBusy(true); try { await onMerge(group, canonicalId); } finally { setBusy(false); } }}>
            {busy ? '統合中...' : `選択した行に統合（他 ${group.entries.length - 1} 行を削除）`}
          </button>
        </div>
      );
    }

    // ====== Roster Management (顧問用) ======
    function RosterManagement({ roster, rosterToUid, allUsersData, showToast, onBack }) {
      const [editing, setEditing] = useState(null); // {id, ...data} or 'new'
      const [filterGrade, setFilterGrade] = useState('all');
      const [showRetired, setShowRetired] = useState(false);

      // 名簿を配列化（学年・苗字順）。引退（active=false）は別リストに分ける
      const allEntries = useMemo(() => {
        const arr = Object.entries(roster || {}).map(([id, data]) => ({
          id,
          ...data,
          grade: computeGrade(data.enrollmentYear),
          displayName: rosterDisplayName(data)
        }));
        arr.sort((a, b) => {
          if (a.grade !== b.grade) return a.grade - b.grade;
          return (a.surname || '').localeCompare(b.surname || '', 'ja');
        });
        return arr;
      }, [roster]);
      const entries = useMemo(() => allEntries.filter(e => e.active !== false), [allEntries]);
      const retiredEntries = useMemo(() => allEntries.filter(e => e.active === false), [allEntries]);

      const filtered = filterGrade === 'all' ? entries : entries.filter(e => e.grade === Number(filterGrade));

      const linkedCount = entries.filter(e => rosterToUid && rosterToUid[e.id]).length;

      // 重複（同姓＋同入学年度）の検出と統合
      const dupGroups = useMemo(() => HMDedupe.findRosterDuplicates(roster), [roster]);

      const executeMerge = async (group, canonicalId) => {
        const plan = HMDedupe.planMerge(group, rosterToUid, canonicalId);
        const canonical = group.entries.find(e => e.id === plan.canonicalId);
        const lines = [`「${rosterDisplayName(canonical)}${canonical.active === false ? '（引退）' : ''}」に統合します。`, `削除される重複行: ${plan.deleteIds.length}件`];
        if (plan.moveUid) lines.push('端末連携を統合先に引き継ぎます。');
        if (plan.conflict) lines.push('⚠ 複数の行が別々の端末に連携済みです。統合先以外の連携は解除され、その端末は次回ログインで名簿から選び直しになります（配信済み試合データは「クラウド試合取込」の再配信で復元できます）。また、解除された選手のLAB連携も切れるため、その選手はLABアプリで名前を選び直す必要があります。');
        if (!confirm(lines.join('\n'))) return;
        try {
          if (plan.moveUid) await storage.linkRosterToUid(plan.canonicalId, plan.moveUid);
          for (const id of plan.unlinkIds) {
            // uid を引き継ぐ場合は LAB ブリッジ(labLinks)の rosterId も統合先へ付替え（失敗しても続行）
            const uid = rosterToUid[id];
            if (uid && plan.moveUid === uid) {
              try {
                const snap = await window.fbDB.ref('labLinks/' + uid).get();
                const link = snap.val();
                if (link && link.rosterId === id) {
                  await window.fbDB.ref('labLinks/' + uid + '/rosterId').set(plan.canonicalId);
                }
              } catch (e) { console.warn('[merge labLinks]', e); }
            }
            await storage.unlinkRoster(id);
          }
          for (const id of plan.deleteIds) await storage.deleteRoster(id);
          showToast(`統合しました（${plan.deleteIds.length}行を削除）`);
        } catch (e) {
          console.error('[merge]', e);
          alert('統合中にエラー: ' + e.message + '\n途中まで実行された可能性があります。重複チェックの表示を確認してください。');
        }
      };

      const seedDefault = async () => {
        const defaults = makeDefaultRosterEntries();
        // 既存（同姓＋同入学年度）はスキップして未登録分だけ投入 — 二度押しで複製しない
        const existing = new Set(Object.values(roster || {}).map(r => HMDedupe.dupKey(r)));
        const missing = defaults.filter(d => !existing.has(HMDedupe.dupKey(d)));
        if (missing.length === 0) { showToast('デフォルト名簿は投入済みです（追加なし）'); return; }
        if (!confirm(`デフォルト${defaults.length}名のうち未登録の${missing.length}名を投入しますか？\n（登録済みの${defaults.length - missing.length}名はスキップ）`)) return;
        const fbDB = window.fbDB;
        for (const entry of missing) {
          const newId = fbDB.ref('roster').push().key;
          await storage.upsertRoster(newId, entry);
        }
        showToast(`${missing.length}名を投入しました`);
      };

      const save = async (data) => {
        const fbDB = window.fbDB;
        // 新規追加のみ: 同姓＋同入学年度の既存行があれば警告（意図的な同姓別人の追加は続行可）
        if (!editing.id) {
          const key = HMDedupe.dupKey({ surname: data.surname, enrollmentYear: Number(data.enrollmentYear) });
          const dup = Object.values(roster || {}).find(r => r && HMDedupe.dupKey(r) === key);
          if (dup && !confirm(`同じ姓・同じ入学年度の「${rosterDisplayName(dup)}${dup.active === false ? '（引退）' : ''}」が既に登録されています。\n同一人物なら追加せず、既存の行を使ってください。\n\n別人として追加しますか？`)) return;
        }
        const id = editing.id || fbDB.ref('roster').push().key;
        await storage.upsertRoster(id, {
          surname: data.surname,
          fullName: data.fullName || '',
          enrollmentYear: Number(data.enrollmentYear),
          position: data.position || '',
          isGK: !!data.isGK,
          // 引退状態を保持（編集で無言復帰させない）。復帰は「復帰」ボタンから明示的に行う
          active: editing.active === false ? false : true
        });
        setEditing(null);
        showToast(editing.id ? '更新しました' : '追加しました');
      };

      const remove = async () => {
        if (!confirm(`${editing.surname} を削除しますか？\n\n試合データへの紐付けが切れますが、復元はできません。\n（卒業・引退は削除でなく「引退にする」を推奨）`)) return;
        await storage.deleteRoster(editing.id);
        setEditing(null);
        showToast('削除しました');
      };

      // 引退フラグ（active=false）— データは無傷のまま名簿・選手選択から非表示にする
      const setActive = async (id, active) => {
        await storage.upsertRoster(id, { active });
      };

      const retire = async () => {
        if (!confirm(`${editing.displayName || editing.surname} を引退にしますか？\n\n名簿・選手選択から非表示になりますが、過去の記録・連携はすべて残ります（「復帰」でいつでも戻せます）。`)) return;
        await setActive(editing.id, false);
        setEditing(null);
        showToast('引退にしました');
      };

      const grade3Actives = entries.filter(e => e.grade === 3);
      const retireGrade3 = async () => {
        const names = grade3Actives.map(e => e.displayName).join('・');
        if (!confirm(`3年生 ${grade3Actives.length}名を一括で引退にしますか？\n\n${names}\n\n過去の記録・連携はすべて残ります（「復帰」でいつでも戻せます）。`)) return;
        for (const e of grade3Actives) {
          await setActive(e.id, false);
        }
        showToast(`${grade3Actives.length}名を引退にしました`);
      };

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← 顧問Dashboardに戻る</button>
          <div className="section-h">名簿管理 <span className="small">{entries.length}名 / mental連携 {linkedCount}名</span></div>

          {dupGroups.length > 0 && (
            <div className="card" style={{borderLeft:'3px solid var(--warning)', marginBottom:16}}>
              <div className="card-title">⚠ 名簿の重複 {dupGroups.length}組</div>
              <div className="card-subtitle">同じ姓・同じ入学年度の行が複数あります。放置すると試合データが正しく配信されません（同姓でも学年が違うのは別人なのでここには出ません）。</div>
              {dupGroups.map(group => (
                <DupGroup key={group.key} group={group} rosterToUid={rosterToUid} onMerge={executeMerge} />
              ))}
            </div>
          )}

          {entries.length === 0 && (
            <div className="card">
              <div className="card-title">名簿がまだ空です</div>
              <div className="card-subtitle">analyzer のデフォルト名簿（1・2年）を投入できます</div>
              <button className="btn mt-16" onClick={seedDefault}>📋 デフォルト名簿を投入</button>
            </div>
          )}

          {entries.length > 0 && (
            <>
              <div className="chip-group" style={{marginBottom:12, flexWrap:'wrap'}}>
                {['all','1','2','3'].map(g => (
                  <div key={g} className={'chip ' + (filterGrade === g ? 'selected' : '')}
                    onClick={() => setFilterGrade(g)}
                  >{g === 'all' ? '全' : g + '年'}</div>
                ))}
              </div>
              <button className="btn mb-16" onClick={() => setEditing({grade:1})}>+ 選手を追加</button>
              {grade3Actives.length > 0 && (
                <button className="btn-ghost mb-16" style={{marginLeft:8}} onClick={retireGrade3}>🎓 3年生を一括引退（{grade3Actives.length}名）</button>
              )}
            </>
          )}

          {filtered.map(e => {
            const linked = rosterToUid && rosterToUid[e.id];
            const linkedUserData = linked && allUsersData[linked] && allUsersData[linked].state && allUsersData[linked].state.user;
            return (
              <div key={e.id} className="list-item" onClick={() => setEditing(e)} style={{cursor:'pointer'}}>
                <div>
                  <div className="title">{e.displayName} {e.fullName && <span className="text-small text-muted">({e.fullName})</span>}</div>
                  <div className="sub">
                    {e.grade > 0 && e.grade <= 3 ? `${e.grade}年` : '卒業/不明'}
                    {e.position && ` / ${e.position}`}
                    {e.isGK && ' / GK'}
                  </div>
                  <div className="sub" style={{marginTop:4, color: linked ? 'var(--accent)' : 'var(--text-3)'}}>
                    {linked ? `✓ mental連携済 (${linkedUserData ? linkedUserData.name : '?'})` : '◯ mental未連携'}
                  </div>
                </div>
                {linked && (
                  <div className="right">
                    <button className="btn-ghost" style={{padding:'6px 10px', fontSize:12}} onClick={async (ev) => {
                      ev.stopPropagation();
                      if (!confirm(`${e.displayName} の端末連携を解除しますか？\n\n選手のクラウド記録は消えません。解除後、選手は次回ログイン時に名簿から自分を選び直せます（機種変更・スマホ紛失時の復旧用）。`)) return;
                      try { await storage.unlinkRoster(e.id); showToast('連携を解除しました'); }
                      catch (err) { console.warn('[unlink]', err); showToast('解除できませんでした'); }
                    }}>連携解除</button>
                  </div>
                )}
              </div>
            );
          })}

          {retiredEntries.length > 0 && (
            <div className="card mt-16">
              <div className="card-title" style={{cursor:'pointer'}} onClick={() => setShowRetired(!showRetired)}>
                🎓 引退選手 {retiredEntries.length}名 {showRetired ? '▲' : '▼'}
              </div>
              {showRetired && retiredEntries.map(e => (
                <div key={e.id} className="list-item">
                  <div>
                    <div className="title">{e.surname} {e.fullName && <span className="text-small text-muted">({e.fullName})</span>}</div>
                    <div className="sub">{e.enrollmentYear ? `${e.enrollmentYear}年入学` : ''}{e.isGK && ' / GK'} / 引退</div>
                  </div>
                  <div className="right">
                    <button className="btn-ghost" style={{padding:'6px 10px', fontSize:12}} onClick={async () => {
                      if (!confirm(`${e.surname} を現役に復帰させますか？`)) return;
                      await setActive(e.id, true);
                      showToast('復帰しました');
                    }}>復帰</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {editing && (
            <RosterEditor
              initial={editing}
              onSave={save}
              onDelete={editing.id ? remove : null}
              onRetire={editing.id && editing.active !== false ? retire : null}
              onCancel={() => setEditing(null)}
            />
          )}

          <div className="card mt-16">
            <div className="card-title">運用ガイド</div>
            <div className="card-subtitle" style={{lineHeight:1.6}}>
              ・**入学年**を入れると学年は自動計算（4月始まり）<br/>
              ・「3年生」固定ではなく「2024年入学」のように記録<br/>
              ・年度切替時に手動更新不要<br/>
              ・analyzer 表示名 ①②③ は自動生成<br/>
              ・卒業・引退は削除でなく「引退にする」（過去の記録・連携を保持したまま非表示。「復帰」で戻せます）
            </div>
          </div>
        </>
      );
    }

    function RosterEditor({ initial, onSave, onCancel, onDelete, onRetire }) {
      const today = new Date();
      const thisYear = today.getMonth() + 1 >= 4 ? today.getFullYear() : today.getFullYear() - 1;
      const [d, setD] = useState({
        surname: initial.surname || '',
        fullName: initial.fullName || '',
        enrollmentYear: initial.enrollmentYear || (initial.grade ? thisYear - initial.grade + 1 : thisYear),
        position: initial.position || '',
        isGK: !!initial.isGK
      });
      const currentGrade = computeGrade(Number(d.enrollmentYear));
      const yearOptions = [];
      for (let y = thisYear + 1; y >= thisYear - 4; y--) yearOptions.push(y);
      return (
        <div className="modal-overlay" onClick={() => { if (confirm('入力中の内容は保存されません。閉じますか？')) onCancel(); }}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">{initial.id ? '選手編集' : '選手追加'}</div>
              <button className="modal-close" onClick={onCancel}>×</button>
            </div>
            <div className="form-group">
              <label>苗字 *（analyzer 表示用）</label>
              <input value={d.surname} onChange={e => setD({...d, surname: e.target.value})} placeholder="赤塚" />
            </div>
            <div className="form-group">
              <label>フルネーム（任意・mental表示用）</label>
              <input value={d.fullName} onChange={e => setD({...d, fullName: e.target.value})} placeholder="赤塚 太郎" />
            </div>
            <div className="form-group">
              <label>入学年（4月入学ベース）</label>
              <select value={d.enrollmentYear} onChange={e => setD({...d, enrollmentYear: e.target.value})}>
                {yearOptions.map(y => <option key={y} value={y}>{y}年入学 → 現{computeGrade(y) > 0 && computeGrade(y) <= 3 ? computeGrade(y) + '年' : computeGrade(y) > 3 ? '卒業' : '入学前'}</option>)}
              </select>
              <div className="text-small text-muted mt-16">→ analyzer表示: <strong>{gradeSymbol(currentGrade)}{d.surname || '???'}</strong></div>
            </div>
            <div className="form-group">
              <label>ポジション</label>
              <select value={d.position} onChange={e => setD({...d, position: e.target.value, isGK: e.target.value === 'GK'})}>
                <option value="">未設定</option>
                <option value="GK">GK</option>
                <option value="LW">LW</option>
                <option value="RW">RW</option>
                <option value="LB">LB</option>
                <option value="CB">CB</option>
                <option value="RB">RB</option>
                <option value="PV">PV</option>
              </select>
            </div>
            <div className="form-group">
              <label>
                <input type="checkbox" checked={d.isGK} onChange={e => setD({...d, isGK: e.target.checked})} />
                {' '}GK（analyzer の GK row に表示）
              </label>
            </div>
            <button className="btn" disabled={!d.surname} onClick={() => onSave(d)}>{initial.id ? '更新' : '追加'}</button>
            {onRetire && <button className="btn-ghost mt-16" onClick={onRetire}>🎓 引退にする（記録は残ります）</button>}
            {onDelete && <button className="btn btn-danger mt-16" onClick={onDelete}>削除</button>}
          </div>
        </div>
      );
    }

    // ====== Cloud Matches (analyzerがクラウド保存した試合をワンボタン取込) ======
    function CloudMatches({ matches, roster, rosterToUid, autoImport, onToggleAutoImport, importMatch, showToast, onBack }) {
      const [busyId, setBusyId] = useState(null);

      // 試合を整形（新しい順）
      const matchList = useMemo(() => {
        const arr = Object.entries(matches || {}).map(([id, m]) => {
          // 何名分の rosterId が含まれ、何名が mental 連携済か
          const ridSet = new Set();
          (m.rows || []).forEach(r => { if (r.rosterId) ridSet.add(r.rosterId); });
          const linkedCount = Array.from(ridSet).filter(rid => rosterToUid && rosterToUid[rid]).length;
          return {
            id,
            date: m.date || '',
            opponent: m.opponent || '(相手なし)',
            rowCount: m.rowCount || (m.rows || []).length,
            playerCount: ridSet.size,
            linkedCount,
            unlinkedCount: ridSet.size - linkedCount,
            imported: !!m.importedAt,
            importedAt: m.importedAt,
            raw: m
          };
        });
        arr.sort((a, b) => {
          if (a.imported !== b.imported) return a.imported ? 1 : -1; // 未取込を上に
          return (b.date || '').localeCompare(a.date || '');
        });
        return arr;
      }, [matches, rosterToUid]);

      const pending = matchList.filter(m => !m.imported);

      const doImport = async (m) => {
        setBusyId(m.id);
        try {
          const res = await importMatch(m.id, m.raw);
          if (res.ok) {
            showToast(`✅ ${m.opponent}: ${res.savedPlayers}名に配信` + (res.skippedNoUid ? `（未連携${res.skippedNoUid}名スキップ）` : ''));
          } else {
            showToast('取込失敗');
          }
        } finally {
          setBusyId(null);
        }
      };

      const importAll = async () => {
        if (pending.length === 0) return;
        if (!confirm(`未取込の ${pending.length} 試合をすべて配信しますか？`)) return;
        let saved = 0;
        for (const m of pending) {
          setBusyId(m.id);
          const res = await importMatch(m.id, m.raw);
          if (res && res.ok) saved += res.savedPlayers;
        }
        setBusyId(null);
        showToast(`${pending.length} 試合を一括配信（計${saved}名分）`);
      };

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← 顧問Dashboardに戻る</button>
          <div className="section-h">クラウド試合取込</div>

          <div className="card">
            <div className="card-title">仕組み</div>
            <div className="card-subtitle" style={{lineHeight:1.7}}>
              analyzer で「☁ メンタルアプリに送信」を押した試合がここに出ます。<br/>
              「取込」を押すと、各選手のアプリ（マイ統計）に自動配信されます。
            </div>
            <label style={{display:'flex', alignItems:'center', gap:10, marginTop:16, padding:'10px 12px', background:'rgba(255,255,255,0.04)', borderRadius:8, cursor:'pointer'}}>
              <input type="checkbox" checked={autoImport} onChange={e => onToggleAutoImport(e.target.checked)} />
              <div>
                <div style={{fontWeight:'bold'}}>自動取込</div>
                <div className="text-small text-muted">analyzer から届いた試合を確認なしで即配信</div>
              </div>
            </label>
            {autoImport && (
              <div className="text-small" style={{color:'var(--warning)', marginTop:8}}>
                ⚠ 自動ON中。練習試合・テストデータも即配信されます。
              </div>
            )}
          </div>

          {pending.length > 0 && (
            <button className="btn mb-16 mt-16" onClick={importAll}>
              📥 未取込 {pending.length}試合を一括配信
            </button>
          )}

          {matchList.length === 0 && (
            <div className="empty">
              <div className="empty-icon">☁</div>
              <div>クラウド試合がまだありません</div>
              <div className="text-small">analyzer で「メンタルアプリに送信」してください</div>
            </div>
          )}

          {matchList.map(m => (
            <div key={m.id} className="card" style={{marginBottom:12, opacity: m.imported ? 0.6 : 1}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                <div>
                  <div className="card-title">vs {m.opponent}</div>
                  <div className="card-subtitle">
                    {m.date} · {m.rowCount}件 · 選手{m.playerCount}名
                    {m.unlinkedCount > 0 && <span style={{color:'var(--warning)'}}> · 未連携{m.unlinkedCount}名</span>}
                  </div>
                </div>
                {m.imported && <span className="badge-coach" style={{background:'var(--success)'}}>取込済</span>}
              </div>
              {m.unlinkedCount > 0 && (
                <div className="text-small" style={{color:'var(--warning)', marginTop:8}}>
                  ⚠ {m.unlinkedCount}名はmental未登録。その選手は登録後に再取込が必要です。
                </div>
              )}
              <button
                className={'btn mt-16 ' + (m.imported ? 'btn-secondary' : '')}
                disabled={busyId === m.id || m.linkedCount === 0}
                onClick={() => doImport(m)}
              >
                {busyId === m.id ? '配信中...' : (m.imported ? '🔄 再配信' : `📥 ${m.linkedCount}名に配信`)}
              </button>
            </div>
          ))}
        </>
      );
    }

    // ====== CSV Import (analyzer出力CSV取込) ======
    // 解決ロジックは lib/dedupe.js（resolveCsvRows）。守備行はGKに配信・複数試合対応・
    // 未一致名はコーチが手動対応付け（全て解決するまで確定ボタン無効 = 黙って捨てない）
    function CsvImport({ roster, rosterToUid, matches, showToast, onBack }) {
      const [rows, setRows] = useState(null);          // パース済み全行
      const [manualMap, setManualMap] = useState({});  // {名前: rosterId|'skip'}
      const [busy, setBusy] = useState(false);

      // 表示名＋（チーム内で一意な正規化姓）→ rosterId。引退選手も含める（過去CSVのため）
      const nameToRid = useMemo(() => {
        const map = {};
        const bareCount = {};
        Object.entries(roster || {}).forEach(([rid, r]) => {
          if (!r) return;
          map[rosterDisplayName(r)] = rid;
          const bare = HMDedupe.normalizeSurname(r.surname);
          bareCount[bare] = (bareCount[bare] || 0) + 1;
        });
        Object.entries(roster || {}).forEach(([rid, r]) => {
          if (!r) return;
          const bare = HMDedupe.normalizeSurname(r.surname);
          if (bareCount[bare] === 1) map[bare] = rid; // 姓が一意なときだけ姓でも引ける
        });
        return map;
      }, [roster]);

      const resolution = useMemo(
        () => rows ? HMDedupe.resolveCsvRows(rows, nameToRid, manualMap) : null,
        [rows, nameToRid, manualMap]);

      // クラウド取込済みの試合（同じ 日付_相手）を検知 — 二重計上防止のため既定で除外
      const cloudDupIds = useMemo(() => {
        const s = new Set();
        Object.values(matches || {}).forEach(m => {
          if (m && m.importedAt) s.add(HMDedupe.csvGameId({ date: m.date, opponent: m.opponent }));
        });
        return s;
      }, [matches]);
      const [excluded, setExcluded] = useState({}); // {gameId: bool} 明示切替。未設定はcloudDupIdsに従う
      const isExcluded = (gid) => excluded[gid] !== undefined ? excluded[gid] : cloudDupIds.has(gid);

      const onFile = async (file) => {
        if (!file) return;
        const text = await file.text();
        const clean = text.replace(/^﻿/, '');
        const lines = clean.split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) { alert('データ行がありません'); return; }
        const headers = parseCsvLine(lines[0]);
        if (!headers.includes('player') || !headers.includes('result')) {
          alert('analyzer出力CSVではないようです（player / result 列が見つかりません）');
          return;
        }
        setRows(lines.slice(1).map(l => {
          const cells = parseCsvLine(l);
          const row = {};
          headers.forEach((h, i) => row[h] = cells[i] || '');
          return row;
        }));
        setManualMap({});
        setExcluded({});
      };

      const commit = async () => {
        if (!resolution) return;
        const games = Object.entries(resolution.byGame).filter(([gid]) => !isExcluded(gid));
        if (games.length === 0) { alert('取り込む試合がありません（すべて除外されています）'); return; }
        if (!confirm(`${games.length}試合を配信します。\n同じ試合ID（日付_相手）は、この試合に含まれる選手の分だけ上書きされます。よろしいですか？`)) return;
        setBusy(true);
        let savedPlayers = 0;
        const skippedNames = new Set();
        try {
          for (const [gameId, g] of games) {
            for (const [rid, ridRows] of Object.entries(g.byRid)) {
              const uid = (rosterToUid || {})[rid];
              if (!uid) {
                const r = roster[rid];
                skippedNames.add(r ? rosterDisplayName(r) : rid);
                continue;
              }
              const rowsObj = {};
              ridRows.forEach((row, i) => { rowsObj[i] = row; });
              await storage.saveGameStatsBulk(uid, gameId, rowsObj); // set() = 同一試合はまるごと置換
              savedPlayers++;
            }
          }
          let msg = `✅ ${games.length}試合を配信（延べ${savedPlayers}名分）`;
          if (skippedNames.size > 0) msg += `\n⚠ mental未連携でスキップ: ${Array.from(skippedNames).join('・')}\n（選手がログインで連携したあと、同じCSVを再取込してください）`;
          alert(msg);
          setRows(null); setManualMap({}); setExcluded({});
        } catch (e) {
          console.error(e);
          alert('保存中にエラー: ' + e.message + '\nここまでに延べ' + savedPlayers + '名分を保存済みです。同じCSVを再取込すれば安全に上書きで続行できます。');
        } finally {
          setBusy(false);
        }
      };

      const unresolvedCount = resolution ? resolution.unmatched.filter(n => !manualMap[n]).length : 0;

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← 顧問Dashboardに戻る</button>
          <div className="section-h">CSV取込（analyzer出力）</div>

          {!rows && (
            <>
              <div className="card">
                <div className="card-title">使い方</div>
                <div className="card-subtitle" style={{lineHeight:1.7}}>
                  1. handball-analyzer で試合データをCSVエクスポート<br/>
                  2. このページでCSVファイルを選択（複数試合が混ざったCSVもOK）<br/>
                  3. プレビューで紐付けを確認 → 確定<br/>
                  4. 各選手のマイ統計に配信（GKのセーブ率も入ります）
                </div>
              </div>
              <div className="card mt-16">
                <label className="btn" style={{display:'block', textAlign:'center'}}>
                  📁 CSVファイルを選択
                  <input type="file" accept=".csv,text/csv" style={{display:'none'}}
                    onChange={e => onFile(e.target.files[0])} />
                </label>
              </div>
            </>
          )}

          {resolution && (
            <>
              <div className="card">
                <div className="card-title">プレビュー</div>
                <div className="summary-stats" style={{marginTop:12}}>
                  <div className="stat-card"><div className="num">{Object.keys(resolution.byGame).length}</div><div className="label">試合</div></div>
                  <div className="stat-card"><div className="num" style={{color:'var(--success)'}}>{resolution.matchedRows}</div><div className="label">紐付OK行</div></div>
                  <div className="stat-card"><div className="num" style={{color: resolution.unmatched.length ? 'var(--warning)' : 'var(--text-3)'}}>{resolution.unmatched.length}</div><div className="label">要対応の名前</div></div>
                </div>
              </div>

              {resolution.unmatched.length > 0 && (
                <div className="card mt-16" style={{borderLeft:'3px solid var(--warning)'}}>
                  <div className="card-title">⚠ 名簿と一致しない名前</div>
                  <div className="card-subtitle">名簿の選手を指定するか「取り込まない」を選んでください（全部決めるまで確定できません）。</div>
                  {resolution.unmatched.map(n => (
                    <div key={n} className="stat-row">
                      <span className="label">{n}</span>
                      <select value={manualMap[n] || ''} onChange={e => setManualMap({ ...manualMap, [n]: e.target.value })}>
                        <option value="">（未選択）</option>
                        <option value="skip">取り込まない</option>
                        {Object.entries(roster || {}).map(([rid, r]) => (
                          <option key={rid} value={rid}>{rosterDisplayName(r)}{r.active === false ? '（引退）' : ''}</option>
                        ))}
                      </select>
                    </div>
                  ))}
                </div>
              )}

              <div className="section-h mt-16">試合別の配信先</div>
              {Object.entries(resolution.byGame).map(([gameId, g]) => (
                <div key={gameId} className="card" style={{marginBottom:12}}>
                  <div className="card-title">{gameId}</div>
                  <div className="card-subtitle" style={{lineHeight:1.8}}>
                    {Object.entries(g.byRid).map(([rid, ridRows]) => {
                      const r = roster[rid];
                      const linked = (rosterToUid || {})[rid];
                      return (
                        <span key={rid} style={{marginRight:10, color: linked ? undefined : 'var(--warning)'}}>
                          {r ? rosterDisplayName(r) : rid} {ridRows.length}行{linked ? '' : '（未連携→スキップ）'}
                        </span>
                      );
                    })}
                  </div>
                  {cloudDupIds.has(gameId) && (
                    <div className="text-small" style={{color:'var(--warning)', marginTop:6}}>
                      ⚠ クラウド取込済みの試合と同じ日付・相手です。二重に取り込むと成績が水増しされます。
                    </div>
                  )}
                  <label style={{display:'flex', alignItems:'center', gap:8, marginTop:8, cursor:'pointer'}}>
                    <input type="checkbox" checked={!isExcluded(gameId)}
                      onChange={e => setExcluded({ ...excluded, [gameId]: !e.target.checked })} />
                    <span className="text-small">この試合を取り込む</span>
                  </label>
                </div>
              ))}

              <div style={{display:'flex', gap:8, marginTop:16}}>
                <button className="btn btn-secondary" style={{flex:1}} onClick={() => { setRows(null); setManualMap({}); setExcluded({}); }}>キャンセル</button>
                <button className="btn" style={{flex:1}} disabled={busy || resolution.matchedRows === 0 || unresolvedCount > 0 || Object.keys(resolution.byGame).every(gid => isExcluded(gid))} onClick={commit}>
                  {busy ? '保存中...' : (unresolvedCount > 0 ? `未対応の名前が${unresolvedCount}件` : '確定して配信')}
                </button>
              </div>
            </>
          )}
        </>
      );
    }

    // 簡易CSVパーサ（クォート対応）
    function parseCsvLine(line) {
      const result = [];
      let cur = '';
      let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQ) {
          if (c === '"') {
            if (line[i+1] === '"') { cur += '"'; i++; }
            else inQ = false;
          } else cur += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') { result.push(cur); cur = ''; }
          else cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    // ====== Mount ======
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
