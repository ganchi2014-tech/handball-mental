  <style>
    :root {
      --bg: #0a101e;
      --bg-2: #0f172a;
      --card: rgba(255,255,255,0.05);
      --card-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.1);
      --primary: #ff3b5a;
      --primary-dark: #c41e3a;
      --accent: #4ecdc4;
      --accent-dark: #2c8a82;
      --warning: #fbbf24;
      --success: #10b981;
      --text-1: #f0f4f8;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --shadow: 0 4px 16px rgba(0,0,0,0.3);

      --fs-xs: 11px;
      --fs-sm: 13px;
      --fs-md: 15px;
      --fs-lg: 18px;
      --fs-xl: 22px;
      --fs-2xl: 28px;
      --fs-3xl: 36px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text-1);
      min-height: 100vh;
      font-size: var(--fs-md);
      line-height: 1.5;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea, select { font-family: inherit; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 80px;
      position: relative;
    }

    /* Login */
    .login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, rgba(255,59,90,0.15) 0%, transparent 60%);
    }
    .login h1 {
      font-size: var(--fs-3xl);
      margin: 0 0 8px;
      letter-spacing: 1px;
    }
    .login .subtitle {
      color: var(--text-2);
      margin-bottom: 40px;
      text-align: center;
    }
    .login-card {
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow);
    }
    .login-card h2 {
      margin: 0 0 16px;
      font-size: var(--fs-lg);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: var(--fs-sm);
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1);
      font-size: var(--fs-md);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--primary);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .pin-input {
      letter-spacing: 8px;
      text-align: center;
      font-size: var(--fs-xl) !important;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      color: white;
      border-radius: 10px;
      font-size: var(--fs-md);
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255,59,90,0.3);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-1);
      box-shadow: none;
    }
    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--accent);
      padding: 8px 12px;
      box-shadow: none;
      font-size: var(--fs-sm);
      width: auto;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(20px);
      background: rgba(10,16,30,0.8);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-name { font-weight: 600; }
    .header-sub { font-size: var(--fs-xs); color: var(--text-2); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .badge-coach {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      font-size: var(--fs-xs);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* Main content */
    .content { padding: 16px; }
    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: var(--fs-md);
      font-weight: 600;
      margin: 0 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title .icon { font-size: 20px; }
    .card-subtitle { color: var(--text-2); font-size: var(--fs-sm); margin-bottom: 12px; }

    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .stat-row:last-child { border-bottom: none; }
    .stat-row .label { color: var(--text-2); }
    .stat-row .value { font-weight: 600; }

    .greeting { font-size: var(--fs-xl); margin: 0 0 4px; }
    .greeting-sub { color: var(--text-2); margin-bottom: 24px; }

    /* Quick actions grid */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .quick-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      color: var(--text-1);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .quick-tile:active { transform: scale(0.97); background: var(--card-hover); }
    .quick-tile .tile-icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .quick-tile .tile-title { font-weight: 600; margin-bottom: 4px; }
    .quick-tile .tile-sub { font-size: var(--fs-sm); color: var(--text-2); }

    /* Bottom navigation */
    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      display: flex;
      background: rgba(10,16,30,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      padding: 8px 4px;
      background: none;
      border: none;
      color: var(--text-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: var(--fs-xs);
    }
    .nav-item.active { color: var(--primary); }
    .nav-item .nav-icon { font-size: 22px; }

    /* List items */
    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .list-item:active { background: var(--card-hover); }
    .list-item .title { font-weight: 600; margin-bottom: 4px; }
    .list-item .sub { font-size: var(--fs-sm); color: var(--text-2); }
    .list-item .right { text-align: right; }
    .list-item .right .score {
      font-size: var(--fs-xl);
      font-weight: 700;
      color: var(--accent);
    }

    /* IZOF chips */
    .izof-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .izof-cell {
      padding: 10px 0;
      text-align: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .izof-cell.selected {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .izof-row { margin-bottom: 12px; }
    .izof-row .label { font-size: var(--fs-sm); color: var(--text-2); }

    /* Result chips (勝負引) */
    .chip-group { display: flex; gap: 8px; }
    .chip {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .chip.selected { background: var(--primary); border-color: var(--primary); }

    /* Slider score */
    .score-display {
      text-align: center;
      font-size: var(--fs-2xl);
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .slider {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255,59,90,0.5);
    }

    /* 4-week tracker */
    .week-grid {
      display: grid;
      grid-template-columns: 36px repeat(7, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .week-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-xs);
      color: var(--text-2);
    }
    .day-cell {
      aspect-ratio: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: var(--fs-xs);
      color: var(--text-2);
      transition: all 0.15s;
    }
    .day-cell.checked {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .day-cell.today { border-color: var(--primary); border-width: 2px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding: 0;
    }
    .modal {
      background: var(--bg-2);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title { font-size: var(--fs-lg); font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-2);
      font-size: 24px;
      padding: 0;
      width: 32px;
      height: 32px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-2);
    }
    .empty .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Section heading */
    .section-h {
      margin: 24px 0 12px;
      font-size: var(--fs-lg);
      font-weight: 600;
    }
    .section-h .small { font-size: var(--fs-sm); color: var(--text-2); margin-left: 8px; font-weight: 400; }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      z-index: 300;
      animation: toastIn 0.3s ease-out;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Pull-down etc */
    .info-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .info-row > * { flex: 1; }

    .text-muted { color: var(--text-2); }
    .text-small { font-size: var(--fs-sm); }
    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .mt-16 { margin-top: 16px; }
    .text-center { text-align: center; }

    /* Stats summary */
    .summary-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .stat-card .num {
      font-size: var(--fs-xl);
      font-weight: 700;
      color: var(--accent);
    }
    .stat-card .label {
      font-size: var(--fs-xs);
      color: var(--text-2);
      margin-top: 2px;
    }

    /* Coach mode list */
    .coach-list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .coach-list-item.alert { border-color: var(--warning); }

    .accordion {
      margin-bottom: 8px;
      border-radius: 10px;
      overflow: hidden;
    }
    .accordion-header {
      padding: 12px;
      background: var(--card);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .accordion-body {
      padding: 12px;
      background: rgba(0,0,0,0.2);
      font-size: var(--fs-sm);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ====== Storage Layer (localStorage キャッシュ + Firebase RTDB クラウド同期) ======
    const CACHE_KEY = 'handball-mental-v2';
    const STORAGE_KEY = CACHE_KEY; // 旧名互換
    const PIN_KEY = 'mental_pin_hash';
    const NAME_KEY = 'mental_user_name';

    function defaultState() {
      return {
        user: null,
        reflections: [],
        monthlyReviews: [],
        izofRecords: [],
        declarations: [],
        sessionLogs: []
      };
    }

    const fbAuth = (typeof window !== 'undefined') ? window.fbAuth : null;
    const fbDB   = (typeof window !== 'undefined') ? window.fbDB   : null;

    const storage = {
      // ----- ローカルキャッシュ（即時、オフライン耐性） -----
      loadCache: () => {
        try {
          // v2優先、なければv1から移行
          let raw = localStorage.getItem(CACHE_KEY);
          if (!raw) {
            const v1 = localStorage.getItem('handball-mental-v1');
            if (v1) {
              raw = v1;
              localStorage.setItem(CACHE_KEY, v1);
            }
          }
          if (!raw) return defaultState();
          return { ...defaultState(), ...JSON.parse(raw) };
        } catch {
          return defaultState();
        }
      },
      saveCache: (state) => {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) { console.warn('[cache save]', e); }
      },
      // ----- クラウド同期（Firebase RTDB） -----
      saveCloud: (uid, state) => {
        if (!fbDB || !uid) return Promise.resolve();
        return fbDB.ref('users/' + uid + '/state').set(state)
          .catch(e => { console.warn('[RTDB save]', e); throw e; });
      },
      subscribeCloud: (uid, callback) => {
        if (!fbDB || !uid) return () => {};
        const ref = fbDB.ref('users/' + uid + '/state');
        const handler = ref.on('value', (snap) => callback(snap.val()));
        return () => ref.off('value', handler);
      },
      // ----- 顧問用: 全選手データ -----
      subscribeAllUsers: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('users');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      // ----- 顧問承認リスト（Console から手動登録） -----
      subscribeCoaches: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('coaches');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      // ----- 名簿マスター（analyzer と共有） -----
      subscribeRoster: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('roster');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      upsertRoster: async (rosterId, data) => {
        if (!fbDB) return;
        const payload = { ...data, updatedAt: firebase.database.ServerValue.TIMESTAMP };
        if (!data.createdAt) payload.createdAt = firebase.database.ServerValue.TIMESTAMP;
        return fbDB.ref('roster/' + rosterId).update(payload);
      },
      deleteRoster: async (rosterId) => {
        if (!fbDB) return;
        return fbDB.ref('roster/' + rosterId).remove();
      },
      // ----- rosterId ↔ uid 双方向マッピング -----
      linkRosterToUid: async (rosterId, authUid) => {
        if (!fbDB || !rosterId || !authUid) return;
        return fbDB.ref('rosterToUid/' + rosterId).set(authUid);
      },
      subscribeRosterToUid: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('rosterToUid');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      // ----- 試合データ（CSV取込 or クラウド試合取込） -----
      saveGameStats: async (authUid, gameId, rowIdx, statsRow) => {
        if (!fbDB || !authUid) return;
        return fbDB.ref('users/' + authUid + '/gameStats/' + gameId + '/' + rowIdx).set(statsRow);
      },
      // 1選手の1試合分をまとめて保存（クラウド取込用、高速）
      saveGameStatsBulk: async (authUid, gameId, rowsObj) => {
        if (!fbDB || !authUid) return;
        return fbDB.ref('users/' + authUid + '/gameStats/' + gameId).set(rowsObj);
      },
      subscribeMyGameStats: (authUid, callback) => {
        if (!fbDB || !authUid) return () => {};
        const ref = fbDB.ref('users/' + authUid + '/gameStats');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      // ----- クラウド試合（analyzer が保存、顧問が取込） -----
      subscribeMatches: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('matches');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      markMatchImported: async (matchId, coachUid) => {
        if (!fbDB) return;
        return fbDB.ref('matches/' + matchId + '/importedAt').set(firebase.database.ServerValue.TIMESTAMP);
      }
    };

    // ====== Roster Helpers（学年自動計算） ======
    // 入学年から現在の学年を計算（4月始まり）
    function computeGrade(enrollmentYear, refDate) {
      if (!enrollmentYear) return 0;
      const d = refDate || new Date();
      // 学校年度: 4月1日始まり
      const schoolYear = (d.getMonth() + 1) >= 4 ? d.getFullYear() : d.getFullYear() - 1;
      return schoolYear - enrollmentYear + 1;
    }
    // 学年→丸数字 (analyzer互換: ①②③)
    function gradeSymbol(grade) {
      return ['', '①', '②', '③'][grade] || '';
    }
    // 名簿エントリから analyzer 表示名を作る
    function rosterDisplayName(roster, refDate) {
      const g = computeGrade(roster.enrollmentYear, refDate);
      return gradeSymbol(g) + (roster.surname || '');
    }
    // analyzer の名前 (③赤塚) から surname と grade を取出す
    function parseAnalyzerName(name) {
      const m = String(name || '').match(/^([①②③])(.+)$/);
      if (m) {
        const grade = ['①','②','③'].indexOf(m[1]) + 1;
        return { surname: m[2], grade };
      }
      return { surname: name, grade: 0 };
    }
    // 入学年を学年から逆算（今年度ベース）
    function gradeToEnrollmentYear(grade, refDate) {
      const d = refDate || new Date();
      const schoolYear = (d.getMonth() + 1) >= 4 ? d.getFullYear() : d.getFullYear() - 1;
      return schoolYear - grade + 1;
    }
    // analyzer互換: デフォルト32名（入学年は今年度から逆算）
    function makeDefaultRosterEntries(refDate) {
      const d = refDate || new Date();
      const g3 = gradeToEnrollmentYear(3, d);
      const g2 = gradeToEnrollmentYear(2, d);
      const g1 = gradeToEnrollmentYear(1, d);
      const gkSet = new Set(['桑原','杉本','小川','田口','関山']);
      const list = [
        // 3年（10名）
        ['赤塚',g3],['岩噌',g3],['川崎',g3],['北村',g3],['辻',g3],['中田',g3],['伴',g3],['山本',g3],['桑原',g3],['杉本',g3],
        // 2年（10名）
        ['新井',g2],['猪田',g2],['北林',g2],['田端',g2],['藤川',g2],['松岡',g2],['村田',g2],['安田',g2],['小川',g2],['田口',g2],
        // 1年（12名）
        ['石黒',g1],['岩噌',g1],['大野',g1],['北川',g1],['嶌本',g1],['福原',g1],['増田',g1],['水田',g1],['宮崎',g1],['森井',g1],['山崎',g1],['関山',g1]
      ];
      return list.map(([surname, enrollmentYear]) => ({
        surname,
        fullName: '',
        enrollmentYear,
        position: gkSet.has(surname) ? 'GK' : '',
        isGK: gkSet.has(surname),
        active: true
      }));
    }

    // 旧APIを維持（既存呼び出しのため）
    storage.load = storage.loadCache;
    storage.save = storage.saveCache;

    // ====== Hash for PIN (simple, not cryptographic but ok for v1) ======
    function hashPin(pin) {
      let h = 0;
      const s = String(pin) + '|handball-mental|salt';
      for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h |= 0;
      }
      return String(h);
    }

    // ====== Helpers ======
    const uid = () => Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
    const todayStr = () => new Date().toISOString().slice(0, 10);
    const fmtDate = (s) => {
      if (!s) return '';
      const [y,m,d] = s.split('-');
      return `${m}/${d}`;
    };

    // ====== App ======
    function App() {
      const [state, setState] = useState(() => storage.loadCache());
      const [view, setView] = useState('home');
      const [toast, setToast] = useState(null);
      const [authUid, setAuthUid] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [allUsersData, setAllUsersData] = useState({});
      const [syncStatus, setSyncStatus] = useState('cache'); // cache/syncing/synced/offline
      const [roster, setRoster] = useState({});         // {rosterId: {...}}
      const [rosterToUid, setRosterToUid] = useState({}); // {rosterId: authUid}
      const [coaches, setCoaches] = useState({});         // {authUid: true} 顧問承認リスト
      const [myGameStats, setMyGameStats] = useState({}); // 自分のCSV取込済データ
      const [matches, setMatches] = useState({});         // クラウド試合（analyzer保存）
      const [autoImport, setAutoImport] = useState(() => localStorage.getItem('mental_auto_import') === '1');
      const lastCloudJsonRef = useRef('');
      const writeTimerRef = useRef(null);
      const firstCloudLoadRef = useRef(false);

      // ── 名簿マスター・顧問承認リスト購読（常時）
      useEffect(() => {
        if (!fbDB) return;
        const unsub1 = storage.subscribeRoster(setRoster);
        const unsub2 = storage.subscribeRosterToUid(setRosterToUid);
        const unsub3 = storage.subscribeCoaches(setCoaches);
        return () => { unsub1(); unsub2(); unsub3(); };
      }, []);

      // 顧問承認済みか（サーバ /coaches に登録されているか）
      const isApprovedCoach = !!(authUid && coaches[authUid]);

      // ── 自分の試合データ（CSV取込済）購読
      useEffect(() => {
        if (!authUid) { setMyGameStats({}); return; }
        const unsub = storage.subscribeMyGameStats(authUid, setMyGameStats);
        return unsub;
      }, [authUid]);

      // ── クラウド試合購読（顧問のみ）
      useEffect(() => {
        if (!authUid || !state.user || !state.user.isCoach) { setMatches({}); return; }
        const unsub = storage.subscribeMatches(setMatches);
        return unsub;
      }, [authUid, state.user && state.user.isCoach]);

      // ── クラウド試合を各選手の gameStats に取込（ワンボタン/自動共通）
      const importMatch = useCallback(async (matchId, matchData) => {
        if (!matchData || !matchData.rows) return { ok: false, reason: 'no rows' };
        const byRoster = {};
        for (const row of matchData.rows) {
          const rid = row.rosterId;
          if (!rid) continue;
          if (!byRoster[rid]) byRoster[rid] = {};
          const idx = Object.keys(byRoster[rid]).length;
          byRoster[rid][idx] = row;
        }
        let savedPlayers = 0, skippedNoUid = 0;
        const gameId = matchId;
        for (const [rid, rowsObj] of Object.entries(byRoster)) {
          const targetUid = rosterToUid[rid];
          if (!targetUid) { skippedNoUid++; continue; }
          try {
            await storage.saveGameStatsBulk(targetUid, gameId, rowsObj);
            savedPlayers++;
          } catch (e) { console.warn('[importMatch]', rid, e); }
        }
        await storage.markMatchImported(matchId, authUid);
        return { ok: true, savedPlayers, skippedNoUid };
      }, [rosterToUid, authUid]);

      // ── 自動取込（トグルON時、未取込試合を自動配信）
      const isCoachNow = state.user && state.user.isCoach;
      useEffect(() => {
        if (!autoImport || !isCoachNow) return;
        const pending = Object.entries(matches).filter(([id, m]) => m && !m.importedAt);
        if (pending.length === 0) return;
        (async () => {
          for (const [id, m] of pending) {
            const res = await importMatch(id, m);
            if (res && res.ok) showToast(`自動取込: ${m.opponent}（${res.savedPlayers}名）`);
          }
        })();
      }, [matches, autoImport, isCoachNow, importMatch]);

      // ── Firebase 認証状態監視
      useEffect(() => {
        if (!fbAuth) {
          setAuthReady(true);
          setSyncStatus('offline');
          return;
        }
        const unsub = fbAuth.onAuthStateChanged((user) => {
          setAuthUid(user ? user.uid : null);
          setAuthReady(true);
        });
        return unsub;
      }, []);

      // ── クラウドからのリアルタイム同期（自分のデータ）
      useEffect(() => {
        if (!authUid || !state.user) return;
        setSyncStatus('syncing');
        firstCloudLoadRef.current = false;
        const unsub = storage.subscribeCloud(authUid, (cloudState) => {
          if (cloudState) {
            const json = JSON.stringify(cloudState);
            if (json === lastCloudJsonRef.current) {
              setSyncStatus('synced');
              return;
            }
            lastCloudJsonRef.current = json;
            setState(prev => ({ ...prev, ...cloudState }));
            setSyncStatus('synced');
          } else {
            // クラウドに無い → 初回アップロード
            const json = JSON.stringify(state);
            lastCloudJsonRef.current = json;
            storage.saveCloud(authUid, state).then(() => setSyncStatus('synced'));
          }
          firstCloudLoadRef.current = true;
        });
        return unsub;
      }, [authUid, state.user && state.user.id]);

      // ── 顧問モード: 全選手データ購読
      useEffect(() => {
        if (!authUid || !state.user || !state.user.isCoach) {
          setAllUsersData({});
          return;
        }
        const unsub = storage.subscribeAllUsers(setAllUsersData);
        return unsub;
      }, [authUid, state.user && state.user.isCoach]);

      // ── 永続化: localStorage 即時 + RTDB デバウンス（500ms）
      useEffect(() => {
        storage.saveCache(state);
        if (!authUid || !state.user) return;
        const json = JSON.stringify(state);
        if (json === lastCloudJsonRef.current) return; // クラウドから来たデータは送り返さない
        if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
        setSyncStatus('syncing');
        writeTimerRef.current = setTimeout(() => {
          lastCloudJsonRef.current = json;
          storage.saveCloud(authUid, state)
            .then(() => setSyncStatus('synced'))
            .catch(() => setSyncStatus('offline'));
        }, 500);
      }, [state, authUid]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      // 認証準備中
      if (!authReady) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">接続中...</p>
          </div>
        );
      }

      // ログイン画面（プロフィール未設定 or Firebase認証なし）
      if (!state.user) {
        return (
          <>
            <Login
              roster={roster}
              rosterToUid={rosterToUid}
              onLogin={async (userInput) => {
                try {
                  let uid = authUid;
                  if (!uid && fbAuth) {
                    const cred = await fbAuth.signInAnonymously();
                    uid = cred.user.uid;
                  }
                  const finalUser = {
                    ...userInput,
                    id: uid || userInput.id, // Firebase uid を採用（失敗時はローカルid）
                  };
                  // rosterId が指定されていれば双方向マップを保存
                  if (userInput.rosterId && uid) {
                    try { await storage.linkRosterToUid(userInput.rosterId, uid); }
                    catch (e) { console.warn('[link roster]', e); }
                  }
                  setState(prev => ({ ...prev, user: finalUser }));
                } catch (e) {
                  console.error('[Login] auth failed:', e);
                  alert('オンライン接続に失敗しました。インターネット接続を確認してください。\n' + e.message);
                }
              }}
            />
            {toast && <div className="toast">{toast}</div>}
          </>
        );
      }

      const update = (patch) => setState(prev => ({ ...prev, ...patch }));
      const handleLogout = async () => {
        try { if (fbAuth) await fbAuth.signOut(); } catch (e) { console.warn(e); }
        localStorage.removeItem(PIN_KEY);
        localStorage.removeItem(NAME_KEY);
        localStorage.removeItem(CACHE_KEY);
        lastCloudJsonRef.current = '';
        setState(defaultState());
      };

      return (
        <div className="app">
          <Header
            user={state.user}
            syncStatus={syncStatus}
            onLogout={handleLogout}
            onCoachToggle={() => update({ user: { ...state.user, isCoach: !state.user.isCoach } })}
          />
          <div className="content">
            {view === 'home' && <Home state={state} onNav={setView} />}
            {view === 'reflection' && (
              <Reflections
                state={state}
                update={update}
                showToast={showToast}
              />
            )}
            {view === 'izof' && (
              <Izof state={state} update={update} showToast={showToast} />
            )}
            {view === 'declaration' && (
              <Declarations state={state} update={update} showToast={showToast} />
            )}
            {view === 'monthly' && (
              <Monthly state={state} update={update} showToast={showToast} />
            )}
            {view === 'stats' && !state.user.isCoach && (
              <MyStats state={state} myGameStats={myGameStats} />
            )}
            {view === 'coach' && state.user.isCoach && (
              isApprovedCoach ? (
                <CoachDashboard
                  state={state}
                  allUsersData={allUsersData}
                  roster={roster}
                  rosterToUid={rosterToUid}
                  matches={matches}
                  autoImport={autoImport}
                  onToggleAutoImport={(v) => { setAutoImport(v); localStorage.setItem('mental_auto_import', v ? '1' : '0'); }}
                  importMatch={importMatch}
                  isApprovedCoach={isApprovedCoach}
                  myUid={authUid}
                  showToast={showToast}
                />
              ) : (
                <CoachApprovalPending myUid={authUid} showToast={showToast} />
              )
            )}
          </div>
          <BottomNav view={view} onChange={setView} isCoach={state.user.isCoach} />
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    // ====== Login ======
    function Login({ onLogin, roster, rosterToUid }) {
      const [pin, setPin] = useState('');
      const [savedPin, setSavedPin] = useState(localStorage.getItem(PIN_KEY) || '');
      const [savedName, setSavedName] = useState(localStorage.getItem(NAME_KEY) || '');
      const [busy, setBusy] = useState(false);
      const [selectedRosterId, setSelectedRosterId] = useState(null);
      const [filterGrade, setFilterGrade] = useState('all');
      const [coachMode, setCoachMode] = useState(false); // 顧問として登録するか
      const [playerMode, setPlayerMode] = useState(false); // 選手として登録するか
      const [coachName, setCoachName] = useState('');

      // 名簿リスト（active && 未連携優先）
      const rosterList = useMemo(() => {
        const arr = Object.entries(roster || {}).map(([id, data]) => ({
          id,
          ...data,
          grade: computeGrade(data.enrollmentYear),
          displayName: rosterDisplayName(data),
          linked: !!(rosterToUid && rosterToUid[id])
        })).filter(e => e.active !== false);
        arr.sort((a, b) => {
          if (a.linked !== b.linked) return a.linked ? 1 : -1; // 未連携を上に
          if (a.grade !== b.grade) return a.grade - b.grade;
          return (a.surname || '').localeCompare(b.surname || '', 'ja');
        });
        return arr;
      }, [roster, rosterToUid]);

      const filtered = filterGrade === 'all' ? rosterList : rosterList.filter(e => e.grade === Number(filterGrade));
      const selectedEntry = rosterList.find(e => e.id === selectedRosterId);

      // 選手として登録（名簿選択）
      const handleRegisterAsPlayer = async () => {
        if (!selectedEntry) { alert('名簿から自分を選択してください'); return; }
        if (!pin || pin.length !== 4) { alert('4桁PINを入力してください'); return; }
        if (selectedEntry.linked) {
          if (!confirm('この選手は既に別端末で登録されています。\n上書きしますか？（前の端末からはログアウトされます）')) return;
        }
        setBusy(true);
        const hash = hashPin(pin);
        const displayName = selectedEntry.fullName || selectedEntry.surname;
        localStorage.setItem(PIN_KEY, hash);
        localStorage.setItem(NAME_KEY, displayName);
        const user = {
          id: uid(),
          name: displayName,
          grade: selectedEntry.grade,
          position: selectedEntry.position || '',
          rosterId: selectedRosterId,
          enrollmentYear: selectedEntry.enrollmentYear,
          createdAt: Date.now(),
          isCoach: false
        };
        try { await onLogin(user); } finally { setBusy(false); }
      };

      // 顧問として登録（名簿に居ない）
      const handleRegisterAsCoach = async () => {
        if (!coachName) { alert('顧問名を入力してください'); return; }
        if (!pin || pin.length !== 4) { alert('4桁PINを入力してください'); return; }
        setBusy(true);
        const hash = hashPin(pin);
        localStorage.setItem(PIN_KEY, hash);
        localStorage.setItem(NAME_KEY, coachName);
        const user = {
          id: uid(),
          name: coachName,
          grade: 0,
          position: '顧問',
          rosterId: null,
          createdAt: Date.now(),
          isCoach: true
        };
        try { await onLogin(user); } finally { setBusy(false); }
      };

      const handleLogin = async () => {
        if (hashPin(pin) !== savedPin) {
          alert('PINが違います');
          return;
        }
        setBusy(true);
        const saved = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        const user = (saved && saved.user) ? saved.user : { id: uid(), name: savedName, grade: 0, position: '', createdAt: Date.now(), isCoach: false };
        try { await onLogin(user); } finally { setBusy(false); }
      };

      const handleReset = () => {
        if (!confirm('この端末の全データを削除して最初からやり直しますか？\n（クラウド側のデータは残ります）')) return;
        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(PIN_KEY);
        localStorage.removeItem(NAME_KEY);
        location.reload();
      };

      // ── 既にこの端末で登録済（PIN入力モード）
      if (savedPin) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">{savedName} さん、お帰りなさい</p>
            <div className="login-card">
              <h2>PIN を入力</h2>
              <div className="form-group">
                <input
                  type="password"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  maxLength="4"
                  className="pin-input"
                  value={pin}
                  onChange={e => setPin(e.target.value.replace(/[^0-9]/g, ''))}
                  placeholder="••••"
                />
              </div>
              <button className="btn" disabled={busy} onClick={handleLogin}>{busy ? '接続中...' : 'ログイン'}</button>
              <div style={{marginTop:12, textAlign:'center'}}>
                <button className="btn-ghost" onClick={handleReset}>データを削除して初期化</button>
              </div>
            </div>
          </div>
        );
      }

      // ── 役割選択（最初の画面）
      if (!coachMode && !playerMode) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">男子ハンドボール部 メンタル指導</p>
            <div className="login-card">
              <h2 style={{textAlign:'center', marginBottom:20}}>あなたは？</h2>
              <button
                className="btn"
                style={{padding:'18px', fontSize:'17px', marginBottom:14}}
                onClick={() => setPlayerMode(true)}
              >
                🤾 選手としてはじめる
              </button>
              <button
                className="btn btn-secondary"
                style={{padding:'18px', fontSize:'17px'}}
                onClick={() => setCoachMode(true)}
              >
                📋 顧問・コーチとしてはじめる
              </button>
              <p className="text-small text-muted" style={{textAlign:'center', marginTop:20, lineHeight:1.6}}>
                選手 → 名簿から自分を選んでPIN設定<br/>
                顧問 → 名前とPINで登録（承認制）
              </p>
            </div>
          </div>
        );
      }

      // ── 顧問登録モード
      if (coachMode) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">顧問・コーチ登録</p>
            <div className="login-card">
              <h2>顧問として登録</h2>
              <div className="form-group">
                <label>お名前</label>
                <input value={coachName} onChange={e => setCoachName(e.target.value)} placeholder="ガンチ先生" />
              </div>
              <div className="form-group">
                <label>4桁PIN（次回からこれでログイン）</label>
                <input
                  type="password" inputMode="numeric" pattern="[0-9]*" maxLength="4"
                  className="pin-input" value={pin}
                  onChange={e => setPin(e.target.value.replace(/[^0-9]/g,''))}
                  placeholder="••••"
                />
              </div>
              <button className="btn" disabled={busy} onClick={handleRegisterAsCoach}>{busy ? '接続中...' : '登録して開始'}</button>
              <div style={{marginTop:12, textAlign:'center'}}>
                <button className="btn-ghost" onClick={() => setCoachMode(false)}>← 戻る</button>
              </div>
            </div>
          </div>
        );
      }

      // ── 選手登録モード（名簿から選択）
      return (
        <div className="login" style={{padding:'24px 16px', alignItems:'stretch'}}>
          <div style={{textAlign:'center', marginBottom:24}}>
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">男子ハンドボール部 メンタル指導</p>
          </div>

          {rosterList.length === 0 ? (
            <div className="login-card" style={{maxWidth:480, margin:'0 auto'}}>
              <h2>名簿がまだありません</h2>
              <p className="text-small text-muted" style={{marginBottom:16}}>
                顧問の方が「顧問 → 名簿管理」で選手を登録すると、ここに一覧が出ます。
              </p>
              <button className="btn" onClick={() => setCoachMode(true)}>📋 顧問として登録する</button>
              <div style={{textAlign:'center', marginTop:12}}>
                <button className="btn-ghost" onClick={() => setPlayerMode(false)}>← 戻る</button>
              </div>
            </div>
          ) : (
            <div style={{maxWidth:480, margin:'0 auto', width:'100%'}}>
              <div className="login-card">
                <h2>① 自分を選択</h2>
                <div className="chip-group" style={{marginBottom:12, flexWrap:'wrap'}}>
                  {['all','1','2','3'].map(g => (
                    <div key={g}
                      className={'chip ' + (filterGrade === g ? 'selected' : '')}
                      onClick={() => setFilterGrade(g)}
                    >{g === 'all' ? '全' : g + '年'}</div>
                  ))}
                </div>
                <div style={{maxHeight:300, overflowY:'auto', border:'1px solid var(--border)', borderRadius:8, padding:4}}>
                  {filtered.map(e => (
                    <div key={e.id}
                      onClick={() => !e.linked && setSelectedRosterId(e.id)}

    // ====== Reflections ======
    function Reflections({ state, update, showToast }) {
      const [editing, setEditing] = useState(null);
      const reflections = state.reflections;

      const save = (data) => {
        let list;
        if (editing && editing.id) {
          list = reflections.map(r => r.id === editing.id ? { ...editing, ...data } : r);
        } else {
          list = [{ id: uid(), createdAt: Date.now(), ...data }, ...reflections];
        }
        update({ reflections: list });
        setEditing(null);
        showToast(editing && editing.id ? '更新しました' : '保存しました');
      };

      const del = (id) => {
        if (!confirm('削除しますか？')) return;
        update({ reflections: reflections.filter(r => r.id !== id) });
        setEditing(null);
        showToast('削除しました');
      };

      return (
        <>
          <div className="section-h">試合振り返り <span className="small">{reflections.length}件</span></div>
          <button className="btn mb-16" onClick={() => setEditing({})}>+ 新規振り返り</button>

          {reflections.length === 0 && (
            <div className="empty">
              <div className="empty-icon">📝</div>
              <div>まだ振り返りがありません</div>
              <div className="text-small">試合後にここに記録しよう</div>
            </div>
          )}

          {reflections.map(r => (
            <div key={r.id} className="list-item" onClick={() => setEditing(r)}>
              <div>
                <div className="title">vs {r.opponent || '(相手未入力)'}</div>
                <div className="sub">{r.gameDate} · 結果 {r.result || '?'}</div>
                {r.mentalFinding && <div className="sub" style={{marginTop:4, color:'var(--text-2)'}}>💭 {r.mentalFinding.slice(0,40)}{r.mentalFinding.length>40?'…':''}</div>}
              </div>
              <div className="right">
                <div className="score">{r.selfScore}</div>
                <div className="sub">/10</div>
              </div>
            </div>
          ))}

          {editing && (
            <ReflectionEditor
              initial={editing}
              onSave={save}
              onCancel={() => setEditing(null)}
              onDelete={editing.id ? () => del(editing.id) : null}
            />
          )}
        </>
      );
    }

    // ====== Declarations ======
    function Declarations({ state, update, showToast }) {
      const [adding, setAdding] = useState(false);
      const active = state.declarations.find(d => !d.completed);
      const history = state.declarations.filter(d => d.completed);

      const start = (text) => {
        const decl = {
          id: uid(),
          declaration: text,
          startDate: todayStr(),
          checks: [],
          completed: false,
          createdAt: Date.now()
        };
        update({ declarations: [decl, ...state.declarations] });
        setAdding(false);
        showToast('行動宣言を開始！');
      };

      const toggleDay = (date) => {
        if (!active) return;
        const checks = active.checks || [];
        const next = checks.includes(date) ? checks.filter(c => c !== date) : [...checks, date];
        update({
          declarations: state.declarations.map(d => d.id === active.id ? {...d, checks: next} : d)
        });
      };

      const complete = () => {
        if (!active) return;
        if (!confirm('この行動宣言を完了として閉じますか？')) return;
        update({
          declarations: state.declarations.map(d => d.id === active.id ? {...d, completed: true, completedAt: Date.now()} : d)
        });
        showToast('完了！');
      };

      return (
        <>
          <div className="section-h">行動宣言</div>

          {active ? (
            <DeclarationActive d={active} onToggle={toggleDay} onComplete={complete} />
          ) : (
            <div className="card">
              <div className="card-title">進行中の宣言なし</div>
              <button className="btn mt-16" onClick={() => setAdding(true)}>+ 行動宣言を始める</button>
            </div>
          )}

          {history.length > 0 && (
            <>
              <div className="section-h">過去の宣言</div>
              {history.map(d => (
                <div key={d.id} className="list-item">
                  <div>
                    <div className="title">{d.declaration}</div>
                    <div className="sub">{d.startDate} 〜 {(d.checks||[]).length}日達成</div>
                  </div>
                </div>
              ))}
            </>
          )}

          {adding && (
            <DeclarationEditor onSave={start} onCancel={() => setAdding(false)} />
          )}
        </>
      );
    }

    function DeclarationActive({ d, onToggle, onComplete }) {
      const start = new Date(d.startDate + 'T00:00:00');
      const today = todayStr();
      const checks = d.checks || [];

      // build 4 weeks of dates starting from start
      const weeks = [];
      for (let w = 0; w < 4; w++) {
        const days = [];
        for (let dd = 0; dd < 7; dd++) {
          const dt = new Date(start);
          dt.setDate(start.getDate() + w*7 + dd);
          const ds = dt.toISOString().slice(0,10);
          days.push(ds);
        }
        weeks.push(days);
      }
      const totalChecked = checks.length;

      return (
        <div className="card">
          <div className="card-title">
            <div>進行中：{d.declaration}</div>
          </div>
          <div className="card-subtitle">開始: {d.startDate} ／ 達成 {totalChecked} / 28日</div>
          <div className="week-grid">
            <div className="week-label"></div>
            {['月','火','水','木','金','土','日'].map(w => <div key={w} className="week-label">{w}</div>)}
            {weeks.map((days, wi) => (
              <React.Fragment key={wi}>
                <div className="week-label">第{wi+1}週</div>
                {days.map(ds => {
                  const checked = checks.includes(ds);
                  const isToday = ds === today;
                  return (
                    <div
                      key={ds}
                      className={'day-cell ' + (checked ? 'checked' : '') + (isToday ? ' today' : '')}
                      onClick={() => onToggle(ds)}
                      title={ds}
                    >
                      {checked ? '✓' : new Date(ds).getDate()}
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
          <button className="btn btn-secondary mt-16" onClick={onComplete}>この宣言を完了する</button>
        </div>
      );
    }

    function DeclarationEditor({ onSave, onCancel }) {
      const [text, setText] = useState('');

    // ====== gameStats 集計（選手・顧問で共通） ======
    function aggregateGameStats(myGameStats) {
      const games = Object.entries(myGameStats || {}).map(([gameId, rows]) => {
        const rowArr = Object.values(rows || {});
        let shots = 0, goals = 0, missed = 0, turnovers = 0;
        let firstDate = '', opponent = '';
        rowArr.forEach(r => {
          if (!firstDate && r.date) firstDate = r.date;
          if (!opponent && r.opponent) opponent = r.opponent;
          if (r.mode === 'attack') {
            shots++;
            if (r.result === 'goal') goals++;
            else missed++;
          }
          if (r.mode === 'turnover') turnovers++;
        });
        return {
          gameId,
          date: firstDate,
          opponent: opponent || '(相手名なし)',
          rowCount: rowArr.length,
          shots, goals, missed, turnovers,
          goalRate: shots > 0 ? Math.round(goals / shots * 100) : 0,
          rows: rowArr
        };
      });
      games.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      let shots = 0, goals = 0, missed = 0, turnovers = 0;
      games.forEach(g => { shots += g.shots; goals += g.goals; missed += g.missed; turnovers += g.turnovers; });
      const total = { shots, goals, missed, turnovers, goalRate: shots > 0 ? Math.round(goals / shots * 100) : 0 };
      return { games, total };
    }

    // ====== My Stats (選手用: 自分のCSV取込済データを表示) ======
    function MyStats({ state, myGameStats }) {
      const [selectedGame, setSelectedGame] = useState(null);

      const { games, total } = useMemo(() => aggregateGameStats(myGameStats), [myGameStats]);

      // 振り返りと試合データの紐付け
      const reflectionsByDate = useMemo(() => {
        const map = {};
        (state.reflections || []).forEach(r => {
          if (r.gameDate) map[r.gameDate] = r;
        });
        return map;
      }, [state.reflections]);

      if (selectedGame) {
        return <GameDetail game={selectedGame} reflection={reflectionsByDate[selectedGame.date]} onBack={() => setSelectedGame(null)} />;
      }

      return (
        <>
          <div className="section-h">マイ統計（試合データ）</div>

          {games.length === 0 ? (
            <div className="card">
              <div className="card-title">まだ試合データがありません</div>
              <div className="card-subtitle">
                顧問が handball-analyzer から CSVを取り込むと、ここに自分のデータが表示されます。
              </div>
            </div>
          ) : (
            <>
              <div className="card">
                <div className="card-title">累計</div>
                <div className="summary-stats" style={{marginTop:12}}>
                  <div className="stat-card">
                    <div className="num">{total.goals}</div>
                    <div className="label">ゴール</div>
                  </div>
                  <div className="stat-card">
                    <div className="num">{total.shots}</div>
                    <div className="label">シュート</div>
                  </div>
                  <div className="stat-card">
                    <div className="num">{total.goalRate}%</div>
                    <div className="label">決定率</div>
                  </div>
                </div>
                <div className="stat-row mt-16">
                  <span className="label">参加試合</span>
                  <span className="value">{games.length} 試合</span>
                </div>
                <div className="stat-row">
                  <span className="label">ターンオーバー</span>
                  <span className="value">{total.turnovers} 回</span>
                </div>
              </div>

              <div className="section-h">試合別</div>
              {games.map(g => {
                const hasReflection = !!reflectionsByDate[g.date];
                return (
                  <div key={g.gameId} className="list-item" onClick={() => setSelectedGame(g)} style={{cursor:'pointer'}}>
                    <div>
                      <div className="title">vs {g.opponent}</div>
                      <div className="sub">{g.date}</div>
                      <div className="sub" style={{marginTop:4}}>
                        {g.goals}G / {g.shots}S
                        {g.goalRate > 0 && ` (${g.goalRate}%)`}
                        {g.turnovers > 0 && ` / TO${g.turnovers}`}
                      </div>
                      {hasReflection && (
                        <div className="sub" style={{marginTop:4, color:'var(--accent)'}}>📝 メンタル振り返り有</div>
                      )}
                    </div>
                    <div className="right">
                      <div className="score">{g.goals}</div>
                      <div className="sub">G</div>
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </>
      );
    }

    function GameDetail({ game, reflection, onBack }) {
      // コース別集計
      const courseStats = {};
      game.rows.filter(r => r.mode === 'attack').forEach(r => {
        const k = r.course || '(未分類)';
        if (!courseStats[k]) courseStats[k] = { shots: 0, goals: 0 };
        courseStats[k].shots++;
        if (r.result === 'goal') courseStats[k].goals++;
      });
      const courseArr = Object.entries(courseStats).sort((a,b) => b[1].shots - a[1].shots);

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← マイ統計に戻る</button>
          <div className="section-h">{game.date} vs {game.opponent}</div>

          <div className="card">
            <div className="card-title">この試合の自分</div>
            <div className="summary-stats" style={{marginTop:12}}>
              <div className="stat-card"><div className="num">{game.goals}</div><div className="label">ゴール</div></div>
              <div className="stat-card"><div className="num">{game.shots}</div><div className="label">シュート</div></div>
              <div className="stat-card"><div className="num">{game.goalRate}%</div><div className="label">決定率</div></div>
            </div>
            <div className="stat-row mt-16"><span className="label">外し</span><span className="value">{game.missed} 本</span></div>
            <div className="stat-row"><span className="label">ターンオーバー</span><span className="value">{game.turnovers} 回</span></div>
          </div>

          {courseArr.length > 0 && (
            <>
              <div className="section-h">コース別</div>
              {courseArr.map(([course, s]) => {
                const rate = s.shots > 0 ? Math.round(s.goals / s.shots * 100) : 0;
                return (
                  <div key={course} className="list-item">
                    <div>
                      <div className="title">{course}</div>
                      <div className="sub">{s.goals}/{s.shots} ({rate}%)</div>
                    </div>
                    <div className="right">
                      <div className="score">{s.goals}</div>
                      <div className="sub">G</div>
                    </div>
                  </div>
                );
              })}
            </>
          )}

          {reflection && (
            <>
              <div className="section-h">メンタル振り返り</div>
              <div className="card">
                <div className="stat-row"><span className="label">調子</span><span className="value">{reflection.selfScore}/10</span></div>
                {reflection.bestPlay && <div className="stat-row"><span className="label">ベスト</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.bestPlay}</span></div>}
                {reflection.improvePlay && <div className="stat-row"><span className="label">改善</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.improvePlay}</span></div>}
                {reflection.mentalFinding && <div className="stat-row"><span className="label">気づき</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.mentalFinding}</span></div>}
                {reflection.nextTask && <div className="stat-row"><span className="label">次の課題</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{reflection.nextTask}</span></div>}
              </div>

              <div className="card mt-16">
                <div className="card-title">数字とメンタルを結びつける</div>
                <div className="card-subtitle" style={{lineHeight:1.7}}>
                  決定率 {game.goalRate}% の試合で「{reflection.mentalFinding || reflection.bestPlay || '−'}」と感じた。<br/>
                  → 次回 IZOFを記録するときは、その状態を再現できるか確認しよう。
                </div>
              </div>
            </>
          )}

          {!reflection && (
            <div className="card mt-16">
              <div className="card-title">この試合のメンタル振り返りはまだ未記録</div>
              <div className="card-subtitle">
                「振り返り」タブから {game.date} の振り返りを追加すると、ここに数字と感情を並べて見られます。
              </div>
            </div>
          )}
        </>
      );
    }

    // ====== Roster Management (顧問用) ======
    function RosterManagement({ roster, rosterToUid, allUsersData, showToast, onBack }) {
      const [editing, setEditing] = useState(null); // {id, ...data} or 'new'
      const [filterGrade, setFilterGrade] = useState('all');

      // 名簿を配列化（学年・苗字順）
      const entries = useMemo(() => {
        const arr = Object.entries(roster || {}).map(([id, data]) => ({
          id,
          ...data,
          grade: computeGrade(data.enrollmentYear),
          displayName: rosterDisplayName(data)
        })).filter(e => e.active !== false);
        arr.sort((a, b) => {
          if (a.grade !== b.grade) return a.grade - b.grade;
          return (a.surname || '').localeCompare(b.surname || '', 'ja');
        });
        return arr;
      }, [roster]);

      const filtered = filterGrade === 'all' ? entries : entries.filter(e => e.grade === Number(filterGrade));

      const linkedCount = entries.filter(e => rosterToUid && rosterToUid[e.id]).length;

      const seedDefault = async () => {
        if (Object.keys(roster).length > 0) {
          if (!confirm(`既に ${Object.keys(roster).length} 名登録されています。デフォルト32名を追加で投入しますか？`)) return;
        } else {
          if (!confirm('analyzer デフォルトの32名を投入しますか？')) return;
        }
        const defaults = makeDefaultRosterEntries();
        const fbDB = window.fbDB;
        for (const entry of defaults) {
          const newId = fbDB.ref('roster').push().key;
          await storage.upsertRoster(newId, entry);
        }
        showToast(`32名を投入しました`);
      };

      const save = async (data) => {
        const fbDB = window.fbDB;
        const id = editing.id || fbDB.ref('roster').push().key;
        await storage.upsertRoster(id, {
          surname: data.surname,
          fullName: data.fullName || '',
          enrollmentYear: Number(data.enrollmentYear),
          position: data.position || '',
          isGK: !!data.isGK,
          active: true
        });
        setEditing(null);
        showToast(editing.id ? '更新しました' : '追加しました');
      };

      const remove = async () => {
        if (!confirm(`${editing.surname} を削除しますか？\n\n試合データへの紐付けが切れますが、復元はできません。\n（卒業生は「アクティブ無効化」を推奨）`)) return;
        await storage.deleteRoster(editing.id);
        setEditing(null);
        showToast('削除しました');
      };

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← 顧問Dashboardに戻る</button>
          <div className="section-h">名簿管理 <span className="small">{entries.length}名 / mental連携 {linkedCount}名</span></div>

          {entries.length === 0 && (
            <div className="card">
              <div className="card-title">名簿がまだ空です</div>
              <div className="card-subtitle">analyzer のデフォルト32名を投入できます</div>
              <button className="btn mt-16" onClick={seedDefault}>📋 デフォルト32名を投入</button>
            </div>
          )}

          {entries.length > 0 && (
            <>
              <div className="chip-group" style={{marginBottom:12, flexWrap:'wrap'}}>
                {['all','1','2','3'].map(g => (
                  <div key={g} className={'chip ' + (filterGrade === g ? 'selected' : '')}
                    onClick={() => setFilterGrade(g)}
                  >{g === 'all' ? '全' : g + '年'}</div>
                ))}
              </div>
              <button className="btn mb-16" onClick={() => setEditing({grade:1})}>+ 選手を追加</button>
            </>
          )}

          {filtered.map(e => {
            const linked = rosterToUid && rosterToUid[e.id];
            const linkedUserData = linked && allUsersData[linked] && allUsersData[linked].state && allUsersData[linked].state.user;
            return (
              <div key={e.id} className="list-item" onClick={() => setEditing(e)} style={{cursor:'pointer'}}>
                <div>
                  <div className="title">{e.displayName} {e.fullName && <span className="text-small text-muted">({e.fullName})</span>}</div>
                  <div className="sub">
                    {e.grade > 0 && e.grade <= 3 ? `${e.grade}年` : '卒業/不明'}
                    {e.position && ` / ${e.position}`}
                    {e.isGK && ' / GK'}
                  </div>
                  <div className="sub" style={{marginTop:4, color: linked ? 'var(--accent)' : 'var(--text-3)'}}>
                    {linked ? `✓ mental連携済 (${linkedUserData ? linkedUserData.name : '?'})` : '◯ mental未連携'}
                  </div>
                </div>
              </div>
            );
          })}

          {editing && (
            <RosterEditor
              initial={editing}
              onSave={save}
              onDelete={editing.id ? remove : null}
              onCancel={() => setEditing(null)}
            />
          )}

          <div className="card mt-16">
            <div className="card-title">運用ガイド</div>
            <div className="card-subtitle" style={{lineHeight:1.6}}>
              ・**入学年**を入れると学年は自動計算（4月始まり）<br/>
              ・「3年生」固定ではなく「2024年入学」のように記録<br/>
              ・年度切替時に手動更新不要<br/>
              ・analyzer 表示名 ①②③ は自動生成<br/>
              ・卒業生は削除でなく「アクティブ無効」推奨（試合データ保持のため）
            </div>
          </div>
        </>
      );
    }

    function RosterEditor({ initial, onSave, onCancel, onDelete }) {
      const today = new Date();
      const thisYear = today.getMonth() + 1 >= 4 ? today.getFullYear() : today.getFullYear() - 1;
      const [d, setD] = useState({
        surname: initial.surname || '',
        fullName: initial.fullName || '',
        enrollmentYear: initial.enrollmentYear || (initial.grade ? thisYear - initial.grade + 1 : thisYear),
        position: initial.position || '',
        isGK: !!initial.isGK
      });
      const currentGrade = computeGrade(Number(d.enrollmentYear));
      const yearOptions = [];
      for (let y = thisYear + 1; y >= thisYear - 4; y--) yearOptions.push(y);
      return (
        <div className="modal-overlay" onClick={onCancel}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">{initial.id ? '選手編集' : '選手追加'}</div>
              <button className="modal-close" onClick={onCancel}>×</button>
            </div>
            <div className="form-group">
              <label>苗字 *（analyzer 表示用）</label>
              <input value={d.surname} onChange={e => setD({...d, surname: e.target.value})} placeholder="赤塚" />
            </div>
            <div className="form-group">
              <label>フルネーム（任意・mental表示用）</label>
              <input value={d.fullName} onChange={e => setD({...d, fullName: e.target.value})} placeholder="赤塚 太郎" />
            </div>
            <div className="form-group">
              <label>入学年（4月入学ベース）</label>
              <select value={d.enrollmentYear} onChange={e => setD({...d, enrollmentYear: e.target.value})}>
                {yearOptions.map(y => <option key={y} value={y}>{y}年入学 → 現{computeGrade(y) > 0 && computeGrade(y) <= 3 ? computeGrade(y) + '年' : computeGrade(y) > 3 ? '卒業' : '入学前'}</option>)}
              </select>
              <div className="text-small text-muted mt-16">→ analyzer表示: <strong>{gradeSymbol(currentGrade)}{d.surname || '???'}</strong></div>
            </div>
            <div className="form-group">
              <label>ポジション</label>
              <select value={d.position} onChange={e => setD({...d, position: e.target.value, isGK: e.target.value === 'GK'})}>
                <option value="">未設定</option>
                <option value="GK">GK</option>
                <option value="LW">LW</option>
                <option value="RW">RW</option>
                <option value="LB">LB</option>
                <option value="CB">CB</option>
                <option value="RB">RB</option>
                <option value="PV">PV</option>
              </select>
            </div>
            <div className="form-group">
              <label>
                <input type="checkbox" checked={d.isGK} onChange={e => setD({...d, isGK: e.target.checked})} />
                {' '}GK（analyzer の GK row に表示）
              </label>
            </div>
            <button className="btn" disabled={!d.surname} onClick={() => onSave(d)}>{initial.id ? '更新' : '追加'}</button>
            {onDelete && <button className="btn btn-danger mt-16" onClick={onDelete}>削除</button>}
          </div>
        </div>
      );
    }

    // ====== Cloud Matches (analyzerがクラウド保存した試合をワンボタン取込) ======
    function CloudMatches({ matches, roster, rosterToUid, autoImport, onToggleAutoImport, importMatch, showToast, onBack }) {
      const [busyId, setBusyId] = useState(null);

      // 試合を整形（新しい順）
      const matchList = useMemo(() => {
        const arr = Object.entries(matches || {}).map(([id, m]) => {
          // 何名分の rosterId が含まれ、何名が mental 連携済か
          const ridSet = new Set();
          (m.rows || []).forEach(r => { if (r.rosterId) ridSet.add(r.rosterId); });
          const linkedCount = Array.from(ridSet).filter(rid => rosterToUid && rosterToUid[rid]).length;
          return {
            id,
            date: m.date || '',
            opponent: m.opponent || '(相手なし)',
            rowCount: m.rowCount || (m.rows || []).length,
            playerCount: ridSet.size,
            linkedCount,
            unlinkedCount: ridSet.size - linkedCount,
            imported: !!m.importedAt,
            importedAt: m.importedAt,
            raw: m
          };
        });
        arr.sort((a, b) => {
          if (a.imported !== b.imported) return a.imported ? 1 : -1; // 未取込を上に
          return (b.date || '').localeCompare(a.date || '');
        });
        return arr;
      }, [matches, rosterToUid]);

      const pending = matchList.filter(m => !m.imported);

      const doImport = async (m) => {
        setBusyId(m.id);
        try {
          const res = await importMatch(m.id, m.raw);
          if (res.ok) {
            showToast(`✅ ${m.opponent}: ${res.savedPlayers}名に配信` + (res.skippedNoUid ? `（未連携${res.skippedNoUid}名スキップ）` : ''));
          } else {
            showToast('取込失敗');
          }
        } finally {
          setBusyId(null);
        }
      };

      const importAll = async () => {
        if (pending.length === 0) return;
        if (!confirm(`未取込の ${pending.length} 試合をすべて配信しますか？`)) return;
        for (const m of pending) {
          setBusyId(m.id);
          await importMatch(m.id, m.raw);
        }
        setBusyId(null);
        showToast(`${pending.length} 試合を一括配信しました`);
      };

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← 顧問Dashboardに戻る</button>
          <div className="section-h">クラウド試合取込</div>

          <div className="card">
            <div className="card-title">仕組み</div>
            <div className="card-subtitle" style={{lineHeight:1.7}}>
              analyzer で「☁ メンタルアプリに送信」を押した試合がここに出ます。<br/>
              「取込」を押すと、各選手のアプリ（マイ統計）に自動配信されます。
            </div>
            <label style={{display:'flex', alignItems:'center', gap:10, marginTop:16, padding:'10px 12px', background:'rgba(255,255,255,0.04)', borderRadius:8, cursor:'pointer'}}>
              <input type="checkbox" checked={autoImport} onChange={e => onToggleAutoImport(e.target.checked)} />
              <div>
                <div style={{fontWeight:'bold'}}>自動取込</div>
                <div className="text-small text-muted">analyzer から届いた試合を確認なしで即配信</div>
              </div>
            </label>
            {autoImport && (
              <div className="text-small" style={{color:'var(--warning)', marginTop:8}}>
                ⚠ 自動ON中。練習試合・テストデータも即配信されます。
              </div>
            )}
          </div>

          {pending.length > 0 && (
            <button className="btn mb-16 mt-16" onClick={importAll}>
              📥 未取込 {pending.length}試合を一括配信
            </button>
          )}

          {matchList.length === 0 && (
            <div className="empty">
              <div className="empty-icon">☁</div>
              <div>クラウド試合がまだありません</div>
              <div className="text-small">analyzer で「メンタルアプリに送信」してください</div>
            </div>
          )}

          {matchList.map(m => (
            <div key={m.id} className="card" style={{marginBottom:12, opacity: m.imported ? 0.6 : 1}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                <div>
                  <div className="card-title">vs {m.opponent}</div>
                  <div className="card-subtitle">
                    {m.date} · {m.rowCount}件 · 選手{m.playerCount}名
                    {m.unlinkedCount > 0 && <span style={{color:'var(--warning)'}}> · 未連携{m.unlinkedCount}名</span>}
                  </div>
                </div>
                {m.imported && <span className="badge-coach" style={{background:'var(--success)'}}>取込済</span>}
              </div>
              {m.unlinkedCount > 0 && (
                <div className="text-small" style={{color:'var(--warning)', marginTop:8}}>
                  ⚠ {m.unlinkedCount}名はmental未登録。その選手は登録後に再取込が必要です。
                </div>
              )}
              <button
                className={'btn mt-16 ' + (m.imported ? 'btn-secondary' : '')}
                disabled={busyId === m.id || m.linkedCount === 0}
                onClick={() => doImport(m)}
              >
                {busyId === m.id ? '配信中...' : (m.imported ? '🔄 再配信' : `📥 ${m.linkedCount}名に配信`)}
              </button>
            </div>
          ))}
        </>
      );
    }

    // ====== CSV Import (analyzer出力CSV取込) ======
    function CsvImport({ roster, rosterToUid, showToast, onBack }) {
      const [parsed, setParsed] = useState(null); // {headers, rows}
      const [stats, setStats] = useState(null);    // {matched, unmatched, byPlayer}
      const [busy, setBusy] = useState(false);

      const onFile = async (file) => {
        if (!file) return;
        const text = await file.text();
        // BOMを除去
        const clean = text.replace(/^﻿/, '');
        const lines = clean.split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) {
          alert('データ行がありません');
          return;
        }
        const headers = parseCsvLine(lines[0]);
        const rows = lines.slice(1).map(l => {
          const cells = parseCsvLine(l);
          const row = {};
          headers.forEach((h, i) => row[h] = cells[i] || '');
          return row;
        });
        // analyzer の player列 → rosterId 逆引き
        const nameToRosterId = {};
        for (const [rid, r] of Object.entries(roster || {})) {
          nameToRosterId[rosterDisplayName(r)] = rid;
        }
        let matched = 0, unmatched = 0;
        const byPlayer = {};
        const unmatchedNames = new Set();
        rows.forEach(r => {
          const name = r.player;
          if (!name) return;
          const rid = nameToRosterId[name];
          if (rid) {
            matched++;
            byPlayer[name] = (byPlayer[name] || 0) + 1;
            r._rosterId = rid;
            r._uid = (rosterToUid || {})[rid];
          } else {
            unmatched++;
            unmatchedNames.add(name);
            r._rosterId = null;
            r._uid = null;
          }
        });
        setParsed({ headers, rows });
        setStats({ matched, unmatched, byPlayer, unmatchedNames: Array.from(unmatchedNames) });
      };

      const commit = async () => {
        if (!parsed) return;
        setBusy(true);
        try {
          const gameDate = (parsed.rows[0] && parsed.rows[0].date) || new Date().toISOString().slice(0, 10);
          const opponent = (parsed.rows[0] && parsed.rows[0].opponent) || 'unknown';
          const gameId = gameDate + '_' + opponent.replace(/[^a-zA-Z0-9一-龯ぁ-んァ-ヶ]/g, '');
          let saved = 0;
          for (let i = 0; i < parsed.rows.length; i++) {
            const r = parsed.rows[i];
            if (!r._uid) continue;
            const row = { ...r };
            delete row._rosterId;
            delete row._uid;
            await storage.saveGameStats(r._uid, gameId, i, row);
            saved++;
          }
          showToast(`${saved}行を保存しました（試合: ${gameId}）`);
          setParsed(null);
          setStats(null);
        } catch (e) {
          console.error(e);
          alert('保存中にエラー: ' + e.message);
        } finally {
          setBusy(false);
        }
      };

      return (
        <>
          <button className="btn-ghost mb-16" onClick={onBack}>← 顧問Dashboardに戻る</button>
          <div className="section-h">CSV取込（analyzer出力）</div>

          {!parsed && (
            <>
              <div className="card">
                <div className="card-title">使い方</div>
                <div className="card-subtitle" style={{lineHeight:1.7}}>
                  1. handball-analyzer で試合データをCSVエクスポート<br/>
                  2. このページでCSVファイルを選択<br/>
                  3. プレビュー確認 → 確定<br/>
                  4. 各選手のアプリに自動配信
                </div>
              </div>
              <div className="card mt-16">
                <label className="btn" style={{display:'block', textAlign:'center'}}>
                  📁 CSVファイルを選択
                  <input type="file" accept=".csv,text/csv" style={{display:'none'}}
                    onChange={e => onFile(e.target.files[0])} />
                </label>
              </div>
            </>
          )}

          {parsed && stats && (
            <>
              <div className="card">
                <div className="card-title">プレビュー</div>
                <div className="summary-stats" style={{marginTop:12}}>
                  <div className="stat-card"><div className="num">{parsed.rows.length}</div><div className="label">総行数</div></div>
                  <div className="stat-card"><div className="num" style={{color:'var(--success)'}}>{stats.matched}</div><div className="label">紐付OK</div></div>
                  <div className="stat-card"><div className="num" style={{color:'var(--warning)'}}>{stats.unmatched}</div><div className="label">未紐付</div></div>
                </div>
              </div>

              {stats.unmatched > 0 && (
                <div className="card mt-16" style={{borderLeft:'3px solid var(--warning)'}}>
                  <div className="card-title">⚠ 名簿にない選手</div>
                  <div className="card-subtitle">この選手の行は保存されません。名簿管理で追加してから再実行してください。</div>
                  <ul style={{marginTop:8}}>
                    {stats.unmatchedNames.map(n => <li key={n}>{n}</li>)}
                  </ul>
                </div>
              )}

              <div className="section-h mt-16">選手別 行数</div>
              {Object.entries(stats.byPlayer).map(([name, cnt]) => (
                <div key={name} className="list-item">
                  <div>
                    <div className="title">{name}</div>
                    <div className="sub">{cnt} 行</div>
                  </div>
                </div>
              ))}

              <div style={{display:'flex', gap:8, marginTop:16}}>
                <button className="btn btn-secondary" style={{flex:1}} onClick={() => { setParsed(null); setStats(null); }}>キャンセル</button>
                <button className="btn" style={{flex:1}} disabled={busy || stats.matched === 0} onClick={commit}>{busy ? '保存中...' : `確定（${stats.matched}行）`}</button>
              </div>
            </>
          )}
        </>
      );
    }

    // 簡易CSVパーサ（クォート対応）
    function parseCsvLine(line) {
      const result = [];
      let cur = '';
      let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQ) {
          if (c === '"') {
            if (line[i+1] === '"') { cur += '"'; i++; }
            else inQ = false;
          } else cur += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') { result.push(cur); cur = ''; }
          else cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    // ====== Mount ======
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
