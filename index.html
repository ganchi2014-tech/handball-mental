<!DOCTYPE html>
<html lang="ja">
<head>

       "Cannot use import statement outside a module" となり全体が実行されず白画面化する。
       classicランタイム（React.createElement 出力）の v7 系に固定する。2026-06 対応。 -->

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0a101e;
      --bg-2: #0f172a;
      --card: rgba(255,255,255,0.05);
      --card-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.1);
      --primary: #2dd4bf;
      --primary-dark: #14b8a6;
      --accent: #4ecdc4;
      --accent-dark: #2c8a82;
      --warning: #fbbf24;
      --success: #10b981;
      --text-1: #f0f4f8;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --shadow: 0 4px 16px rgba(0,0,0,0.3);

      --fs-xs: 11px;
      --fs-sm: 13px;
      --fs-md: 15px;
      --fs-lg: 18px;
      --fs-xl: 22px;
      --fs-2xl: 28px;
      --fs-3xl: 36px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text-1);
      min-height: 100vh;
      font-size: var(--fs-md);
      line-height: 1.5;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea, select { font-family: inherit; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 80px;
      position: relative;
    }

    /* Login */
    .login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, rgba(45,212,191,0.15) 0%, transparent 60%);
    }
    .login h1 {
      font-size: var(--fs-3xl);
      margin: 0 0 8px;
      letter-spacing: 1px;
    }
    .login .subtitle {
      color: var(--text-2);
      margin-bottom: 40px;
      text-align: center;
    }
    .login-card {
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow);
    }
    .login-card h2 {
      margin: 0 0 16px;
      font-size: var(--fs-lg);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: var(--fs-sm);
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1);
      font-size: var(--fs-md);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--primary);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .pin-input {
      letter-spacing: 8px;
      text-align: center;
      font-size: var(--fs-xl) !important;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      color: white;
      border-radius: 10px;
      font-size: var(--fs-md);
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(45,212,191,0.3);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-1);
      box-shadow: none;
    }
    .btn-ghost {
      background: transparent;
      border: none;
      color: var(--accent);
      padding: 8px 12px;
      box-shadow: none;
      font-size: var(--fs-sm);
      width: auto;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(20px);
      background: rgba(10,16,30,0.8);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-name { font-weight: 600; }
    .header-sub { font-size: var(--fs-xs); color: var(--text-2); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .badge-coach {

      color: white;
      font-size: var(--fs-xs);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* Main content */
    .content { padding: 16px; }
    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: var(--fs-md);
      font-weight: 600;
      margin: 0 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title .icon { font-size: 20px; }
    .card-subtitle { color: var(--text-2); font-size: var(--fs-sm); margin-bottom: 12px; }

    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .stat-row:last-child { border-bottom: none; }
    .stat-row .label { color: var(--text-2); }
    .stat-row .value { font-weight: 600; }

    .greeting { font-size: var(--fs-xl); margin: 0 0 4px; }
    .greeting-sub { color: var(--text-2); margin-bottom: 24px; }

    /* Quick actions grid */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .quick-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;

      color: var(--text-1);
      cursor: pointer;

    .quick-tile:active { transform: scale(0.97); background: var(--card-hover); }
    .quick-tile .tile-icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .quick-tile .tile-title { font-weight: 600; margin-bottom: 4px; }
    .quick-tile .tile-sub { font-size: var(--fs-sm); color: var(--text-2); }

    /* Bottom navigation */
    .nav {

      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      display: flex;
      background: rgba(10,16,30,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);

      padding: 8px 4px;
      background: none;

    /* List items */
    .list-item {

      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .list-item:active { background: var(--card-hover); }
    .list-item .title { font-weight: 600; margin-bottom: 4px; }
    .list-item .sub { font-size: var(--fs-sm); color: var(--text-2); }
    .list-item .right { text-align: right; }
    .list-item .right .score {
      font-size: var(--fs-xl);
      font-weight: 700;
      color: var(--accent);
    }

    /* IZOF chips */
    .izof-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .izof-cell {
      padding: 10px 0;
      text-align: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .izof-cell.selected {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .izof-row { margin-bottom: 12px; }
    .izof-row .label { font-size: var(--fs-sm); color: var(--text-2); }

    /* セルフチェック（心の5つの力） */
    .sc-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .sc-bar-label { flex:0 0 132px; font-size: var(--fs-sm); }
    .sc-bar-track { flex:1; height:16px; background: rgba(0,0,0,0.25); border-radius:8px; overflow:hidden; }
    .sc-bar-fill { height:100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark)); border-radius:8px; transition: width .3s; }
    .sc-bar-val { flex:0 0 50px; text-align:right; font-weight:700; }
    .sc-bar-max { font-size:11px; color: var(--text-2); font-weight:400; }
    .sc-axis { margin-top:16px; }
    .sc-axis-head { font-weight:700; color: var(--primary); margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid var(--border); }

    /* Result chips (勝負引) */
    .chip-group { display: flex; gap: 8px; }
    .chip {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .chip.selected { background: var(--primary); border-color: var(--primary); }

    /* Slider score */
    .score-display {
      text-align: center;
      font-size: var(--fs-2xl);
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .slider {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(45,212,191,0.5);
    }

    /* 4-week tracker */
    .week-grid {
      display: grid;
      grid-template-columns: 36px repeat(7, 1fr);
      gap: 4px;
      margin-top: 8px;
    }
    .week-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-xs);
      color: var(--text-2);
    }
    .day-cell {
      aspect-ratio: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: var(--fs-xs);
      color: var(--text-2);
      transition: all 0.15s;
    }
    .day-cell.checked {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .day-cell.today { border-color: var(--primary); border-width: 2px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding: 0;
    }
    .modal {
      background: var(--bg-2);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title { font-size: var(--fs-lg); font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-2);
      font-size: 24px;
      padding: 0;
      width: 32px;
      height: 32px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-2);
    }
    .empty .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Section heading */
    .section-h {
      margin: 24px 0 12px;
      font-size: var(--fs-lg);
      font-weight: 600;
    }
    .section-h .small { font-size: var(--fs-sm); color: var(--text-2); margin-left: 8px; font-weight: 400; }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      z-index: 300;
      animation: toastIn 0.3s ease-out;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Pull-down etc */
    .info-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .info-row > * { flex: 1; }

    .text-muted { color: var(--text-2); }
    .text-small { font-size: var(--fs-sm); }
    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .mt-16 { margin-top: 16px; }
    .text-center { text-align: center; }

    /* Stats summary */
    .summary-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .stat-card .num {
      font-size: var(--fs-xl);
      font-weight: 700;
      color: var(--accent);
    }
    .stat-card .label {
      font-size: var(--fs-xs);
      color: var(--text-2);
      margin-top: 2px;
    }

    /* Coach mode list */
    .coach-list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .coach-list-item.alert { border-color: var(--warning); }

    .accordion {
      margin-bottom: 8px;
      border-radius: 10px;
      overflow: hidden;
    }
    .accordion-header {
      padding: 12px;
      background: var(--card);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .accordion-body {
      padding: 12px;
      background: rgba(0,0,0,0.2);
      font-size: var(--fs-sm);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ====== Storage Layer (localStorage キャッシュ + Firebase RTDB クラウド同期) ======
    const CACHE_KEY = 'handball-mental-v2';
    const STORAGE_KEY = CACHE_KEY; // 旧名互換
    const PIN_KEY = 'mental_pin_hash';
    const NAME_KEY = 'mental_user_name';

    function defaultState() {
      return {
        user: null,
        reflections: [],
        monthlyReviews: [],
        izofRecords: [],
        declarations: [],
        sessionLogs: [],
        selfChecks: [],
        sessionWorks: {},
        nightLogs: [],
        preventionChecks: [], // C: 今日の予防チェック [{id,date,nhe,copenhagen,balance,nheReps?}]
        loadLogs: [],         // E: 練習負荷RPE申告 [{id,date,rpe,minutes}]
        localUpdatedAt: 0
      };
    }

    // IZOF型の旧表記マイグレーション（2026-06-10: 中庸型→中間型）
    const normIzofType = (t) => t === '中庸型' ? '中間型' : t;

    const fbAuth = (typeof window !== 'undefined') ? window.fbAuth : null;
    const fbDB   = (typeof window !== 'undefined') ? window.fbDB   : null;

    const storage = {
      // ----- ローカルキャッシュ（即時、オフライン耐性） -----
      loadCache: () => {
        try {
          // v2優先、なければv1から移行
          let raw = localStorage.getItem(CACHE_KEY);
          if (!raw) {
            const v1 = localStorage.getItem('handball-mental-v1');
            if (v1) {
              raw = v1;
              localStorage.setItem(CACHE_KEY, v1);
            }
          }
          if (!raw) return defaultState();
          return { ...defaultState(), ...JSON.parse(raw) };
        } catch {
          return defaultState();
        }
      },
      saveCache: (state) => {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) { console.warn('[cache save]', e); }
      },
      // ----- クラウド同期（Firebase RTDB） -----
      saveCloud: (uid, state) => {
        if (!fbDB || !uid) return Promise.resolve();
        return fbDB.ref('users/' + uid + '/state').set(state)
          .catch(e => { console.warn('[RTDB save]', e); throw e; });
      },
      subscribeCloud: (uid, callback) => {
        if (!fbDB || !uid) return () => {};
        const ref = fbDB.ref('users/' + uid + '/state');
        const handler = ref.on('value', (snap) => callback(snap.val()));
        return () => ref.off('value', handler);
      },
      // ----- 顧問用: 全選手データ -----
      subscribeAllUsers: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('users');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      // ----- 顧問承認リスト（Console から手動登録） -----
      subscribeCoaches: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('coaches');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}));
        return () => ref.off('value', handler);
      },
      // ----- チームボード（合言葉・チームルール等。全員read・顧問write） -----
      subscribeTeam: (callback) => {
        if (!fbDB) return () => {};
        const ref = fbDB.ref('team');
        const handler = ref.on('value', (snap) => callback(snap.val() || {}), () => callback({}));
        return () => ref.off('value', handler);
      },
      saveTeam: async (data) => {
        if (!fbDB) return;
        return fbDB.ref('team').update({ ...data, updatedAt: firebase.database.ServerValue.TIMESTAMP });
      },
      addTeamVoice: async (note) => {
        if (!fbDB) return;
        const id = fbDB.ref('team/voiceNotes').push().key;
        return fbDB.ref('team/voiceNotes/' + id).set({ ...note, createdAt: firebase.database.ServerValue.TIMESTAMP });
      },
      delTeamVoice: async (id) => {
        if (!fbDB) return;
        return fbDB.ref('team/voiceNotes/' + id).remove();
      },
      // ----- 個人宛てアドバイスメモ（本人＋顧問のみ閲覧・顧問のみ書込） -----

    // ====== Roster Helpers（学年自動計算） ======
    // 入学年から現在の学年を計算（4月始まり）
    function computeGrade(enrollmentYear, refDate) {
      if (!enrollmentYear) return 0;
      const d = refDate || new Date();
      // 学校年度: 4月1日始まり
      const schoolYear = (d.getMonth() + 1) >= 4 ? d.getFullYear() : d.getFullYear() - 1;
      return schoolYear - enrollmentYear + 1;
    }
    // 学年→丸数字 (analyzer互換: ①②③)
    function gradeSymbol(grade) {
      return ['', '①', '②', '③'][grade] || '';
    }
    // 名簿エントリから analyzer 表示名を作る
    function rosterDisplayName(roster, refDate) {
      const g = computeGrade(roster.enrollmentYear, refDate);
      return gradeSymbol(g) + (roster.surname || '');
    }
    // analyzer の名前 (③赤塚) から surname と grade を取出す
    function parseAnalyzerName(name) {
      const m = String(name || '').match(/^([①②③])(.+)$/);
      if (m) {
        const grade = ['①','②','③'].indexOf(m[1]) + 1;
        return { surname: m[2], grade };
      }
      return { surname: name, grade: 0 };
    }
    // 入学年を学年から逆算（今年度ベース）
    function gradeToEnrollmentYear(grade, refDate) {
      const d = refDate || new Date();
      const schoolYear = (d.getMonth() + 1) >= 4 ? d.getFullYear() : d.getFullYear() - 1;
      return schoolYear - grade + 1;
    }
    // analyzer互換: デフォルト22名（入学年は今年度から逆算。2026-07 3年生引退につき3年は含めない）
    function makeDefaultRosterEntries(refDate) {
      const d = refDate || new Date();
      const g2 = gradeToEnrollmentYear(2, d);
      const g1 = gradeToEnrollmentYear(1, d);
      const gkSet = new Set(['小川','田口','関山']);
      const list = [
        // 2年（10名）
        ['新井',g2],['猪田',g2],['北林',g2],['田端',g2],['藤川',g2],['松岡',g2],['村田',g2],['安田',g2],['小川',g2],['田口',g2],
        // 1年（12名）
        ['石黒',g1],['岩噌',g1],['大野',g1],['北川',g1],['嶌本',g1],['福原',g1],['増田',g1],['水田',g1],['宮崎',g1],['森井',g1],['山崎',g1],['関山',g1]
      ];
      return list.map(([surname, enrollmentYear]) => ({
        surname,
        fullName: '',
        enrollmentYear,
        position: gkSet.has(surname) ? 'GK' : '',
        isGK: gkSet.has(surname),
        active: true
      }));
    }

    // 旧APIを維持（既存呼び出しのため）
    storage.load = storage.loadCache;

    // ====== LAB 試合ループ位相（LAB lib/loop.js の loopPhaseInfo 互換） ======
    // nextMatchあり: D-3以前=practice / D-2〜D-0=predict / 試合翌日〜+2=verify / +3以降=practice
    function labLoopPhase(nextMatch, refDate) {
      if (!nextMatch || !nextMatch.date) return { phase: 'practice', days: null };
      const d = refDate || new Date();
      const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = Math.round((new Date(nextMatch.date + 'T00:00:00') - today) / 86400000);
      if (diff >= 3) return { phase: 'practice', days: diff };
      if (diff >= 0) return { phase: 'predict', days: diff };
      if (diff >= -2) return { phase: 'verify', days: diff };
      return { phase: 'practice', days: null };
    }

    // ====== Hash for PIN ======
    // 旧v1形式（弱い文字列ハッシュ）。既存端末の保存値の検証と移行のためだけに残す。新規保存には使わない
    function hashPin(pin) {
      let h = 0;
      const s = String(pin) + '|handball-mental|salt';
      for (let i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h |= 0;
      }
      return String(h);
    }
    // v2: SHA-256＋端末ごとランダムsalt（形式 'v2:salt:hex'）。
    // 4桁PINは総当たり空間が小さく、これは端末の補助錠（localStorageを見た他人がPINを即座に逆算できないようにする）
    async function hashPinV2(pin, salt) {
      let s = salt;
      if (!s) {
        const a = new Uint8Array(16);
        crypto.getRandomValues(a);
        s = Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      const data = new TextEncoder().encode(s + '|' + String(pin) + '|handball-mental');
      const digest = await crypto.subtle.digest('SHA-256', data);
      const hex = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      return 'v2:' + s + ':' + hex;
    }
    // 保存形式（v1/v2）を自動判別して検証
    async function verifyPin(pin, stored) {
      if (!stored) return false;
      if (stored.indexOf('v2:') === 0) {
        const salt = stored.split(':')[1];
        return (await hashPinV2(pin, salt)) === stored;
      }
      return hashPin(pin) === stored; // 旧v1形式
    }

    // ====== Helpers ======
    const uid = () => Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
    // ローカル日付（JST）。toISOString はUTCのため朝9時前に前日となるバグがあった
    const dateStr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const todayStr = () => dateStr(new Date());
    // 指定日（既定=今日）を含む週の [月..日] 7日分の日付文字列。週次集計（予防実施率・週sRPE）で使う
    const weekDates = (d) => {
      const base = (d instanceof Date) ? new Date(d) : new Date((d || todayStr()) + 'T00:00:00');
      const dow = (base.getDay() + 6) % 7; // 月=0 .. 日=6
      const monday = new Date(base);
      monday.setDate(base.getDate() - dow);
      return Array.from({ length: 7 }, (_, i) => {
        const dt = new Date(monday);
        dt.setDate(monday.getDate() + i);
        return dateStr(dt);
      });
    };
    // 2つの日付文字列(YYYY-MM-DD)の間の概算月数（急伸フラグの伸び率換算に使用）
    const monthsBetween = (a, b) => {
      if (!a || !b) return 0;
      const ms = new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00');
      return ms / (1000 * 60 * 60 * 24 * 30.44);
    };
    const fmtDate = (s) => {
      if (!s) return '';
      const [y,m,d] = s.split('-');
      return `${m}/${d}`;
    };

    // ====== App ======
    function App() {

      // ── クラウド試合を各選手の gameStats に取込（ワンボタン/自動共通）
      const importMatch = useCallback(async (matchId, matchData) => {
        if (!matchData || !matchData.rows) return { ok: false, reason: 'no rows' };
        // analyzer表示名(①関山)・姓 → rosterId（守備行のGK解決用）
        const nameToRid = {};
        Object.entries(roster || {}).forEach(([rid2, data]) => {
          if (!data) return;
          nameToRid[rosterDisplayName(data)] = rid2;
          if (data.surname && !nameToRid[data.surname]) nameToRid[data.surname] = rid2;
        });
        const byRoster = {};
        const push = (rid2, row) => {
          if (!byRoster[rid2]) byRoster[rid2] = {};
          byRoster[rid2][Object.keys(byRoster[rid2]).length] = row;
        };
        for (const row of matchData.rows) {
          if (row.mode === 'defense') {
            // 守備行は当該GKに配信（セーブ率・被シュート統計用）
            const gkName = row.gk || '';
            const gkRid = nameToRid[gkName] || nameToRid[parseAnalyzerName(gkName).surname] || null;
            if (gkRid) push(gkRid, row);
            continue;

          const rid = row.rosterId;
          if (!rid) continue;
          push(rid, row);
        }
        let savedPlayers = 0, skippedNoUid = 0;

        for (const [rid, rowsObj] of Object.entries(byRoster)) {

          try {
            await storage.saveGameStatsBulk(targetUid, gameId, rowsObj);

        await storage.markMatchImported(matchId, authUid);
        return { ok: true, savedPlayers, skippedNoUid };

          // ログイン画面に名簿が出ない。起動時に匿名サインインしておく
          if (!user) {
            fbAuth.signInAnonymously().catch((e) => console.warn('[anon auth]', e));
          }
        });
        return unsub;
      }, []);

      // ── クラウドからのリアルタイム同期（自分のデータ）
      useEffect(() => {
        if (!authUid || !state.user) return;
        setSyncStatus('syncing');
        firstCloudLoadRef.current = false;
        const unsub = storage.subscribeCloud(authUid, (cloudState) => {
          if (cloudState) {
            const json = JSON.stringify(cloudState);
            if (json === lastCloudJsonRef.current) {
              setSyncStatus('synced');
              return;
            }
            // ローカルの方が新しい（オフライン中の変更）→ クラウドで上書きしない
            const localTs = (stateRef.current && stateRef.current.localUpdatedAt) || 0;
            const cloudTs = cloudState.localUpdatedAt || 0;
            if (localTs > cloudTs) {
              lastCloudJsonRef.current = ''; // useEffectに再アップロードを促す
              setSyncStatus('synced');
              return;
            }
            lastCloudJsonRef.current = json;
            setState(prev => ({ ...defaultState(), ...prev, ...cloudState }));
            setSyncStatus('synced');
          } else {
            // クラウドに無い → 初回アップロード
            const json = JSON.stringify(state);
            lastCloudJsonRef.current = json;
            storage.saveCloud(authUid, state).then(() => setSyncStatus('synced'));
          }
          firstCloudLoadRef.current = true;
        });
        return unsub;
      }, [authUid, state.user && state.user.id]);

      // ── 顧問モード: 全選手データ購読
      useEffect(() => {
        if (!authUid || !state.user || !state.user.isCoach) {
          setAllUsersData({});
          return;
        }
        const unsub = storage.subscribeAllUsers(setAllUsersData);
        return unsub;
      }, [authUid, state.user && state.user.isCoach]);

      // ── 永続化: localStorage 即時 + RTDB デバウンス（500ms）
      useEffect(() => {
        storage.saveCache(state);
        if (!authUid || !state.user) return;
        const json = JSON.stringify(state);
        if (json === lastCloudJsonRef.current) return; // クラウドから来たデータは送り返さない
        if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
        setSyncStatus('syncing');
        writeTimerRef.current = setTimeout(() => {
          lastCloudJsonRef.current = json;
          storage.saveCloud(authUid, state)
            .then(() => setSyncStatus('synced'))
            .catch(() => setSyncStatus('offline'));
        }, 500);
      }, [state, authUid]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      // 認証準備中
      if (!authReady) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">接続中...</p>
          </div>
        );
      }

      // ログイン画面（プロフィール未設定 or Firebase認証なし）
      if (!state.user) {
        return (
          <>
            <Login
              roster={roster}
              rosterLoaded={rosterLoaded}
              rosterToUid={rosterToUid}
              authUid={authUid}
              onLogin={async (userInput) => {
                try {
                  let uid = authUid;
                  if (!uid && fbAuth) {
                    const cred = await fbAuth.signInAnonymously();
                    uid = cred.user.uid;
                  }
                  const finalUser = {
                    ...userInput,
                    id: uid || userInput.id, // Firebase uid を採用（失敗時はローカルid）
                  };
                  // rosterId が指定されていれば双方向マップを保存
                  if (userInput.rosterId && uid) {
                    try { await storage.linkRosterToUid(userInput.rosterId, uid); }
                    catch (e) { console.warn('[link roster]', e); }
                  }
                  setState(prev => ({ ...prev, user: finalUser }));
                } catch (e) {
                  console.error('[Login] auth failed:', e);
                  alert('オンライン接続に失敗しました。インターネット接続を確認してください。\n' + e.message);
                }
              }}
            />
            {toast && <div className="toast">{toast}</div>}
          </>
        );
      }

      const update = (patch) => setState(prev => ({ ...prev, ...patch, localUpdatedAt: Date.now() }));
      const handleLogout = async () => {
        if (!confirm('ログアウトしますか？\n\n⚠ ログアウトするとこの端末のアカウントは復元できません。再登録時は名簿から自分を選び直す形になります（クラウドの記録は顧問側に残ります）。\n通常はログアウト不要——アプリを閉じるだけでOKです。')) return;
        try { if (fbAuth) await fbAuth.signOut(); } catch (e) { console.warn(e); }
        localStorage.removeItem(PIN_KEY);
        localStorage.removeItem(NAME_KEY);
        localStorage.removeItem(CACHE_KEY);
        lastCloudJsonRef.current = '';
        setState(defaultState());
      };

      // ── マネージャー専用画面: フィジカル入力のみ（メンタルデータには一切触れさせない）
      // 実権限は常に isApprovedStaff でゲート。isManager はローカルの表示トグル。
      if (state.user.isManager && isApprovedStaff) {
        return (
          <div className="app">
            <Header
              user={state.user}
              syncStatus={syncStatus}
              onLogout={handleLogout}
              onCoachToggle={() => update({ user: { ...state.user, isManager: !state.user.isManager } })}
              canCoach={isApprovedStaff}
              coachToggleLabel={{ on: '通常モードに戻る', off: 'マネージャーモードに切替' }}
              team={team}
            />
            <div className="content">
              <PhysicalAdmin
                roster={roster}
                rosterToUid={rosterToUid}
                authUid={authUid}
                byRole="manager"
                showToast={showToast}
                heading="マネージャー: フィジカル入力"
              />
            </div>
            {toast && <div className="toast">{toast}</div>}
          </div>
        );
      }

      return (
        <div className="app">
          <Header
            user={state.user}
            syncStatus={syncStatus}
            onLogout={handleLogout}
            onCoachToggle={() => update({ user: { ...state.user, isCoach: !state.user.isCoach } })}
            canCoach={state.user.isCoach || isApprovedCoach}
            onManagerToggle={isApprovedStaff ? (() => update({ user: { ...state.user, isManager: true } })) : null}
            team={team}
          />
          <div className="content">
            {view === 'home' && <Home state={state} onNav={setView} team={team} update={update} myCoachNotes={myCoachNotes} myGameStats={myGameStats} onWriteReflection={openReflection} showToast={showToast} labLoop={labLoop} />}
            {view === 'breath' && <BreathingGuide state={state} update={update} showToast={showToast} />}
            {view === 'pregame' && <PreGame state={state} team={team} update={update} showToast={showToast} onNav={setView} />}
            {view === 'ayumi' && <Ayumi state={state} myGameStats={myGameStats} />}
            {view === 'coachnotes' && <CoachNotesView notes={myCoachNotes} />}
            {view === 'reflection' && (
              <Reflections
                state={state}
                update={update}
                showToast={showToast}
                prefill={reflectionPrefill}
                onConsumePrefill={() => setReflectionPrefill(null)}
              />
            )}
            {view === 'izof' && (
              <Izof state={state} update={update} showToast={showToast} myGameStats={myGameStats} />
            )}
            {view === 'selfcheck' && (
              <SelfCheck state={state} update={update} showToast={showToast} onNav={setView} />
            )}
            {view === 'works' && (
              <SessionWorks state={state} update={update} showToast={showToast} team={team} />
            )}
            {view === 'declaration' && (
              <Declarations state={state} update={update} showToast={showToast} />
            )}
            {view === 'monthly' && (
              <Monthly state={state} update={update} showToast={showToast} />
            )}
            {view === 'stats' && !state.user.isCoach && (
              <MyStats state={state} myGameStats={myGameStats} myPhysicals={myPhysicals} authUid={authUid} onNav={setView} onWriteReflection={openReflection} showToast={showToast} update={update} />
            )}
            {view === 'physadmin' && state.user.isCoach && isApprovedCoach && (
              <PhysicalAdmin
                roster={roster}
                rosterToUid={rosterToUid}
                authUid={authUid}
                byRole="coach"
                showToast={showToast}
                heading="フィジカル入力"
                onBack={() => setView('coach')}
              />
            )}
            {view === 'coach' && state.user.isCoach && (
              isApprovedCoach ? (
                <CoachDashboard
                  state={state}
                  allUsersData={allUsersData}
                  roster={roster}
                  rosterToUid={rosterToUid}
                  matches={matches}
                  autoImport={autoImport}
                  onToggleAutoImport={(v) => { setAutoImport(v); localStorage.setItem('mental_auto_import', v ? '1' : '0'); }}
                  importMatch={importMatch}
                  isApprovedCoach={isApprovedCoach}
                  myUid={authUid}
                  showToast={showToast}
                  team={team}
                  saveTeam={storage.saveTeam}
                  onNav={setView}
                />
              ) : (
                <CoachApprovalPending myUid={authUid} showToast={showToast} />
              )
            )}
          </div>
          <BottomNav view={view} onChange={setView} isCoach={state.user.isCoach} />
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    // ====== Login ======
    function Login({ onLogin, roster, rosterLoaded, rosterToUid, authUid }) {
      const [pin, setPin] = useState('');
      const [savedPin, setSavedPin] = useState(localStorage.getItem(PIN_KEY) || '');
      const [savedName, setSavedName] = useState(localStorage.getItem(NAME_KEY) || '');
      const [busy, setBusy] = useState(false);
      const [selectedRosterId, setSelectedRosterId] = useState(null);
      const [filterGrade, setFilterGrade] = useState('all');
      const [coachMode, setCoachMode] = useState(false); // 顧問として登録するか
      const [playerMode, setPlayerMode] = useState(true); // 初期は選手画面（顧問は下部ボタンから）
      const [coachName, setCoachName] = useState('');

      // 名簿リスト（active && 未連携優先）
      const rosterList = useMemo(() => {
        const arr = Object.entries(roster || {}).map(([id, data]) => {
          const linkedUid = (rosterToUid && rosterToUid[id]) || null;
          return {
            id,
            ...data,
            grade: computeGrade(data.enrollmentYear),
            displayName: rosterDisplayName(data),
            linked: !!linkedUid,
            linkedToMe: !!(linkedUid && authUid && linkedUid === authUid)
          };
        }).filter(e => e.active !== false);
        arr.sort((a, b) => {
          if (a.linked !== b.linked) return a.linked ? 1 : -1; // 未連携を上に
          if (a.grade !== b.grade) return a.grade - b.grade;
          return (a.surname || '').localeCompare(b.surname || '', 'ja');
        });
        return arr;
      }, [roster, rosterToUid, authUid]);

      const filtered = filterGrade === 'all' ? rosterList : rosterList.filter(e => e.grade === Number(filterGrade));
      const selectedEntry = rosterList.find(e => e.id === selectedRosterId);

      // 選手として登録（名簿選択）
      const handleRegisterAsPlayer = async () => {
        if (!selectedEntry) { alert('名簿から自分を選択してください'); return; }
        if (!pin || pin.length !== 4) { alert('4桁PINを入力してください'); return; }
        if (selectedEntry.linked && !selectedEntry.linkedToMe) {
          if (!confirm('「' + (selectedEntry.fullName || selectedEntry.surname) + '」は既に別の端末で登録されています。\n\n自分の機種変更・再登録なら「OK」（この端末が新しい本人の端末になります。以前の記録は顧問に相談）。\n他人の枠なら「キャンセル」してください。')) return;
        }
        setBusy(true);
        const hash = await hashPinV2(pin);
        const displayName = selectedEntry.fullName || selectedEntry.surname;
        localStorage.setItem(PIN_KEY, hash);
        localStorage.setItem(NAME_KEY, displayName);
        const user = {
          id: uid(),
          name: displayName,
          grade: selectedEntry.grade,
          position: selectedEntry.position || '',
          rosterId: selectedRosterId,
          enrollmentYear: selectedEntry.enrollmentYear,
          createdAt: Date.now(),
          isCoach: false
        };
        try { await onLogin(user); } finally { setBusy(false); }
      };

      // 顧問として登録（名簿に居ない）
      const handleRegisterAsCoach = async () => {
        if (!coachName) { alert('顧問名を入力してください'); return; }
        if (!pin || pin.length !== 4) { alert('4桁PINを入力してください'); return; }
        setBusy(true);
        const hash = await hashPinV2(pin);
        localStorage.setItem(PIN_KEY, hash);
        localStorage.setItem(NAME_KEY, coachName);
        const user = {
          id: uid(),
          name: coachName,
          grade: 0,
          position: '顧問',
          rosterId: null,
          createdAt: Date.now(),
          isCoach: true
        };
        try { await onLogin(user); } finally { setBusy(false); }
      };

      const handleLogin = async () => {
        const ok = await verifyPin(pin, savedPin);
        if (!ok) {
          alert('PINが違います');
          return;
        }
        // 旧v1形式で保存されていた端末は、ログイン成功時に v2 形式へ無停止移行
        if (savedPin.indexOf('v2:') !== 0) {
          try {
            const nh = await hashPinV2(pin);
            localStorage.setItem(PIN_KEY, nh);
            setSavedPin(nh);
          } catch (e) { /* 移行失敗しても旧形式のまま動作継続 */ }
        }
        setBusy(true);
        const saved = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        const user = (saved && saved.user) ? saved.user : { id: uid(), name: savedName, grade: 0, position: '', createdAt: Date.now(), isCoach: false };
        try { await onLogin(user); } finally { setBusy(false); }
      };

      const handleReset = () => {
        if (!confirm('この端末の全データを削除して最初からやり直しますか？\n（クラウド側のデータは残ります）')) return;
        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(PIN_KEY);
        localStorage.removeItem(NAME_KEY);
        location.reload();
      };

      // ── 既にこの端末で登録済（PIN入力モード）
      if (savedPin) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">{savedName} さん、お帰りなさい</p>
            <div className="login-card">
              <h2>PIN を入力</h2>
              <div className="form-group">
                <input
                  type="password"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  maxLength="4"
                  className="pin-input"
                  value={pin}
                  onChange={e => setPin(e.target.value.replace(/[^0-9]/g, ''))}
                  placeholder="••••"
                />
              </div>
              <button className="btn" disabled={busy} onClick={handleLogin}>{busy ? '接続中...' : 'ログイン'}</button>
              <div style={{marginTop:12, textAlign:'center'}}>
                <button className="btn-ghost" onClick={handleReset}>データを削除して初期化</button>
              </div>
            </div>
          </div>
        );
      }

      // ── 役割選択（最初の画面）
      if (!coachMode && !playerMode) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">男子ハンドボール部 メンタル指導</p>
            <div className="login-card">
              <h2 style={{textAlign:'center', marginBottom:20}}>あなたは？</h2>
              <button
                className="btn"
                style={{padding:'18px', fontSize:'17px', marginBottom:14}}
                onClick={() => setPlayerMode(true)}
              >
                🤾 選手としてはじめる
              </button>
              <button
                className="btn btn-secondary"
                style={{padding:'18px', fontSize:'17px'}}
                onClick={() => setCoachMode(true)}
              >
                📋 顧問・コーチとしてはじめる
              </button>
              <p className="text-small text-muted" style={{textAlign:'center', marginTop:20, lineHeight:1.6}}>
                選手 → 名簿から自分を選んでPIN設定<br/>
                顧問 → 名前とPINで登録（承認制）
              </p>
            </div>
          </div>
        );
      }

      // ── 顧問登録モード
      if (coachMode) {
        return (
          <div className="login">
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">顧問・コーチ登録</p>
            <div className="login-card">
              <h2>顧問として登録</h2>
              <div className="form-group">
                <label>お名前</label>
                <input value={coachName} onChange={e => setCoachName(e.target.value)} placeholder="例: 山田先生" />
              </div>
              <div className="form-group">
                <label>4桁PIN（次回からこれでログイン）</label>
                <input
                  type="password" inputMode="numeric" pattern="[0-9]*" maxLength="4"
                  className="pin-input" value={pin}
                  onChange={e => setPin(e.target.value.replace(/[^0-9]/g,''))}
                  placeholder="••••"
                />
              </div>
              <button className="btn" disabled={busy} onClick={handleRegisterAsCoach}>{busy ? '接続中...' : '登録して開始'}</button>
              <div style={{marginTop:12, textAlign:'center'}}>
                <button className="btn-ghost" onClick={() => setCoachMode(false)}>← 戻る</button>
              </div>
            </div>
          </div>
        );
      }

      // ── 選手登録モード（名簿から選択）
      return (
        <div className="login" style={{padding:'24px 16px', alignItems:'stretch'}}>
          <div style={{textAlign:'center', marginBottom:24}}>
            <h1>HANDBALL <span style={{color:'var(--primary)'}}>MENTAL</span></h1>
            <p className="subtitle">男子ハンドボール部 メンタル指導</p>
          </div>

          {rosterList.length === 0 && !rosterLoaded ? (
            <div className="login-card" style={{maxWidth:480, margin:'0 auto'}}>
              <h2>名簿を読み込み中…</h2>
              <p className="text-small text-muted" style={{marginBottom:16}}>
                通信状態を確認しています。しばらく待っても表示されない場合は、電波の良い場所でアプリを開き直してください。
              </p>
            </div>
          ) : rosterList.length === 0 ? (
            <div className="login-card" style={{maxWidth:480, margin:'0 auto'}}>
              <h2>名簿がまだありません</h2>
              <p className="text-small text-muted" style={{marginBottom:16}}>
                顧問の方が「顧問 → 名簿管理」で選手を登録すると、ここに一覧が出ます。
              </p>
              <button className="btn" onClick={() => setCoachMode(true)}>📋 顧問として登録する</button>
            </div>
          ) : (
            <div style={{maxWidth:480, margin:'0 auto', width:'100%'}}>
              <div className="login-card">
                <h2>① 自分を選択</h2>
                <div className="chip-group" style={{marginBottom:12, flexWrap:'wrap'}}>
                  {['all','1','2','3'].map(g => (
                    <div key={g}
                      className={'chip ' + (filterGrade === g ? 'selected' : '')}
                      onClick={() => setFilterGrade(g)}
                    >{g === 'all' ? '全' : g + '年'}</div>
                  ))}
                </div>
                <div style={{maxHeight:300, overflowY:'auto', border:'1px solid var(--border)', borderRadius:8, padding:4}}>
                  {filtered.map(e => (
                    <div key={e.id}
                      onClick={() => setSelectedRosterId(e.id)}
                      style={{
                        padding:'10px 12px', margin:'4px 0', borderRadius:6, cursor: 'pointer',
                        background: selectedRosterId === e.id ? 'rgba(45,212,191,0.2)' : (e.linked && !e.linkedToMe ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.05)'),
                        border: selectedRosterId === e.id ? '1px solid var(--primary)' : '1px solid transparent',
                        opacity: e.linked && !e.linkedToMe ? 0.55 : 1
                      }}>
                      <div style={{fontSize:'15px', fontWeight: e.linked && !e.linkedToMe ? 'normal' : 'bold'}}>
                        {e.displayName} {e.fullName && <span className="text-small text-muted">{e.fullName}</span>}
                        {e.linkedToMe ? <span className="text-small" style={{marginLeft:8, color:'var(--primary)'}}>(この端末で登録済み)</span>
                          : e.linked ? <span className="text-small text-muted" style={{marginLeft:8}}>(別端末で登録済み)</span> : null}
                      </div>
                      <div className="text-small text-muted">
                        {e.grade > 0 && e.grade <= 3 ? `${e.grade}年` : ''}
                        {e.position && ` / ${e.position}`}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {selectedEntry && (
                <div className="login-card" style={{marginTop:12}}>
                  <h2>② PIN を設定</h2>
                  <p className="text-small text-muted" style={{marginTop:-8, marginBottom:12}}>
                    選択: <strong style={{color:'var(--primary)'}}>{selectedEntry.displayName}</strong>
                    {selectedEntry.fullName && <span>（{selectedEntry.fullName}）</span>}
                  </p>
                  <div className="form-group">
                    <label>4桁PIN（次回からこれでログイン）</label>
                    <input
                      type="password" inputMode="numeric" pattern="[0-9]*" maxLength="4"
                      className="pin-input" value={pin}
                      onChange={e => setPin(e.target.value.replace(/[^0-9]/g,''))}
                      placeholder="••••"
                    />
                  </div>
                  <button className="btn" disabled={busy || !pin || pin.length !== 4} onClick={handleRegisterAsPlayer}>{busy ? '接続中...' : '登録して開始'}</button>
                </div>
              )}

              <div style={{textAlign:'center', marginTop:16}}>
                <button className="btn-ghost" onClick={() => setCoachMode(true)}>📋 顧問・コーチの方はこちら</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ====== Header ======
    function Header({ user, syncStatus, onLogout, onCoachToggle, canCoach, team, onManagerToggle, coachToggleLabel }) {
      const [menuOpen, setMenuOpen] = useState(false);
      const ctLabel = coachToggleLabel || { on: '選手モードに戻る', off: '顧問モードに切替' };
      const syncDot = {
        cache:   { color: '#94a3b8', title: 'ローカルのみ' },
        syncing: { color: '#fbbf24', title: 'クラウド同期中...' },
        synced:  { color: '#10b981', title: 'クラウド同期済' },
        offline: { color: '#ef4444', title: 'オフライン' }
      }[syncStatus || 'cache'];
      return (
        <div className="header">
          <div>
            <div className="header-name">
              {user.name}
              {user.isCoach && <span className="badge-coach" style={{marginLeft:8}}>顧問</span>}

    // ====== あゆみ（1年の物語・読み取り専用。評価でなく事実の蓄積） ======
    function Ayumi({ state, myGameStats }) {
      const ROUND_LABEL = { baseline: '1回目(6月)', midterm: '中間(1月)', final: '最終(6月)' };
      const scs = state.selfChecks || [];
      const first = scs.length > 1 ? scs[scs.length - 1] : null;
      const latest = scs[0] || null;
      const decls = state.declarations || [];
      const totalChecks = decls.reduce((s, d) => s + ((d.checks || []).length), 0);
      const completedDecls = decls.filter(d => d.completed);
      const { games, total } = aggregateGameStats(myGameStats || {});
      const bests = (state.reflections || []).filter(r => r.bestPlay).slice().sort((a, b) => (a.gameDate || '').localeCompare(b.gameDate || ''));
      const words = (state.reflections || []).filter(r => r.coachWord).slice().sort((a, b) => (a.gameDate || '').localeCompare(b.gameDate || ''));
      const empty = !latest && totalChecks === 0 && games.length === 0 && bests.length === 0;
      return (
        <>
          <div className="section-h">📖 あゆみ — 自分で積んだ記録</div>
          {empty && (
            <div className="empty">
              <div className="empty-icon">📖</div>
              <div>まだ記録が少ない</div>
              <div className="text-small">宣言・振り返り・セルフチェックがたまると、ここに1年の物語が編まれていく</div>
            </div>
          )}

          {latest && (
            <div className="card">
              <div className="card-title">🧭 心の5つの力</div>
              <div className="card-subtitle">{ROUND_LABEL[latest.round] || latest.round}（{latest.date}）</div>
              <SelfCheckBars scores={latest.axisScores} />
              {first && first !== latest && (
                <div className="text-small text-muted" style={{marginTop:10}}>
                  {ROUND_LABEL[first.round] || first.round}からの変化:
                  {SC_AXES.map(ax => {
                    const dd = (latest.axisScores[ax.key] || 0) - (first.axisScores[ax.key] || 0);
                    return ` ${ax.name.slice(0,2)}${dd > 0 ? '+' + dd : dd === 0 ? '±0' : dd}`;
                  }).join(' /')}
                </div>
              )}
            </div>
          )}

          {(totalChecks > 0 || completedDecls.length > 0) && (
            <div className="card">
              <div className="card-title">✅ 行動宣言のあゆみ</div>
              <div className="summary-stats" style={{marginTop:12}}>
                <div className="stat-card"><div className="num">{totalChecks}</div><div className="label">積んだ日数</div></div>
                <div className="stat-card"><div className="num">{completedDecls.length}</div><div className="label">やり切った宣言</div></div>
              </div>
              {completedDecls.slice(0, 6).map(d => (
                <div key={d.id} className="stat-row"><span className="label">{d.startDate}〜</span><span className="value" style={{maxWidth:'70%', textAlign:'right'}}>{d.declaration}（{(d.checks || []).length}日）</span></div>
              ))}
            </div>
          )}

          {games.length > 0 && (
            <div className="card">
              <div className="card-title">🤾 試合のあゆみ</div>
              <div className="summary-stats" style={{marginTop:12}}>
                <div className="stat-card"><div className="num">{games.length}</div><div className="label">試合</div></div>
                <div className="stat-card"><div className="num">{total.goals}</div><div className="label">ゴール</div></div>
                <div className="stat-card"><div className="num">{total.faced > 0 ? total.saves : total.goalRate + '%'}</div><div className="label">{total.faced > 0 ? 'セーブ' : '決定率'}</div></div>
              </div>
            </div>
          )}

          {bests.length > 0 && (
            <div className="card">
              <div className="card-title">⭐ ベストプレー年表</div>
              {bests.map(r => (
                <div key={r.id} className="stat-row"><span className="label">{(r.gameDate || '').slice(5)}</span><span className="value" style={{maxWidth:'75%', textAlign:'right'}}>{r.bestPlay}</span></div>
              ))}
            </div>
          )}

          {words.length > 0 && (
            <div className="card">
              <div className="card-title">💬 心に残った言葉</div>
              {words.map(r => (
                <div key={r.id} className="stat-row"><span className="label">{(r.gameDate || '').slice(5)}</span><span className="value" style={{maxWidth:'75%', textAlign:'right'}}>「{r.coachWord}」</span></div>
              ))}
            </div>
          )}

          {!empty && (
            <div className="card" style={{borderLeft:'3px solid var(--primary)'}}>
              <div className="card-subtitle" style={{fontWeight:700}}>これ全部、自分で積んだ記録。続けてきたのは自分だ。</div>
            </div>
          )}
        </>
      );
    }

    // ====== 試合前モード（アップ前の3分で見るものを1画面に） ======
    function PreGame({ state, team, update, showToast, onNav }) {
      const [recording, setRecording] = useState(false);
      const izofType = normIzofType(state.user.izofType) || '';
      const lastTask = (state.reflections || []).find(r => r.nextTask);
      const todayRec = (state.izofRecords || []).find(r => r.date === todayStr());
      const typeTips = {
        '低覚醒型': 'リラックスでベスト。深呼吸・静かに集中。上がりすぎたら2-3-15。',
        '中間型': 'ほどよい緊張でベスト。軽い声出し・ストレッチ。上がりすぎは“ちょい戻し”。',
        '高覚醒型': '興奮状態でベスト。アップビート・ハイタッチで上げる。呼吸は「明らかに過剰」の時だけ1〜2サイクル。'
      };
      const saveRec = (record) => {
        update({ izofRecords: [{ ...record, id: uid(), createdAt: Date.now(), context: record.context || '試合前' }, ...state.izofRecords] });
        setRecording(false);
        showToast('記録した——試合後の振り返りに自動でつながる');
      };
      return (
        <>
          <div className="section-h">🏟 試合前モード</div>

          {lastTask && (
            <div className="card" style={{borderLeft:'3px solid var(--primary)'}}>
              <div className="text-small" style={{color:'var(--text-2)'}}>🎯 前回の課題（{lastTask.gameDate} vs {lastTask.opponent}）</div>
              <div style={{fontWeight:800, fontSize:16, marginTop:4}}>{lastTask.nextTask}</div>
            </div>
          )}

          <div className="card">
            <div className="card-title">自分の型：{izofType || '未設定'}</div>
            <div className="card-subtitle">{izofType ? typeTips[izofType] : 'IZOFタブで型を設定すると、ここに自分用の整え方が出る'}</div>
          </div>

          {team && (team.theme || team.aikotoba || team.breathingRule) && (
            <div className="card">
              <div className="card-title">チーム</div>
              {team.theme && <div className="stat-row"><span className="label">今日のテーマ</span><span className="value">{team.theme}</span></div>}
              {team.aikotoba && <div className="stat-row"><span className="label">合言葉</span><span className="value">{team.aikotoba}</span></div>}
              {team.breathingRule && <div className="stat-row"><span className="label">2-3-15ルール</span><span className="value">{team.breathingRule}</span></div>}
            </div>
          )}

          {todayRec ? (
            <div className="card" style={{borderLeft:'3px solid var(--success)'}}>
              <div className="card-title">✓ 今日の状態は記録済み</div>
              <div className="card-subtitle">緊張:{todayRec.tension} 集中:{todayRec.focus} 自信:{todayRec.confidence} 体調:{todayRec.condition}（試合後の振り返りに自動転記される）</div>
            </div>
          ) : (
            <button className="btn mb-16" onClick={() => setRecording(true)}>🎯 今の状態を記録する</button>
          )}

          <button className="btn-ghost" style={{width:'100%'}} onClick={() => onNav('breath')}>🌬 呼吸ガイドを開く（整えたい人）</button>

          {recording && <IzofEditor onSave={saveRec} onCancel={() => setRecording(false)} />}
        </>
      );
    }

    // ====== Home ======
    function Home({ state, onNav, team, update, myCoachNotes, myGameStats, onWriteReflection, showToast, labLoop }) {
      const today = new Date();
      const hour = today.getHours();
      const greeting = hour < 11 ? 'おはよう' : hour < 18 ? 'こんにちは' : 'お疲れ様';
      const recentReflection = state.reflections[0];
      const activeDecl = state.declarations.find(d => !d.completed);
      const declCheckedDays = activeDecl ? (activeDecl.checks || []).length : 0;

      return (
        <>
          <h2 className="greeting">{greeting}、{state.user.name}</h2>
          <p className="greeting-sub">{today.getMonth()+1}月{today.getDate()}日 ({['日','月','火','水','木','金','土'][today.getDay()]})</p>

          {/* LAB試合ループ位相カード（LABで次の試合日を設定した選手のみ・平常時は非表示） */}
          {labLoop && (() => {
            const info = labLoopPhase(labLoop.nextMatch);
            if (info.phase === 'predict') {
              const opp = labLoop.nextMatch.opponent ? ` vs ${labLoop.nextMatch.opponent}` : '';
              return (
                <div className="card" style={{borderLeft:'3px solid var(--primary)', cursor:'pointer'}} onClick={() => onNav('pregame')}>
                  <div className="card-title">🏟 {info.days === 0 ? '今日は試合！' : `試合まであと${info.days}日`}{opp}</div>
                  <div className="card-subtitle">
                    {info.days === 0
                      ? 'アップ前の3分 — 試合前モードへ（タップ）'
                      : 'IZOFで自分のゾーンを確認して、試合前モードの流れを見ておこう（タップ）'}
                  </div>
                </div>
              );
            }
            if (info.phase === 'verify') {
              const gameDate = labLoop.nextMatch.date;
              const hasRef = (state.reflections || []).some(r => r.gameDate === gameDate);
              if (hasRef) return null;
              return (
                <div className="card" style={{borderLeft:'3px solid var(--accent)', cursor:'pointer'}}
                  onClick={() => onWriteReflection({ gameDate, opponent: labLoop.nextMatch.opponent || '' })}>
                  <div className="card-title">📝 試合おつかれさま</div>
                  <div className="card-subtitle">気持ちが新しいうちに振り返りを書こう（タップ）。LABの読みの丸付けもお忘れなく</div>
                </div>
              );
            }
            return null;
          })()}

          {activeDecl && update && (() => {
            const ds = todayStr();
            const done = (activeDecl.checks || []).includes(ds);
            const endD = new Date(activeDecl.startDate + 'T00:00:00');
            endD.setDate(endD.getDate() + 27);
            const ended = ds > dateStr(endD);
            return (
              <div className="card" style={{borderLeft: done ? '3px solid var(--success)' : '3px solid var(--primary)'}}>
                <div className="card-subtitle" style={{marginBottom:8}}>今日の宣言：{activeDecl.declaration}</div>
                {ended ? (
                  <button className="btn btn-secondary" style={{width:'100%'}} onClick={() => onNav('declaration')}>🎉 28日間おつかれさま！【宣言】で完了して次へ →</button>
                ) : done ? (
                  <div style={{fontWeight:700, color:'var(--success)'}}>✓ 今日もチェック済み（{declCheckedDays} / 28日）</div>
                ) : (
                  <button className="btn" style={{width:'100%'}} onClick={() => {
                    update({ declarations: state.declarations.map(x => x.id === activeDecl.id ? { ...x, checks: [...(x.checks || []), ds] } : x) });
                  }}>✓ 今日やった！（いま {declCheckedDays} / 28日）</button>
                )}
              </div>
            );
          })()}

          {/* 試合データ着弾 → 振り返り導線（数字と気持ちをつなぐ） */}
          {myGameStats && onWriteReflection && (() => {
            const { games } = aggregateGameStats(myGameStats);
            const latest = games[0];
            if (!latest || !latest.date) return null;
            const hasRef = (state.reflections || []).some(r => r.gameDate === latest.date);
            if (hasRef) return null;
            return (
              <div className="card" style={{borderLeft:'3px solid var(--accent)', cursor:'pointer'}}
                onClick={() => onWriteReflection({ gameDate: latest.date, opponent: latest.opponent })}>
                <div className="card-title">📊 試合データが届いた</div>
                <div className="card-subtitle">{latest.date} vs {latest.opponent}{latest.faced > 0 ? `　🧤${latest.saves}セーブ` : `　${latest.goals}G/${latest.shots}S`}</div>
                <div className="text-small" style={{color:'var(--primary)', marginTop:6}}>→ 振り返りを書くと、数字と気持ちがつながる（タップ）</div>
              </div>
            );
          })()}

          {/* 前回の課題（自分で書いた nextTask を思い出させる） */}
          {(() => {
            const last = (state.reflections || []).find(r => r.nextTask);
            if (!last) return null;
            return (
              <div className="card">
                <div className="text-small" style={{color:'var(--text-2)'}}>🎯 前回の課題（{last.gameDate} vs {last.opponent}）</div>
                <div style={{fontWeight:700, marginTop:4}}>{last.nextTask}</div>
              </div>
            );
          })()}

          {myCoachNotes && Object.keys(myCoachNotes).length > 0 && (() => {
            const vn = Object.values(myCoachNotes).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 3);
            return (
              <div className="card" style={{cursor:'pointer'}} onClick={() => onNav('coachnotes')}>
                <div className="card-title">💬 顧問からのメモ（あなた宛て）</div>
                {vn.map((n, i) => (
                  <div key={i} className="text-small" style={{padding:'2px 0'}}>{n.date}　{n.text}</div>
                ))}
                <div className="text-small text-muted" style={{marginTop:6}}>タップで全部見返す →</div>
              </div>
            );
          })()}

          <div className="summary-stats">
            <div className="stat-card">
              <div className="num">{state.reflections.length}</div>
              <div className="label">試合振り返り</div>
            </div>
            <div className="stat-card">
              <div className="num">{declCheckedDays}</div>
              <div className="label">宣言の継続日</div>
            </div>
            <div className="stat-card">
              <div className="num">{state.izofRecords.length}</div>
              <div className="label">IZOF記録</div>
            </div>
          </div>

          <div className="section-h">クイックアクション</div>
          <div className="quick-grid">

              <span className="tile-icon">📝</span>
              <div className="tile-title">試合振り返り</div>
              <div className="tile-sub">試合後すぐ書く</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('izof')}>
              <span className="tile-icon">🎯</span>
              <div className="tile-title">IZOF記録</div>
              <div className="tile-sub">今の状態を残す</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('declaration')}>
              <span className="tile-icon">✅</span>
              <div className="tile-title">行動宣言</div>
              <div className="tile-sub">今日できたかチェック</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('monthly')}>
              <span className="tile-icon">📊</span>
              <div className="tile-title">月の振り返り</div>
              <div className="tile-sub">月末に書く</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('selfcheck')}>
              <span className="tile-icon">🧭</span>
              <div className="tile-title">セルフチェック</div>
              <div className="tile-sub">心の5つの力（年3回）</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('works')}>
              <span className="tile-icon">📒</span>
              <div className="tile-title">セッションワーク</div>
              <div className="tile-sub">紙の代わりにここに書く</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('breath')}>
              <span className="tile-icon">🌬</span>
              <div className="tile-title">呼吸ガイド</div>
              <div className="tile-sub">寝る前1サイクルからOK</div>
            </button>
            <button className="quick-tile" onClick={() => window.open('https://ganchi2014-tech.github.io/handball-system/', '_blank')}>

              <div className="tile-title">HANDBALL LAB</div>
              <div className="tile-sub">読み・技術はこっち</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('pregame')}>
              <span className="tile-icon">🏟</span>
              <div className="tile-title">試合前モード</div>
              <div className="tile-sub">アップ前の3分でこれ</div>
            </button>
            <button className="quick-tile" onClick={() => onNav('ayumi')}>
              <span className="tile-icon">📖</span>

              <div className="tile-sub">自分で積んだ記録</div>

          {team && (team.theme || team.aikotoba || team.breathingRule || team.norms || team.tryNow || team.voiceNotes) && (

    // ====== Reflections ======
    function Reflections({ state, update, showToast, prefill, onConsumePrefill }) {
      const [editing, setEditing] = useState(null);
      const reflections = state.reflections;

      // Home/マイ統計から「この試合の振り返りを書く」で遷移した場合、日付・相手を埋めて開く
      useEffect(() => {
        if (prefill) {
          setEditing(prefill);
          onConsumePrefill && onConsumePrefill();
        }
      }, [prefill]);

      const save = (data) => {
        let list;
        if (editing && editing.id) {
          list = reflections.map(r => r.id === editing.id ? { ...editing, ...data } : r);
        } else {
          list = [{ id: uid(), createdAt: Date.now(), ...data }, ...reflections];
        }
        update({ reflections: list });
        setEditing(null);
        showToast(editing && editing.id ? '更新しました' : '保存しました');
      };

      const del = (id) => {
        if (!confirm('削除しますか？')) return;
        update({ reflections: reflections.filter(r => r.id !== id) });
        setEditing(null);
        showToast('削除しました');
      };

      return (
        <>
          <div className="section-h">試合振り返り <span className="small">{reflections.length}件</span></div>
          <button className="btn mb-16" onClick={() => setEditing({})}>+ 新規振り返り</button>

          {reflections.length === 0 && (
            <div className="empty">
              <div className="empty-icon">📝</div>
              <div>まだ振り返りがありません</div>
              <div className="text-small">試合後にここに記録しよう</div>
            </div>
          )}

          {reflections.map(r => (
            <div key={r.id} className="list-item" onClick={() => setEditing(r)}>
              <div>
                <div className="title">vs {r.opponent || '(相手未入力)'}</div>
                <div className="sub">{r.gameDate} · 結果 {r.result || '?'}</div>
                {r.mentalFinding && <div className="sub" style={{marginTop:4, color:'var(--text-2)'}}>💭 {r.mentalFinding.slice(0,40)}{r.mentalFinding.length>40?'…':''}</div>}
              </div>
              <div className="right">
                <div className="score">{r.selfScore}</div>
                <div className="sub">/10</div>
              </div>
            </div>
          ))}

          {editing && (
            <ReflectionEditor
              initial={editing}
              izofRecords={state.izofRecords}
              onSave={save}
              onCancel={() => setEditing(null)}
              onDelete={editing.id ? () => del(editing.id) : null}
            />
          )}
        </>
      );
    }

        result: initial.result || '',

        improvePlay: initial.improvePlay || '',
        mentalFinding: initial.mentalFinding || '',
        nextTask: initial.nextTask || '',
        coachWord: initial.coachWord || '',

        izofSource: initial.izofSource || null, // 'auto'(IZOFタブから転記) | 'manual'(手入力) | null(デフォルト値のまま=型ヒントに使わない)
        preGameIzof: initial.preGameIzof || { tension: 3, focus: 3, confidence: 3, condition: 3 }

    // ====== IZOF ======
    function Izof({ state, update, showToast, myGameStats }) {
      const [adding, setAdding] = useState(false);
      const [izofType, setIzofType] = useState(normIzofType(state.user.izofType) || '');

      const save = (record) => {
        update({
          izofRecords: [{id: uid(), createdAt: Date.now(), ...record}, ...state.izofRecords],
          user: { ...state.user, izofType: izofType || state.user.izofType }
        });
        setAdding(false);
        showToast('保存しました');
      };

      return (
        <>
          <div className="section-h">IZOF（自分の最適ゾーン）</div>

          <div className="card">
            <div className="card-title">自分のIZOF型</div>
            <div className="card-subtitle">Session 1 で発見した型</div>
            <div className="chip-group">
              {['低覚醒型','中間型','高覚醒型'].map(t => (
                <div key={t}
                  className={'chip ' + (izofType === t ? 'selected' : '')}
                  onClick={() => { setIzofType(t); update({user: {...state.user, izofType: t}}); showToast('IZOF型を保存'); }}
                >{t}</div>
              ))}
            </div>
            <div className="text-small text-muted mt-16">
              {izofType === '低覚醒型' && '→ リラックスでベスト。深呼吸・静かな音楽が合う'}
              {izofType === '中間型' && '→ ほどよい緊張でベスト。軽い声出し・ストレッチ'}
              {izofType === '高覚醒型' && '→ 興奮状態でベスト。アップビート・ハイタッチ'}
            </div>
          </div>

          {(() => {
            const games = (state.reflections || []).filter(r => r.preGameIzof && r.izofSource && r.selfScore != null);
            const best = games.filter(r => r.selfScore >= 8);
            const pool = best.length >= 3 ? best.slice(0, 5) : (games.length >= 3 ? [...games].sort((a, b) => b.selfScore - a.selfScore).slice(0, 3) : []);
            if (pool.length < 3) {
              return (
                <div className="card">
                  <div className="card-title">🧭 型のヒント（自動）</div>
                  <div className="card-subtitle">
                    試合前にIZOFを記録→試合後に振り返りを書くと、<b>調子の良い試合が3件</b>たまった時点で、自分のデータから型のヒントが出ます（いま {games.length} 件）。<br/>
                    決め方の基準: ベスト時の緊張 <b>1-2＝低覚醒型／3＝中間型／4-5＝高覚醒型</b>。迷ったら中間型でスタート。
                  </div>
                </div>
              );
            }
            const ts = pool.map(r => r.preGameIzof.tension);
            const sorted = [...ts].sort((a, b) => a - b);
            const med = sorted[Math.floor(sorted.length / 2)];
            const hintType = med <= 2 ? '低覚醒型' : (med >= 4 ? '高覚醒型' : '中間型');
            return (
              <div className="card">
                <div className="card-title">🧭 型のヒント（自動・自分の試合データから）</div>
                <div className="card-subtitle">
                  調子の良かった試合{pool.length}件の「試合前の緊張度」: {ts.join(' / ')} → <b>{hintType}寄り</b><br/>
                  （基準: ベスト時の緊張 1-2＝低覚醒型／3＝中間型／4-5＝高覚醒型）<br/>
                  これは提案。<b>決めるのは自分</b>——上の型チップで選んで保存（自動では変えません）。
                </div>
              </div>
            );
          })()}

          {/* マイゾーン実証表: 緊張×調子×決定率を1行で並べ、型を自分のデータで確かめる */}
          {(() => {
            const rows = (state.reflections || []).filter(r => r.izofSource && r.selfScore != null && r.preGameIzof).slice(0, 12);
            if (rows.length === 0) return null;
            const { games } = aggregateGameStats(myGameStats || {});
            const byDate = {};
            games.forEach(g => { if (!byDate[g.date]) byDate[g.date] = g; });
            return (
              <div className="card">
                <div className="card-title">📊 マイゾーン実証表</div>
                <div className="card-subtitle">試合前の緊張 × 調子 × 数字。「自分の型」が本当か、自分のデータで確かめる。</div>
                {rows.map(r => {
                  const g = byDate[r.gameDate];
                  const num = g ? (g.faced > 0 ? `セーブ率${g.saveRate}%` : `決定率${g.goalRate}%`) : null;
                  return (
                    <div key={r.id} className="stat-row">
                      <span className="label">{(r.gameDate || '').slice(5)} {r.opponent ? `vs ${r.opponent.slice(0,6)}` : ''}</span>
                      <span className="value">緊張{r.preGameIzof.tension} ・ 調子{r.selfScore}/10{num ? ` ・ ${num}` : ''}{(r.usedTechniques && r.usedTechniques.length) ? ` ・ ${r.usedTechniques.join('')}` : ''}</span>
                    </div>
                  );
                })}
                <div className="text-small text-muted" style={{marginTop:8}}>調子の良い行の「緊張」が自分のゾーン。技が並ぶ行は、その技が効いた証拠かもしれない。</div>
              </div>
            );
          })()}

          <button className="btn mb-16" onClick={() => setAdding(true)}>+ 今の状態を記録</button>

          <div className="section-h">記録履歴 <span className="small">{state.izofRecords.length}件</span></div>
          {state.izofRecords.length === 0 && (
            <div className="empty">
              <div className="empty-icon">🎯</div>
              <div>まだ記録がありません</div>
            </div>
          )}
          {state.izofRecords.map(r => (
            <div key={r.id} className="list-item">
              <div>
                <div className="title">{r.date} {r.context ? `(${r.context})` : ''}</div>
                <div className="sub">緊張:{r.tension} 集中:{r.focus} 自信:{r.confidence} 体調:{r.condition}</div>
              </div>
            </div>
          ))}

          {adding && (
            <IzofEditor onSave={save} onCancel={() => setAdding(false)} />
          )}
        </>
      );
    }

    // ====== セルフチェック（心の5つの力・自作・自己採点） ======
    const SC_AXES = [
      { key:'m1', name:'緊張コントロール', mod:'M1 呼吸', items:[
        '試合前に緊張しても、自分なりに落ち着ける方だ',

      { key:'m5', name:'コミュニケーション', mod:'M5 声・つながり', items:[

        '仲間がミスした時、責めずに声をかけている',
        '困った時、1人で抱えこまずに相談できる'] },
    ];
    const SC_NUM = ['①','②','③','④','⑤'];
    const scRoundLabel = (r) => ({baseline:'1回目(6月)', midterm:'中間(1月)', final:'最終(6月)'}[r] || r);

    // ====== フィジカル測定 種目定義（全員 + GK専用） ======
    // lowerIsBetter: true=小さいほど良い（タイム系） / false=大きいほど良い（距離・回数・保持秒・率・点）
    // group: 'all'=全員 / 'gk'=GK限定（physItemsFor が myIsGK で出し分け）
    // reference:true = 参考扱い（標準化が難しく主指標から降格。入力は可能だが成長グラフでは控えめに表示）
    // tePct = この種目の測定誤差帯(typical error)を % で個別指定（未指定は PHYS_TE_PCT_DEFAULT）
    //
    // 測定誤差帯（A: 基準比%表示で「±この範囲は横ばい＝誤差内」とみなすグレー帯）の既定値[%]。
    // 4週ごとの1区間差は typical error に埋もれるため、暫定の汎用値。種目別の実測 TE が出たら tePct で上書き。
    const PHYS_TE_PCT_DEFAULT = 5;
    // tePct: 種目別の測定誤差帯[%]。リサーチ部門の文献近似（屋外電子計時 CV≈2.5-4% / 屋内・相互計測≈5-7% /
    //        COD・反応・GK系は ms級ばらつき大）。暫定値で、最終は現場の再現測定(各指標8回程度)で実TEを推定し較正する。
    //        未指定は ±PHYS_TE_PCT_DEFAULT(5%)。selfOnly: 査読済みの外部基準値が無く「自己比較のみ」で運用する指標。
    const PHYS_ITEMS = [
      { key:'sprint10m',  name:'10m走',            unit:'秒',  lowerIsBetter:true,  group:'all', tePct:4 },
      { key:'cod505_R',   name:'505切り返し(右)',  unit:'秒',  lowerIsBetter:true,  group:'all', tePct:7 },
      { key:'cod505_L',   name:'505切り返し(左)',  unit:'秒',  lowerIsBetter:true,  group:'all', tePct:7 },
      { key:'broadJump',  name:'立ち幅跳び',        unit:'cm', lowerIsBetter:false, group:'all' },
      { key:'sideStep',   name:'反復横跳び',        unit:'回', lowerIsBetter:false, group:'all' },
      { key:'shuttleRun', name:'20mシャトルラン',   unit:'回', lowerIsBetter:false, group:'all' },
      { key:'balance_R',  name:'片脚閉眼(右)',      unit:'秒', lowerIsBetter:false, group:'all' },
      { key:'balance_L',  name:'片脚閉眼(左)',      unit:'秒', lowerIsBetter:false, group:'all' },
      // ↓ 再検証(2026-06-18)で計画に明記した新指標。キーは既存に合わせ camelCase。
      { key:'brakeScore',         name:'制動スコア(減速)',   unit:'点', lowerIsBetter:false, group:'all', tePct:7 }, // rank2: 制動到達距離・現場ルーブリック（減速＝看板能力）。点=ルーブリック評点

    function SelfCheckEditor({ existing, onSave, onCancel }) {

        const m = new Date().getMonth() + 1;

        return existing.length === 0 ? 'baseline' : 'final';

      const [round, setRound] = useState(guessRound());

    function BreathingGuide({ state, update, showToast }) {
      const [tech, setTech] = useState(BREATH_TECHS[0]);
      const [st, setSt] = useState(null); // null=停止中 / {pi, left, cycles}
      useEffect(() => {
        if (!st) return;
        const t = setInterval(() => {
          setSt(prev => {
            if (!prev) return prev;
            if (prev.left > 1) return { ...prev, left: prev.left - 1 };
            const np = (prev.pi + 1) % tech.phases.length;
            return { pi: np, left: tech.phases[np][1], cycles: prev.cycles + (np === 0 ? 1 : 0) };
          });
        }, 1000);
        return () => clearInterval(t);
      }, [st !== null, tech]);
      const start = () => setSt({ pi: 0, left: tech.phases[0][1], cycles: 0 });
      const stop = () => setSt(null);
      return (
        <>

            {BREATH_TECHS.map(t => (

          </div>

            {st ? (
              <>
                <div style={{fontSize:16, color:'var(--text-2)'}}>{st.cycles + 1}サイクル目</div>
                <div style={{fontSize:32, fontWeight:800, margin:'6px 0'}}>{tech.phases[st.pi][0]}</div>
                <div style={{fontSize:64, fontWeight:800, color:'var(--primary)', lineHeight:1.1}}>{st.left}</div>
                <button className="btn-ghost mt-16" style={{width:'100%'}} onClick={stop}>おわる（{st.cycles}サイクルできた）</button>
              </>
            ) : (
